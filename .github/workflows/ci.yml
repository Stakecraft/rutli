name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly conformance run (Mondays 06:00 UTC) — heavier job, sees upstream Canton drift early.
    - cron: "0 6 * * 1"

env:
  CANTON_TAG: v3.6.1
  SBT_OPTS: "-Xmx4g -Xss8m"

# Least privilege for every job's GITHUB_TOKEN; nothing in CI writes to the repository.
permissions:
  contents: read

# Every job runs on `vars.CI_RUNNER` when that repository variable is set (e.g. `rutli-ci-kvm`, the
# self-hosted runner in deploy/ci-runner), otherwise on GitHub's `ubuntu-latest`. Pull requests
# from forks always go to `ubuntu-latest`: the self-hosted runner only takes this repository's own
# branches. A fork PR can rewrite this expression, so the runner enforces the same rule itself
# (deploy/ci-runner/job-started-guard.sh) and fork PR workflows need a maintainer's approval.
jobs:
  test:
    name: Unit tests + assembly
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache Canton API artifacts (ivy local)
        id: canton-cache
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/com.daml
          key: canton-api-${{ runner.os }}-${{ runner.arch }}-${{ env.CANTON_TAG }}-v1

      - name: Publish Canton kms-driver-api locally
        if: steps.canton-cache.outputs.cache-hit != 'true'
        run: scripts/publish-canton-deps.sh "$CANTON_TAG"

      - name: Test
        run: sbt -batch driver/test

      - name: Assemble driver jar
        run: sbt -batch driver/assembly

      - name: Third-party notices up to date (driver)
        run: scripts/third-party-licenses.sh --check jvm

      - uses: actions/upload-artifact@v4
        # Convenience only — the tests above are the gate. An upload failure (e.g. the org's
        # artifact storage quota) must not turn a green test run red.
        continue-on-error: true
        with:
          name: rutli-driver
          path: driver/target/scala-2.13/rutli-driver.jar
          retention-days: 7

  frost:
    name: FROST core (Rust)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit: GitHub's image happens to ship clippy, a self-hosted runner's rustup does not.
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frost
      - name: Test
        working-directory: frost
        run: cargo test --locked
      - name: Clippy
        working-directory: frost
        run: cargo clippy --all-targets -- -D warnings

  licenses:
    name: Dependency licenses (cargo-deny, notices)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned: frost/THIRD-PARTY-LICENSES.txt is compared byte for byte with cargo-about's output.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: frost
        run: cargo deny check advisories licenses bans sources
      - name: Third-party notices up to date (cosigner, dealer)
        run: scripts/third-party-licenses.sh --check rust

  deploy-policy:
    name: Deploy manifests policy (Helm + kustomize)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      # kubectl, yq (v4) and jq ship with the ubuntu runner image.
      - name: Lint, render, check-deploy-policy (fails on pods/exec RBAC, seal env, shared secrets)
        run: scripts/ci-deploy-policy.sh

  prometheus-rules:
    name: Alert rules (promtool)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyYAML (for render-prometheusrule.py)
        run: python -m pip install pyyaml==6.0.2
      # yq (v4) and docker ship with the ubuntu runner image and deploy/ci-runner's (which drives
      # the daemon it is given, with the work dir at the same path); promtool is the pinned
      # prom/prometheus image (by digest) the script runs.
      - name: promtool check rules (source + rendered PrometheusRule, render up to date)
        run: scripts/ci-prometheus-rules.sh

  frost-tls-smoke:
    name: FROST TLS cluster smoke
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: mTLS + sealed-share compose smoke (Health / DKG / Sign)
        run: scripts/ci-frost-tls-smoke.sh

  conformance:
    name: Canton conformance suite
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    # Heavy (publishes a large slice of Canton locally) — run on schedule/manual, not per-PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache Canton module closure (ivy local)
        id: canton-cache
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/com.daml
          key: canton-full-${{ runner.os }}-${{ runner.arch }}-${{ env.CANTON_TAG }}-v1

      # dpm is pinned by version and sha256 and installed without sudo. To bump: set DPM_VERSION to the
      # new release tag, then DPM_SHA256 to the linux-amd64 line of that release's
      # dpm-<version>-checksums.txt and confirm it against `shasum -a 256` of the downloaded tarball.
      # (The value below was cross-checked against the release's checksums file.)
      - name: Install dpm
        if: steps.canton-cache.outputs.cache-hit != 'true'
        env:
          DPM_VERSION: "1.0.22"
          DPM_SHA256: ebfdb2072e62e4b094f4cc1f9b221a5a6fd536644d88799da8e13bf936e088ff
        run: |
          set -euo pipefail
          tarball="dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${tarball}" "https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}/${tarball}"
          echo "${DPM_SHA256}  ${tmp}/${tarball}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" dpm
          install -m 0755 "${tmp}/dpm" "$HOME/.local/bin/dpm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dpm" --version

      - name: Publish Canton module closure locally
        if: steps.canton-cache.outputs.cache-hit != 'true'
        run: scripts/publish-canton-deps.sh --full "$CANTON_TAG"

      - name: Conformance tests
        # Canton >= 3.6 refuses to pick a protocol version implicitly when CI=true (which GitHub
        # Actions always sets) — CANTON_AUTOMATIC_PROTOCOL_VERSION restores the local behaviour of
        # using ProtocolVersion.latest.
        env:
          CANTON_AUTOMATIC_PROTOCOL_VERSION: "1"
        run: CONFORMANCE=1 sbt -batch driver/test
