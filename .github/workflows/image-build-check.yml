name: Image build check

# publish-image.yml runs only on a v* tag, so a pull request cannot exercise it. This workflow runs
# the same image build for both platforms on the same GitHub-hosted runners, with the same SBOM and
# provenance settings, and pushes and signs nothing. It checks the built index has the structure the
# release job requires (an attestation manifest with an SBOM and a provenance for the image), so the
# first tag is not the first test. Keep its build step in step with publish-image.yml. Fork pull
# requests run it too: it needs no secret and no write permission, and runs only on hosted runners.
on:
  pull_request:
    paths:
      # The whole Rust workspace: the Dockerfile, the toolchain file, the lockfile and the sources
      # the image compiles, so a green check means this commit's cosigner builds in the image.
      - "frost/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    # No path filter on a push to main: every commit on main gets the whole set (see main-status.yml).
    branches: [main]
  # Weekly: catches a change on the hosted runners or in an action before tag day, not on it.
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's earlier, still queued or running CI: the
# self-hosted runners are the bottleneck and a superseded run only delays the others. Never on a
# push to main, a schedule or a manual run: those get their own group (the run id), so none is
# cancelled or replaced by a later one.
concurrency:
  group: image-build-check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    name: Actions pinned, one Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action is pinned to a full commit SHA
        run: |
          set -euo pipefail
          bad="$(grep -nE '^[[:space:]-]*uses:' .github/workflows/*.yml | grep -vE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]+#.*)?$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::actions not pinned to a commit SHA:"
            echo "$bad"
            exit 1
          fi
          echo "OK: all actions pinned by SHA"
      - name: frost/Dockerfile builds with the Rust version of frost/rust-toolchain.toml
        run: |
          set -euo pipefail
          want="$(sed -n 's/^channel = "\(.*\)"$/\1/p' frost/rust-toolchain.toml)"
          have="$(sed -n 's/^FROM rust:\([^@ -]*\)-slim@sha256:[0-9a-f]\{64\} AS build$/\1/p' frost/Dockerfile)"
          [ -n "$want" ] && [ "$want" = "$have" ] || {
            echo "::error::rust-toolchain.toml says '${want}', frost/Dockerfile builds on rust '${have}' (or its FROM is not digest-pinned)"
            exit 1
          }
          grep -qE '^FROM debian:[^@ ]+@sha256:[0-9a-f]{64}$' frost/Dockerfile || {
            echo "::error::the runtime base image in frost/Dockerfile is not pinned by digest"
            exit 1
          }
          echo "OK: Rust ${want} in both, base images pinned by digest"
      - name: The two release build jobs differ only in platform and runner
        run: |
          set -euo pipefail
          f=.github/workflows/publish-image.yml
          job() { awk -v s="  $1:" -v e="  $2:" '$0 == s {on = 1; next} $0 == e {on = 0} on' "$f" \
            | grep -vE 'amd64|arm64|runs-on:'; }
          a="$(job build-amd64 build-arm64)"; b="$(job build-arm64 index)"
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::build-amd64 and build-arm64 in $f have drifted apart"; diff <(echo "$a") <(echo "$b") || true; exit 1; }
          echo "OK: build jobs identical"

      - name: The release dry run uses the release workflow's docker action pins
        run: |
          set -euo pipefail
          pins() { grep -hoE 'uses:[[:space:]]*docker/[^@[:space:]]+@[0-9a-f]{40}' "$1" | sort -u; }
          a="$(pins .github/workflows/publish-image.yml)"; b="$(pins .github/workflows/image-build-check.yml)"
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::docker action pins differ between publish-image.yml and image-build-check.yml:"; diff <(echo "$a") <(echo "$b") || true; exit 1; }
          echo "OK: same docker action pins"
      - name: The release dry run builds and tags by the release workflow's rules
        run: |
          set -euo pipefail
          # The build options (provenance, sbom) and the tag rules, without the parts that must
          # differ: the made-up version (value=) and the ref conditions (enable=) of the tag rules.
          rules() { grep -hE '^[[:space:]]+(provenance|sbom):|^[[:space:]]+type=(semver|raw),' "$1" \
            | sed -E 's/^[[:space:]]+//; s/,(enable|value)=.*$//' | sort -u; }
          a="$(rules .github/workflows/publish-image.yml)"; b="$(rules .github/workflows/image-build-check.yml)"
          # image-build-check.yml also has provenance/sbom in its own `build` job: same values.
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "::error::build options or tag rules differ between publish-image.yml and image-build-check.yml:"; diff <(echo "$a") <(echo "$b") || true; exit 1; }
          echo "OK: same build options and tag rules"

  build:
    name: Build ${{ matrix.platform }} (no push)
    # An unpinned action stops the run before any build step executes.
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # An OCI archive on the runner instead of a registry push, so the SBOM and provenance are
      # generated as in a release.
      - name: Build (as publish-image.yml, without pushing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frost
          file: frost/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar

      # The structure publish-image.yml's index job requires, for this platform: the image, and an
      # attestation manifest in the same index that refers to it and holds an SPDX SBOM and a SLSA
      # provenance (BuildKit's attestation storage).
      - name: The index holds the image, its SBOM and its provenance
        run: |
          set -euo pipefail
          oci="${RUNNER_TEMP}/oci"
          mkdir -p "$oci"
          tar -xf "${RUNNER_TEMP}/image.tar" -C "$oci"
          blob() { echo "${oci}/blobs/sha256/${1#sha256:}"; }
          # index.json either lists the manifests or points at one image index that does.
          idx="${oci}/index.json"
          if [ "$(jq -r '.manifests[0].mediaType' "$idx")" = "application/vnd.oci.image.index.v1+json" ]; then
            idx="$(blob "$(jq -r '.manifests[0].digest' "$idx")")"
          fi
          jq . "$idx"
          img="$(jq -r '[.manifests[] | select(.platform.os == "linux")]
            | if length == 1 then .[0].digest else error("expected one image, found \(length)") end' "$idx")"
          att="$(jq -r --arg d "$img" '[.manifests[]
              | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest"
                and (.annotations["vnd.docker.reference.digest"] // .annotations["com.docker.reference.digest"]) == $d)]
            | if length == 1 then .[0].digest else error("no attestation manifest refers to the image") end' "$idx")"
          jq . "$(blob "$att")"
          jq -e '[.layers[].annotations["in-toto.io/predicate-type"] // empty] as $p
            | any($p[]; startswith("https://spdx.dev/")) and any($p[]; startswith("https://slsa.dev/provenance/"))' \
            "$(blob "$att")" >/dev/null || { echo "::error::the attestation manifest lacks an SPDX SBOM or a SLSA provenance"; exit 1; }
          echo "OK: image ${img}, attestation manifest ${att} with SBOM and provenance"

      # Report only: the vulnerabilities of the image this commit builds, by severity, in the job
      # summary (docs/image-vulnerabilities.md). trivy is the pinned build of the quality tooling,
      # which has a Linux x86_64 binary only, so the arm64 build is not scanned.
      - name: Scan the image (report only)
        if: matrix.platform == 'linux/amd64'
        continue-on-error: true
        run: |
          set -euo pipefail
          scripts/quality/install-tools.sh "${RUNNER_TEMP}/tools" trivy
          # The build's OCI archive, then the layout the previous step unpacked from it; a report
          # that cannot be made says so in the summary and does not fail the build.
          scan() {
            "${RUNNER_TEMP}/tools/bin/trivy" image --quiet --skip-version-check --scanners vuln \
              --input "$1" --format json --output "${RUNNER_TEMP}/trivy.json" \
              --cache-dir "${RUNNER_TEMP}/trivy-cache"
          }
          if ! scan "${RUNNER_TEMP}/image.tar" && ! scan "${RUNNER_TEMP}/oci"; then
            echo "### Image vulnerabilities: trivy could not read the image archive (report only, see the step log)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Image vulnerabilities (trivy, distinct advisory ids)"
            echo "| Severity | Found | Without a fix |"
            echo "|---|---:|---:|"
            for s in CRITICAL HIGH MEDIUM LOW; do
              jq -r --arg s "$s" '[.Results[]? | .Vulnerabilities[]? | select(.Severity == $s)]
                | group_by(.VulnerabilityID)
                | "| \($s) | \(length) | \([.[] | select(all(.[]; (.FixedVersion // "") == ""))] | length) |"' "${RUNNER_TEMP}/trivy.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # The release path without a tag: the same metadata, login, build-by-digest and index steps as
  # publish-image.yml, against a registry that runs inside this job (no real registry, no secret, the
  # login uses dummy credentials). One platform: a service container cannot be shared with the arm64
  # runner, and the two-platform build is covered by `build` above. cosign and the attestation are not
  # part of this.
  publish-dry-run:
    name: Release path against a local registry
    needs: pins
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      registry:
        # Pinned by digest (registry:2 on Docker Hub); a service container has no job token.
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/rutli-cosigner
      PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules of publish-image.yml, applied to a made-up final tag (the ref of a pull request or
      # of main carries none).
      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v9.9.9
            type=semver,pattern={{major}}.{{minor}},value=v9.9.9
            type=raw,value=latest

      # network=host: BuildKit reaches the registry on the runner's localhost.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Log in to the local registry (dummy credentials)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: localhost:5000
          username: dry-run
          password: dry-run

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frost
          file: frost/Dockerfile
          platforms: ${{ env.PLATFORM }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Create the index, push its tags, prove its contents
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          META_JSON: ${{ steps.meta.outputs.json }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build (got '${DIGEST}')"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '${VERSION}'"; exit 1; }
          tags=()
          while read -r t; do tags+=(-t "$t"); done < <(jq -r '.tags[]' <<<"$META_JSON")
          [ "${#tags[@]}" -ge 3 ] || { echo "::error::expected the version, major.minor and latest tags, got ${#tags[@]}"; exit 1; }
          printf 'tags:%s\n' "$(printf ' %s' "${tags[@]}")"
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST}"
          # With one platform there is no cross-platform merge of two indexes: that part of the release
          # is only proven on tag day. This checks the tags, the digest agreement, the attestation
          # manifest and the readable SBOM and provenance around it.

          # As the index job of publish-image.yml, for one platform.
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          reported="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$digest" = "$reported" ] || { echo "::error::index digest ${digest} != buildx's ${reported}"; exit 1; }
          jq . index.json
          jq -e '
            [.manifests[] | select(.platform.os == "linux") | {arch: .platform.architecture, d: .digest}] as $imgs
            | [.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
                | (.annotations["vnd.docker.reference.digest"] // .annotations["com.docker.reference.digest"])] as $att
            | ($imgs | map(.arch) | sort) == ["amd64"]
              and all($imgs[]; .d as $d | any($att[]; . == $d))
          ' index.json >/dev/null || { echo "::error::the index lacks the image or its attestation manifest"; exit 1; }
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .SBOM}}' > sbom.json
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .Provenance}}' > provenance.json
          # One platform: buildx prints the document itself ({"SPDX":...}), not a map by platform.
          jq -e '(if has("SPDX") then {p: .} else . end) | (keys | length) == 1 and all(.[]; .SPDX.spdxVersion != null)' sbom.json >/dev/null \
            || { echo "::error::cannot read an SPDX SBOM"; jq -c 'keys' sbom.json; exit 1; }
          jq -e '(if has("SLSA") then {p: .} else . end) | (keys | length) == 1 and all(.[]; .SLSA != null)' provenance.json >/dev/null \
            || { echo "::error::cannot read provenance"; jq -c 'keys' provenance.json; exit 1; }
          echo "OK: ${IMAGE}@${digest} holds the platform image with SBOM and provenance, tags: $(jq -r '.tags | join(" ")' <<<"$META_JSON")"
