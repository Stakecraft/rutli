name: Publish cosigner image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git tag or latest)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stakecraft/rutli-cosigner

jobs:
  build-push:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted only: the self-hosted runner VM emulates amd64 with Rosetta, and installing
      # QEMU binfmt handlers there would take precedence and bring back the link-step segfaults.
      - name: Set up QEMU
        if: vars.CI_RUNNER == ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frost
          file: frost/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=${{ vars.CI_RUNNER != '' && '2' || '4' }}
          # The GitHub cache service is not used on a self-hosted runner (it may be unavailable there).
          cache-from: ${{ vars.CI_RUNNER == '' && 'type=gha' || '' }}
          cache-to: ${{ vars.CI_RUNNER == '' && 'type=gha,mode=max' || '' }}
