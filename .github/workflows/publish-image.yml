name: Publish cosigner image

# Release images are built on GitHub-hosted runners only, never on the self-hosted CI runners.
#   guard        refuses any ref that is not a v* tag (and carries the `release` environment)
#   build-amd64  builds one platform natively and pushes it by digest (no QEMU)
#   build-arm64  the same for arm64; keep the two jobs identical apart from the platform and runner
#   index        assembles the multi-arch index, pushes its tags, proves it carries the SBOM and
#                provenance of both platforms, outputs its digest
#   sign         the only job with the signing identity (id-token): runs shell, cosign from a
#                checksum-pinned download and GitHub's own attestation action, no third-party action
# How an operator verifies the result: SECURITY.md, "Verify the image"; the sign job runs exactly
# those commands last. image-build-check.yml exercises the build steps on pull requests.
#
# Tags (docker/metadata-action; `latest` and `X.Y` only for a final release, never a pre-release):
#   v0.5.0       -> 0.5.0, 0.5, latest
#   v0.5.0-rc.1  -> 0.5.0-rc.1
on:
  push:
    tags: ["v*"]
  # Manual re-run of a release tag only: pick a `v*` tag as the ref. The guard job refuses any other
  # ref, so a manual run can never push an arbitrary image tag from a branch. A dispatch on a tag
  # that already has a release builds and signs a new index and moves the tags to it
  # (SECURITY.md, "Verify the image"; docs/releasing.md).
  workflow_dispatch:

# No job gets more than it asks for below.
permissions: {}

# One publication per tag at a time; a second run waits instead of racing the first.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stakecraft/rutli-cosigner
  # cosign, installed from its GitHub release and checked against this sha256 (no marketplace
  # action). To bump: set COSIGN_VERSION, then COSIGN_SHA256 to the `cosign-linux-amd64` line of that
  # release's cosign_checksums.txt.
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  guard:
    name: Require a release tag ref
    runs-on: ubuntu-24.04
    # Required reviewers on this environment (Settings, Environments, `release`) hold the whole run,
    # every push included, until a second person approves. Without protection rules it does nothing;
    # GitHub creates it on first use.
    environment: release
    steps:
      - name: Require a v* tag ref
        if: ${{ github.ref_type != 'tag' || !startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::This workflow publishes only from a v* tag ref (got ${REF}). Run it on a release tag."
          exit 1

  build-amd64:
    name: Build linux/amd64
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/amd64
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Same tag rules as the index job, so the OCI labels (version) match the published tags.
      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: a release is built from the pinned base image and Cargo.lock alone. The SBOM
      # and provenance (mode=max) are stored as attestation manifests in this platform's index.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frost
          file: frost/Dockerfile
          platforms: ${{ env.PLATFORM }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Check the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build (got '${DIGEST}')"; exit 1; }
          echo "${PLATFORM}: ${DIGEST}"

  build-arm64:
    name: Build linux/arm64
    needs: guard
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/arm64
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Same tag rules as the index job, so the OCI labels (version) match the published tags.
      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: a release is built from the pinned base image and Cargo.lock alone. The SBOM
      # and provenance (mode=max) are stored as attestation manifests in this platform's index.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frost
          file: frost/Dockerfile
          platforms: ${{ env.PLATFORM }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Check the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build (got '${DIGEST}')"; exit 1; }
          echo "${PLATFORM}: ${DIGEST}"

  index:
    name: Multi-arch index
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the index, push its tags, prove its contents
        id: index
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
          META_JSON: ${{ steps.meta.outputs.json }}
          DIGEST_AMD64: ${{ needs.build-amd64.outputs.digest }}
          DIGEST_ARM64: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad platform digest '${d}'"; exit 1; }
          done
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '${VERSION}'"; exit 1; }
          tags=()
          while read -r t; do tags+=(-t "$t"); done < <(jq -r '.tags[]' <<<"$META_JSON")
          [ "${#tags[@]}" -gt 0 ] || { echo "::error::no image tags for this ref"; exit 1; }
          printf 'tags:%s\n' "$(printf ' %s' "${tags[@]}")"
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${DIGEST_AMD64}" "${IMAGE}@${DIGEST_ARM64}"

          # The digest two ways, which must agree: sha256 of the exact bytes the registry serves
          # (--raw prints them without a trailing newline), and the digest buildx reports.
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          reported="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$digest" = "$reported" ] || { echo "::error::index digest ${digest} != buildx's ${reported}"; exit 1; }
          jq . index.json

          # The index itself lists, for each platform image, an attestation manifest that refers
          # to it (BuildKit's attestation storage), so the index digest covers SBOM and provenance.
          jq -e --arg a "$DIGEST_AMD64" --arg b "$DIGEST_ARM64" '
            [.manifests[] | select(.platform.os == "linux") | {arch: .platform.architecture, d: .digest}] as $imgs
            | [.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
                | (.annotations["vnd.docker.reference.digest"] // .annotations["com.docker.reference.digest"])] as $att
            | ($imgs | map(.arch) | sort) == ["amd64", "arm64"]
              and all($imgs[]; .d as $d | any($att[]; . == $d))
          ' index.json >/dev/null || { echo "::error::the index lacks an image or an attestation manifest per platform"; exit 1; }
          # ... and both can be read back through the index.
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .SBOM}}' > sbom.json
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .Provenance}}' > provenance.json
          jq -e '(keys | length) == 2 and all(.[]; .SPDX.spdxVersion != null)' sbom.json >/dev/null \
            || { echo "::error::cannot read an SPDX SBOM for both platforms"; jq -c 'keys' sbom.json; exit 1; }
          jq -e '(keys | length) == 2 and all(.[]; .SLSA != null)' provenance.json >/dev/null \
            || { echo "::error::cannot read provenance for both platforms"; jq -c 'keys' provenance.json; exit 1; }
          echo "OK: ${IMAGE}@${digest} holds both platforms with SBOM and provenance"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  sign:
    name: Signature and provenance
    needs: index
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push the signature and the attestation to GHCR
      id-token: write      # keyless signing: the workflow's OIDC identity goes into the certificate
      attestations: write  # store the build provenance attestation with the repository
    env:
      IMAGE: ghcr.io/stakecraft/rutli-cosigner
      DIGEST: ${{ needs.index.outputs.digest }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the index digest
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::bad index digest '${DIGEST}'"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag '${TAG}'"; exit 1; }

      - name: Log in to GHCR (job token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"

      - name: Install cosign
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${tmp}/cosign" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "${tmp}/cosign" "$HOME/.local/bin/cosign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cosign" version

      # Keyless: Fulcio issues a short-lived certificate for this workflow at this tag ref, and the
      # signature is recorded in the public Rekor log.
      - name: Sign the index (cosign, keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "signed ${IMAGE}@${DIGEST} as https://github.com/${GITHUB_WORKFLOW_REF}"

      - name: Attest build provenance of the index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # A storage record would need the artifact-metadata permission; nothing reads it.
          create-storage-record: false

      # Exactly the commands of SECURITY.md ("Verify the image"), against the registry, so a
      # signature or attestation an operator cannot verify fails the release here.
      - name: Verify as an operator would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE}@${DIGEST}"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/Stakecraft/rutli/.github/workflows/publish-image.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          gh attestation verify "oci://$IMAGE" --repo Stakecraft/rutli \
            --signer-workflow Stakecraft/rutli/.github/workflows/publish-image.yml \
            --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
          gh attestation verify "oci://$IMAGE" --repo Stakecraft/rutli --bundle-from-oci \
            --signer-workflow Stakecraft/rutli/.github/workflows/publish-image.yml \
            --source-ref "refs/tags/$TAG" --deny-self-hosted-runners

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo "Tag ${TAG}. Index digest to pin: \`${DIGEST}\`"
            echo
            echo "Verify it as SECURITY.md (\"Verify the image\") describes."
          } >> "$GITHUB_STEP_SUMMARY"
