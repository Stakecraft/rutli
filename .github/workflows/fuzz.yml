name: Fuzz

# Coverage-guided fuzzing of the cosigner's parsers and request handlers (frost/fuzz, cargo-fuzz).
# The test schedule (docs/release-process.md): nightly at 02:00 UTC, ten minutes per target; a
# manual run for a release candidate, an hour per target; a pull request that changes the fuzz
# crate or this file gets a short smoke run. A crash fails the job and uploads the input; it
# becomes a regression test under frost/fuzz/regressions/<target>/ (replayed by `cargo test`)
# together with its fix. A failed nightly run opens an issue per failed target.
on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    paths:
      - "frost/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time per target, in seconds (3600 for a release candidate)"
        required: false
        default: "3600"

permissions:
  contents: read

# A new push to a pull request cancels its earlier smoke run. The nightly run, a manual run for a
# release candidate and any other run have their own group (the run id) and are never cancelled or
# replaced by another.
concurrency:
  group: fuzz-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    # The same runner rule as ci.yml (GitHub-hosted ubuntu-latest unless vars.CI_RUNNER is set;
    # fork and Dependabot pull requests always hosted). Fuzzing needs no stable hardware.
    runs-on: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    # An hour of fuzzing (manual run) plus the build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [key_file, seal_bundle, share_bundle, canton_key, export_file, intent, grpc]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || github.event_name == 'workflow_dispatch' && inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The pinned nightly of frost/fuzz/rust-toolchain.toml (libFuzzer needs -Zsanitizer).
      - name: Fuzz toolchain
        run: |
          v="$(sed -n 's/^channel = "\(.*\)"$/\1/p' frost/fuzz/rust-toolchain.toml)"
          test -n "$v"
          echo "FUZZ_TOOLCHAIN=$v" >> "$GITHUB_ENV"
      # dtolnay/rust-toolchain has no releases: pinned to a commit of its master branch, with the
      # toolchain passed explicitly.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}

      # One build cache for all targets (they share every dependency), written by one job only, so
      # the instrumented build does not crowd the CI caches out of the repository's cache quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: frost/fuzz
          save-if: ${{ matrix.target == 'key_file' && github.event_name != 'pull_request' }}

      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo-fuzz-bin
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ env.FUZZ_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked --root ~/.cargo-fuzz-bin

      - run: echo "$HOME/.cargo-fuzz-bin/bin" >> "$GITHUB_PATH"

      # The corpus each night grows lives in the Actions cache, not in the repository.
      - name: Restore corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frost/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # Seeds are generated by the target itself (RUTLI_FUZZ_SEED_DIR, on its first input): most
      # hold key material, which the repository does not carry. canton_key also reads the Canton
      # test vectors.
      #
      # Leak detection is on, except for grpc (issue #151): each grpc input runs on a fresh
      # three-node mesh wired by cosigner::peer::wire_local_mesh, whose nodes hold Arcs to each other
      # (node -> mesh -> LocalPeer -> node) and cannot be unwired (the mesh is set once), so every
      # input leaks one cycle of three nodes. LeakSanitizer on the runner: indirect leaks only, each
      # allocated in Node::new_with_ceremony_timeout (cosigner/src/node.rs) called from
      # rutli_fuzz::mesh_in <- rutli_fuzz::grpc. That is the harness, not the code under test: the
      # daemon's mesh is gRPC peers, with no cycle. A suppression naming rutli_fuzz::mesh_in would
      # not cover what the leaked nodes allocate later on the runtime's worker threads (no harness
      # frame), so both leak checks are off for grpc: libFuzzer's per input (-detect_leaks) and
      # LeakSanitizer's at exit (ASAN_OPTIONS). Per-input growth is still bounded by -rss_limit_mb,
      # and AddressSanitizer's other checks stay on. Turn it back on when #151 is fixed.
      - name: Fuzz
        working-directory: frost
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # A symbolizer, so sanitizer reports (crashes, leaks) name functions, not addresses: LLVM's
          # if the runner has one, else binutils' addr2line (the sanitizers drive either). Rust's
          # llvm-tools component does not ship llvm-symbolizer.
          sym="$(command -v llvm-symbolizer || command -v addr2line || true)"
          if [ -n "$sym" ]; then export ASAN_SYMBOLIZER_PATH="$sym"; else echo "::warning::no symbolizer on the runner: sanitizer reports will show addresses only"; fi
          leaks=1
          if [ "$TARGET" = grpc ]; then leaks=0; export ASAN_OPTIONS=detect_leaks=0; fi
          corpus="$PWD/fuzz/corpus/$TARGET"
          seeds="$PWD/fuzz/seeds/$TARGET"
          empty="$(mktemp -d)"
          mkdir -p "$corpus" "$seeds"
          RUTLI_FUZZ_SEED_DIR="$seeds" cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" "$empty" -- -runs=0 -detect_leaks="$leaks"
          extra=()
          if [ "$TARGET" = canton_key ]; then extra=("$PWD/canton-key/testdata/vectors"); fi
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" "$corpus" "$seeds" "${extra[@]}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=60 -rss_limit_mb=4096 -detect_leaks="$leaks" -print_final_stats=1

      - name: Save corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: frost/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: frost/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  # A failed nightly run (a crash, or a target that no longer builds) opens one issue per failed
  # target, or comments on the one already open for it. Only this job may write issues; the
  # fuzzing jobs keep the read-only token.
  report:
    name: Report nightly failures
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # curl + jq rather than `gh`: the self-hosted runner image ships jq, not the GitHub CLI.
      - name: Open or update an issue per failed target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          failed="$(api "$API/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' \
            | sed -n 's/^Fuzz \([a-z_]*\)$/\1/p' | sort -u)"
          if [ -z "$failed" ]; then
            echo "no failed fuzz target found in run $RUN_ID"
            exit 0
          fi
          open="$(api "$API/repos/$REPO/issues?state=open&labels=type:test&per_page=100")"
          for target in $failed; do
            title="Nightly fuzzing failed: $target"
            existing="$(jq -r --arg t "$title" '[.[] | select(.title == $t and (has("pull_request") | not))][0].number // empty' <<<"$open")"
            if [ -n "$existing" ]; then
              jq -n --arg b "Failed again: $RUN_URL" '{body: $b}' \
                | api -X POST "$API/repos/$REPO/issues/$existing/comments" -d @- >/dev/null
              echo "$target: commented on #$existing"
              continue
            fi
            body="The nightly fuzz run failed for \`$target\`: $RUN_URL

          The job log says whether it is a crash or a build failure; a crash input is in the run's \`fuzz-artifacts-$target\` artifact. Reproduce from \`frost/\` with \`cargo +nightly fuzz run $target <input>\` (frost/fuzz/README.md), then add the minimized input under \`frost/fuzz/regressions/$target/\` with the fix.

          If the crash could be a vulnerability, do not analyse it here: follow SECURITY.md."
            jq -n --arg t "$title" --arg b "$body" '{title: $t, body: $b, labels: ["type:test", "prio:p1", "area:frost"]}' \
              | api -X POST "$API/repos/$REPO/issues" -d @- >/dev/null
            echo "$target: opened an issue"
          done
