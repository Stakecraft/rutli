name: Cluster suite (kind)

# Checks that the cluster suite (scripts/perf/k8s-deploy.sh + scripts/perf/cluster.py) runs end to
# end: a four-node kind cluster on a GitHub-hosted runner, the chart installed on the previous
# release and upgraded to this commit under load, every suite with the short smoke profile, and the
# kind example hooks for a node loss and a partition. Its latencies are a shared runner's and mean
# nothing; real numbers come from running the suite against a real cluster (docs/cluster-suite.md).
#
# Only for changes to the suite, the chart or the load generator, and by hand.
on:
  pull_request:
    paths:
      - ".github/workflows/cluster-suite.yml"
      - "scripts/perf/**"
      - "deploy/helm/**"
      - "frost/loadgen/**"
      - "frost/Dockerfile.perf"
      - "frost/Dockerfile.dealer"
      - "scripts/e2e-migration.sh"
      - "scripts/e2e-migration-env-k8s.sh"
  push:
    # No path filter on a push to main: every commit on main gets the whole set (see main-status.yml).
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request cancels its own earlier run. A push to main never cancels or replaces another:
# each commit on main gets its own run.
concurrency:
  group: cluster-suite-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kind:
    name: Cluster suite on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests of the scripts
        run: |
          python3 -I scripts/perf/test_compare.py
          python3 -I scripts/perf/test_diagnose.py
          python3 -I scripts/perf/test_k8s_loadgen.py

      - name: Tools (checksum-pinned)
        run: scripts/perf/install-tools.sh kind helm

      - name: Build the image under test
        run: |
          diff <(grep '^FROM ' frost/Dockerfile) <(grep '^FROM ' frost/Dockerfile.perf)
          diff <(grep '^FROM ' frost/Dockerfile) <(grep '^FROM ' frost/Dockerfile.dealer)
          docker build -f frost/Dockerfile.perf -t rutli-perf:local frost

      # The migration suite's ceremony runs on the previous release's cosigners (the upgrade suite
      # comes after it), and a ceremony's dealer must be of the same release. The expected commit is
      # the one the chart's digest-pinned release image records (its OCI label
      # org.opencontainers.image.revision, set when the release was published); the release tag must
      # name that commit, and the dealer is built from the commit itself with this tree's
      # frost/Dockerfile.dealer (older tags have none; it copies the context and builds rutli-dealer,
      # nothing else, and is reviewed with every change). A tag that names another commit stops the job.
      - name: Build the previous release's dealer
        run: |
          set -euo pipefail
          values=deploy/helm/rutli-cosigner/values.yaml
          # The top-level image: block only (other images in the values have blocks of their own).
          block="$(awk '/^image:/ {on=1; next} on && /^[^ #]/ {on=0} on' "$values")"
          repo="$(sed -n 's/^  repository: \([^ #]*\).*$/\1/p' <<<"$block" | head -n 1)"
          tag="$(sed -n 's/^  tag: "\([0-9][^@"]*\)@.*/\1/p' <<<"$block" | head -n 1)"
          digest="$(sed -n 's/^  tag: "[^@"]*@\(sha256:[0-9a-f]\{64\}\)".*/\1/p' <<<"$block" | head -n 1)"
          [ -n "$repo" ] && [ -n "$tag" ] && [ -n "$digest" ] || { echo "::error::no digest-pinned image in $values"; exit 1; }
          # Every platform of the release index must record the same commit (read from the registry,
          # nothing pulled: a second platform of one digest cannot be pulled next to the first).
          revs="$(docker buildx imagetools inspect "$repo@$digest" --format '{{ json .Image }}' \
            | jq -r 'if has("config") then [.] else [to_entries[] | select(.key | startswith("unknown") | not) | .value] end | map(.config.Labels["org.opencontainers.image.revision"] // "none") | unique | .[]')"
          echo "release image $repo@$digest records: ${revs//$'\n'/ }"
          [ "$(printf '%s\n' "$revs" | wc -l)" -eq 1 ] || { echo "::error::$repo@$digest: its platforms record different commits"; exit 1; }
          expected="$revs"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$repo@$digest records no commit"; exit 1; }
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          commit="$(git ls-remote "$url" "refs/tags/v${tag}^{}" | cut -f1)"
          [ -n "$commit" ] || commit="$(git ls-remote "$url" "refs/tags/v${tag}" | cut -f1)"
          if [ "$commit" != "$expected" ]; then
            echo "::error::tag v${tag} names ${commit:-nothing}, but the release image $repo@$digest was built from $expected"
            exit 1
          fi
          echo "previous release v${tag} = ${expected} (the release image's commit and the tag agree)" | tee -a "$GITHUB_STEP_SUMMARY"
          # A tag of this run only: no image cached under a reused name can stand in for it.
          image="rutli-dealer:${tag}-${expected:0:12}-${GITHUB_RUN_ID}"
          docker build -f- -t "$image" "${url}#${expected}:frost" <frost/Dockerfile.dealer
          echo "DEALER_IMAGE=$image" >>"$GITHUB_ENV"

      - name: Cluster
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
            - role: worker
          EOF
          kind create cluster --name rutli-perf --config "${RUNNER_TEMP}/kind.yaml" --wait 180s
          kind load docker-image rutli-perf:local --name rutli-perf
          kind load docker-image "$DEALER_IMAGE" --name rutli-perf
          kubectl get nodes -o wide

      - name: Install the previous release
        run: scripts/perf/k8s-deploy.sh install --previous --generators 2 --image rutli-perf:local --work "${RUNNER_TEMP}/work"

      - name: Suites
        env:
          HOOK_KILL_NODE: ${{ github.workspace }}/scripts/perf/hooks/kind-kill-node.sh
          HOOK_PARTITION: ${{ github.workspace }}/scripts/perf/hooks/kind-partition.sh
          WORK: ${{ runner.temp }}/work
        run: |
          python3 -I scripts/perf/cluster.py --namespace rutli-perf --profile scripts/perf/profiles/smoke.json \
            --env-name kind --out perf-out/cluster.json --upgrade-image rutli-perf:local --work "$WORK" \
            --dealer-image "$DEALER_IMAGE" --allow-unisolated-dealer --disrupt-secs 90 --commit "$GITHUB_SHA"

      # The diagnostic pass, tiny: it checks the wiring (cgroup and pressure readings, the flush
      # probe, load spread over two generators, the key-count step), not the numbers.
      - name: Diagnostic pass
        run: |
          python3 -I scripts/perf/cluster.py --namespace rutli-perf --profile scripts/perf/profiles/smoke.json \
            --env-name kind --diagnose --out perf-out/diagnose.json --commit "$GITHUB_SHA"

      - name: Report
        if: always()
        run: |
          mkdir -p perf-out
          for r in cluster diagnose; do
            if [ -f "perf-out/$r.json" ]; then
              python3 -I scripts/perf/compare.py --markdown "perf-out/$r.md" perf-out/no-previous.json "perf-out/$r.json" \
                >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          kubectl -n rutli-perf get pods -o wide > perf-out/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > perf-out/events.txt 2>&1 || true
          for i in 1 2 3; do
            kubectl -n rutli-perf logs "rutli-cosigner-n$i-0" -c cosigner --tail=3000 > "perf-out/cosigner$i.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-suite-kind
          path: perf-out/
          retention-days: 30
          if-no-files-found: warn
