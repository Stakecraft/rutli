#
# The gRPC Java stubs under driver/src/main/java are generated from frost/cosigner/proto by
# scripts/gen-grpc-java.sh and checked in. This regenerates them and fails on any difference, so a
# change to the proto without the regenerated stubs (main had stale stubs after a proto change) is
# caught on the pull request. On a push to main it runs without a path filter, like the other checks
# that main-status.yml watches. Not meant as a required check while pull requests are path-filtered.
name: Generated code

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - frost/cosigner/proto/**
      - driver/src/main/java/**
      - scripts/gen-grpc-java.sh
      - build.sbt
      - .github/workflows/generated-code.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-code-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stubs:
    name: gRPC Java stubs match the proto
    # GitHub-hosted: a disposable machine for the downloaded protoc binaries, a minute of work.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # protoc and protoc-gen-grpc-java for linux-x86_64 at the versions in build.sbt (protobufVersion
      # 4.29.3, grpcVersion 1.82.1), from Maven Central. To bump: change build.sbt, then both sums
      # (sha256sum of the two downloaded files; Central's .sha256 of the plugin agrees).
      PROTOC_SHA256: 5ae94ad986e83f0b52bd8139e036cbf94ddbba3ad348be8e4baf44447d7e19a4
      PROTOC_GEN_GRPC_JAVA_SHA256: 3a75d1a88b8fe44f4a1d5cb8f22c73f8fcc8d563aed9057ff5ea484b22cdaf2f
      GEN_GRPC_CACHE_DIR: /home/runner/.cache/rutli-protoc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The two binaries, keyed by their pinned sha256 and checked again after a restore: Maven
      # Central rate-limits the shared runner addresses (HTTP 429), so most runs should not download.
      - name: Cache protoc and protoc-gen-grpc-java
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rutli-protoc
          # build.sbt holds the versions: a version change starts a new cache.
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sbt') }}-${{ env.PROTOC_SHA256 }}-${{ env.PROTOC_GEN_GRPC_JAVA_SHA256 }}
      - name: Regenerate and compare
        run: |
          set -euo pipefail
          # Exit 3 from the script is a failed download, not a difference in the stubs (it says so).
          scripts/gen-grpc-java.sh
          # git diff: 0 same, 1 different, anything else is git failing, not a result.
          rc=0
          git diff --exit-code --stat -- driver/src/main/java || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::driver/src/main/java is not what scripts/gen-grpc-java.sh generates from frost/cosigner/proto: run the script and commit the result"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::git diff failed (exit ${rc}): the check could not compare"
            exit 1
          fi
          # New files, ignored ones included, whatever the git configuration says about untracked files.
          if ! extra="$(git ls-files --others -- driver/src/main/java)"; then
            echo "::error::git ls-files failed: the check could not compare"
            exit 1
          fi
          if [ -n "$extra" ]; then
            printf '%s\n' "$extra"
            echo "::error::the generator added files under driver/src/main/java: commit them"
            exit 1
          fi
          echo "OK: generated stubs are current"
