#
# Changelog fragments: a pull request that changes frost/, driver/, deploy/ or scripts/ adds a file
# under changelog.d/ (or carries the label `no-changelog`). See changelog.d/README.md.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# No concurrency group, on purpose: the check takes seconds, and adding or removing a label re-runs it
# on the same commit. A superseded run that is cancelled would stay next to the new one as a
# CANCELLED check and leave the pull request UNSTABLE.

jobs:
  fragment:
    name: changelog fragment
    # GitHub-hosted: this is a few seconds of Python, it must not queue on the self-hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Script tests
        run: python3 -I scripts/test_changelog.py

      - name: Fragments are well-formed
        run: python3 -I scripts/changelog.py check

      - name: Code change has a fragment or the no-changelog label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash  # with -o pipefail: a failing git diff fails the step
        run: |
          git -c core.quotePath=false diff --name-status "$BASE_SHA...$HEAD_SHA" \
            | python3 -I scripts/changelog.py require --pr "$PR_NUMBER" --labels "$PR_LABELS"
