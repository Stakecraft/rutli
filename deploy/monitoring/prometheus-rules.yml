# Prometheus alerting rules for the Rütli FROST cosigner cluster.
#
# Rütli is a threshold-signing daemon: N cosigner instances (e.g. 3) jointly
# hold a FROST-ed25519 key and sign under a 2-of-3 quorum. Each cosigner
# exposes a Prometheus text endpoint at /metrics on port 9200 with the
# following metrics (all labels listed exhaustively; Prometheus also adds
# the standard `instance`/`job` labels per scrape target):
#
#   rutli_sign_requests_total{result="ok"|"error"}                    counter
#   rutli_sign_duration_seconds{result="ok"|"error"}                  histogram
#   rutli_ceremony_requests_total{kind="dkg"|"refresh", result=...}   counter
#   rutli_sign_round1_skips_total                                    counter
#   rutli_sign_aborts_total                                          counter
#   rutli_pending_sign_sessions                                      gauge
#   rutli_hosted_keys                                                gauge
#   rutli_unreadable_key_files_total                                 counter
#   rutli_hosted_key_ops_total{op=..., result="ok"|"error"}          counter
#   rutli_anti_entropy_repairs_total                                 counter
#   rutli_anti_entropy_conflicts_total                               counter
#   rutli_key_replicas                                               gauge
#
# The last six cover cluster-hosted keys (RSA/AES key material replicated
# whole to every node, unlike the FROST share, which is never copied between
# nodes). `op` is one of generate | decrypt | symmetric_encrypt |
# symmetric_decrypt | delete. Unlike every other metric above, the hosted-key
# op series are not pre-primed at zero — an (op, result) pair first appears on
# use — so the hosted-key rules below alert on rates, never on absence.
#
# NOTE: every `up{job="rutli-cosigner"}` and job-label selector below
# assumes the scrape job is named "rutli-cosigner". Operators must match
# this to the actual `job_name` used in their prometheus.yml scrape config
# (or update these rules) or the RutliCosignerDown rule will never fire.

groups:
  - name: rutli-cosigner
    rules:
      - alert: RutliCosignerDown
        expr: up{job="rutli-cosigner"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Rütli cosigner {{ $labels.instance }} is down"
          description: "Cosigner instance {{ $labels.instance }} (job rutli-cosigner) has had up == 0 for more than 2 minutes. With a 2-of-3 quorum, one lost cosigner leaves zero margin — a second failure will halt signing entirely."

      - alert: RutliSignErrors
        expr: rate(rutli_sign_requests_total{result="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rütli cosigner {{ $labels.instance }} is returning sign errors"
          description: "{{ $labels.instance }} has had a non-zero rate of Sign RPC errors (result=\"error\") over the last 5m, sustained for 5m. Check leader logs for the failing peer(s)."

      - alert: RutliSignLatencyHigh
        expr: histogram_quantile(0.99, sum by (le, instance) (rate(rutli_sign_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rütli sign latency is high on {{ $labels.instance }}"
          description: "p99 Sign RPC latency on {{ $labels.instance }} has exceeded 5s (5m window) for 10 minutes. Signing may be timing out, or a quorum peer may be slow or unreachable."

      - alert: RutliPeerSkips
        expr: increase(rutli_sign_round1_skips_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Rütli peer round-1 skips detected on {{ $labels.instance }}"
          description: "{{ $labels.instance }} recorded sign round-1 skips in the last 10 minutes, meaning a quorum peer failed or was unreachable during round 1. With a 2-of-3 quorum the safety margin is shrinking — investigate the skipped peer before another one goes down."

      - alert: RutliPendingSessionsGrowing
        expr: rutli_pending_sign_sessions > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rütli pending sign sessions growing on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has held more than 50 in-flight round-1 sign sessions for over 10 minutes. This gauge should hover near 0; a sustained high value suggests sessions are leaking rather than being cleaned up."

      - alert: RutliCeremonyFailure
        expr: increase(rutli_ceremony_requests_total{result="error"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rütli key ceremony failed on {{ $labels.instance }}"
          description: "{{ $labels.instance }} recorded a failed {{ $labels.kind }} ceremony (DKG or refresh) in the last hour. Ceremonies are rare and safety-critical — do NOT retry automatically; an operator must investigate the cause before attempting another ceremony."

      - alert: RutliSignAborts
        expr: increase(rutli_sign_aborts_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rütli repeated sign aborts on {{ $labels.instance }}"
          description: "{{ $labels.instance }} issued more than 3 leader-side sign aborts in the last 15 minutes. This indicates repeated give-ups on in-flight sign sessions — peers may be flapping or the cluster may be degraded."

      - alert: RutliHostedKeyConflict
        expr: increase(rutli_anti_entropy_conflicts_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Rütli hosted key conflict detected on {{ $labels.instance }}"
          description: "{{ $labels.instance }} found a peer holding DIFFERENT material under a key id it also holds. Hosted keys are create-once-immutable, so this is an invariant violation — not replication lag — and anti-entropy deliberately refuses to reconcile it: picking a side automatically could destroy the only copy that can decrypt already-recorded traffic. Find the conflicting key id in the cosigner logs (logged at error level), stop rotating that key, and resolve by hand."

      - alert: RutliHostedKeyUnderReplicated
        # A write quorum below the cluster size is only safe because anti-entropy heals the
        # shortfall; this alert is what proves it did. NaN (no hosted keys yet) never fires.
        expr: rutli_key_replicas < 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Rütli hosted key under-replicated on {{ $labels.instance }}"
          description: "At least one cluster-hosted key is held by fewer than 3 cosigners and has not healed within 30 minutes. A key written at the 2-of-3 write quorum is expected to be repaired by the next anti-entropy sweep (default 300s), so a sustained shortfall means a cosigner is down or sweeps are failing. Check that every cosigner is up and reachable on the mesh."

      - alert: RutliHostedKeyCriticallyUnderReplicated
        expr: rutli_key_replicas < 2
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Rütli hosted key has a single copy on {{ $labels.instance }}"
          description: "At least one cluster-hosted key is held by only ONE cosigner. Losing that node loses the key, and because Canton peers encrypt to the published public key, the loss is unrecoverable for already-recorded traffic (see docs/disaster-recovery.md 3b). Restore the missing cosigners immediately; do not rotate or delete keys until replication recovers."

      - alert: RutliHostedKeyErrors
        expr: rate(rutli_hosted_key_ops_total{result="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rütli hosted-key {{ $labels.op }} errors on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has had a non-zero rate of failed hosted-key \"{{ $labels.op }}\" operations over the last 5m, sustained for 5m. Canton has no software fallback for a KMS decrypt: sustained op=\"decrypt\" errors surface as KmsDecryptError and can disconnect the participant from the synchronizer. Check whether this node actually holds the key (a lagging replica repairs on demand) before suspecting the sealing or crypto backend."

      - alert: RutliHostedKeyReplicaShortfall
        expr: max by (job) (rutli_hosted_keys) - min by (job) (rutli_hosted_keys) > 0
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Rütli hosted keys are unevenly replicated across job {{ $labels.job }}"
          description: "Cosigners in job {{ $labels.job }} report different hosted-key counts, meaning at least one key exists on fewer nodes than the cluster has. Writes commit at write_quorum (default 2 of 3), so a node that was down during a GenerateKey lags legitimately until the anti-entropy sweep heals it (default every 300s; the gauge itself only refreshes at the end of a node's own sweep or when a peer lists its keys). Divergence sustained for 20 minutes means healing is failing — check rutli_anti_entropy_repairs_total and the sweep logs. Two replicas survive one node loss; one survives none."

      - alert: RutliUnreadableKeyFiles
        # The counter is bumped once per inventory listing that hits a bad file (this node's own
        # sweep, plus every peer ListKeys), so it keeps climbing while the file sits there and
        # stops the moment an operator resolves it. Alerting on the increase rather than on the
        # raw value is what lets this clear without restarting the cosigner.
        expr: increase(rutli_unreadable_key_files_total[30m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rütli key file on {{ $labels.instance }} cannot be read"
          description: "{{ $labels.instance }} has a key file on disk it cannot open, and has been unable to open it for at least 15 minutes. Such a file is logged, counted and SKIPPED from the hosted-key inventory — failing the whole listing would stop anti-entropy for every healthy key too — so the damaged key is invisible to replication: it is neither pushed to peers nor pulled back from them, while rutli_hosted_keys can still look even across the cluster. Usual causes are a seal master secret rotated without re-sealing the existing files, a partial or foreign restore, or disk corruption. It does not self-heal. Take the key id from the cosigner's error log, then restore the seal secret that file was written under, restore a good copy (rutli-cosigner restore, or import-key from an export — see docs/disaster-recovery.md 3d), or, after confirming a readable copy on another cosigner, delete the file so anti-entropy can replace it."

      - alert: RutliDecryptRateLimited
        # Refusals mean one of two things, and both need a human: a node that has outgrown its
        # ceiling (raise it — the cosigner logs a warning well before it starts refusing), or
        # someone with the driver certificate bulk-decrypting recorded traffic. Alert on any
        # sustained refusal rather than a threshold: in normal operation this counter never moves.
        expr: increase(rutli_decrypt_rate_limited_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rütli is refusing hosted-key decryptions on {{ $labels.instance }} (rate limit)"
          description: "{{ $labels.instance }} has refused hosted-key decryptions for at least 5 minutes because a key hit hosted_keys.decrypt_rate_limit_per_min (default 6000/min per key). In normal operation this counter never moves: the default is ~100 decryptions per second sustained on a SINGLE key, far above what a Canton participant does. Two readings. (1) Legitimate growth — the cosigner logs 'approaching its rate limit' with the key id before it starts refusing, so check for that warning and raise the limit. Canton sees RESOURCE_EXHAUSTED and backs off; the driver deliberately does NOT fail over to another cosigner, since every node enforces the same ceiling. (2) Abuse — this is what a stolen driver certificate looks like, and because Canton's encryption keys protect per-view session keys, whoever holds it can read retrospectively. If the traffic is not yours, treat it as a live confidentiality incident: check the driver certificate's provenance and signer_allowlist, then rotate the encryption key through Canton topology and the driver cert. See docs/hosted-keys.md section 5."
