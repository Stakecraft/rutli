# GENERATED by render-prometheusrule.py from ../prometheus-rules.yml — do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rutli-cosigner
  namespace: rutli
  labels:
    release: prometheus
    app.kubernetes.io/name: rutli-cosigner
    app.kubernetes.io/part-of: rutli
spec:
  groups:
  - name: rutli-cosigner
    rules:
    - alert: RutliCosignerDown
      expr: up{job="rutli-cosigner"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} is down"
        description: "Cosigner instance {{ $labels.instance }} (job rutli-cosigner) has had up == 0 for\
          \ more than 2 minutes. With a 2-of-3 quorum, one lost cosigner leaves zero margin \u2014 a second\
          \ failure will halt signing entirely."
    - alert: RutliKeystoreUnreadable
      expr: rutli_keystore_unreadable == 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} cannot read or write its key store"
        description: "{{ $labels.instance }} has been unable to list its key store (data_dir/keys), write\
          \ to it, or open any key file in it for at least 1 minute. It answers UNAVAILABLE to Sign, Dkg,\
          \ Refresh and every key operation (INTERNAL only in the first ~15s, before its first failed\
          \ probe, where its share is not cached), reports Health NOT_SERVING, shows READY 0/1, and refuses\
          \ to join other leaders' signing quorums (rutli_sign_round1_skips_total climbs) and ceremonies;\
          \ the driver fails over away from it. Signing continues on the other two cosigners \u2014 but\
          \ at 2-of-3 the margin is gone, one more failure halts signing, and no DKG or refresh can run\
          \ until it is fixed. Usual cause: something outside the cosigner changed the volume \u2014 a\
          \ backup or maintenance job remounting the RWO PVC, a recursive chown/chmod, a read-only remount\
          \ after a storage fault. Check `kubectl -n rutli exec <pod> -- ls -la /data/keys`, the mount\
          \ flags (`mount | grep /data`), and what else touched the PVC (CronJobs, operators, the CSI\
          \ driver's events); the cosigner's error log names the path and the OS error. Fix the volume\
          \ rather than restarting the pod \u2014 a restart does not repair it and discards the evidence;\
          \ the gauge clears on its own within ~15s of recovery. Not the same as RutliUnreadableKeyFiles\
          \ (rutli_unreadable_key_files_total), which is individual key files failing to open or unseal\
          \ on an otherwise healthy volume."
    - alert: RutliSignErrors
      expr: rate(rutli_sign_requests_total{result="error"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} is returning sign errors"
        description: '{{ $labels.instance }} has had a non-zero rate of Sign RPC errors (result="error")
          over the last 5m, sustained for 5m. Check leader logs for the failing peer(s).'
    - alert: RutliSignLatencyHigh
      expr: histogram_quantile(0.99, sum by (le, instance) (rate(rutli_sign_duration_seconds_bucket[5m])))
        > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli sign latency is high on {{ $labels.instance }}"
        description: p99 Sign RPC latency on {{ $labels.instance }} has exceeded 5s (5m window) for 10
          minutes. Signing may be timing out, or a quorum peer may be slow or unreachable.
    - alert: RutliPeerSkips
      expr: increase(rutli_sign_round1_skips_total[10m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli peer round-1 skips detected on {{ $labels.instance }}"
        description: "{{ $labels.instance }} recorded sign round-1 skips in the last 10 minutes, meaning\
          \ a quorum peer failed or was unreachable during round 1. With a 2-of-3 quorum the safety margin\
          \ is shrinking \u2014 investigate the skipped peer before another one goes down."
    - alert: RutliPendingSessionsGrowing
      expr: rutli_pending_sign_sessions > 50
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli pending sign sessions growing on {{ $labels.instance }}"
        description: '{{ $labels.instance }} has held more than 50 in-flight round-1 sign sessions for
          over 10 minutes. This gauge should hover near 0; a sustained high value suggests sessions are
          leaking rather than being cleaned up.'
    - alert: RutliCeremonyFailure
      expr: increase(rutli_ceremony_requests_total{result="error"}[1h]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli key ceremony failed on {{ $labels.instance }}"
        description: "{{ $labels.instance }} recorded a failed {{ $labels.kind }} ceremony (DKG or refresh)\
          \ in the last hour. Ceremonies are rare and safety-critical \u2014 do NOT retry automatically;\
          \ an operator must investigate the cause before attempting another ceremony."
    - alert: RutliSignAborts
      expr: increase(rutli_sign_aborts_total[15m]) > 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli repeated sign aborts on {{ $labels.instance }}"
        description: "{{ $labels.instance }} issued more than 3 leader-side sign aborts in the last 15\
          \ minutes. This indicates repeated give-ups on in-flight sign sessions \u2014 peers may be flapping\
          \ or the cluster may be degraded."
    - alert: RutliStaleShare
      expr: max by (instance, key) (rutli_stale_share) == 1
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} holds a stale share of {{ $labels.key }}"
        description: "{{ $labels.instance }} found its share of {{ $labels.key }} behind the cluster:\
          \ a newer committed sharing (epoch) exists that this node never voted for, or its own ceremony\
          \ record names a newer epoch than its share. Typical cause: a restore from an old backup or\
          \ a volume snapshot rollback. It refuses to sign or lead for the key, so signing continues on\
          \ the other cosigners \u2014 at 2-of-3 with no margin left. Fix: restore a current backup of\
          \ this node (daemon stopped) or re-enrol it; the mark clears by itself once the share is current\
          \ (docs/ceremonies.md, Signing across epochs). Never copy another node's share file."
    - alert: RutliEpochMismatch
      expr: increase(rutli_epoch_mismatch_total[15m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a leader on another epoch"
        description: '{{ $labels.instance }} refused sign round 1 because the leader signs with a different
          sharing (epoch, PKP digest) of the key than this node committed. Leaders route around it, but
          two cosigners hold different epochs of one key: compare `rutli-cosigner verify-key` across nodes,
          and check RutliStaleShare and rutli_ceremonies_staged (a ceremony still resolving clears within
          a minute).'
    - alert: RutliInvalidSignatureShare
      expr: increase(rutli_invalid_signature_shares_total[1h]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli leader {{ $labels.instance }} received an invalid signature share"
        description: "A cosigner returned a signature share that failed verification when {{ $labels.instance\
          \ }} aggregated a signature. The leader excluded that cosigner and retried with another quorum,\
          \ so no bad signature was returned \u2014 but a correct cosigner never produces an invalid share:\
          \ suspect a corrupted share file or a compromised node. The leader's log names the cosigner\
          \ (`a cosigner returned an invalid signature share`)."
    - alert: RutliCeremonySplit
      expr: max by (instance) (rutli_ceremonies_split) > 0 or increase(rutli_ceremony_equivocations_total[1h])
        > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }}: a DKG/refresh was resolved differently on\
          \ different nodes"
        description: "{{ $labels.instance }} aborted a ceremony that a peer reports COMMITTED with the\
          \ same outcome, or saw COMMITTED and ABORTED reported for one ceremony. With crash faults this\
          \ is impossible: a cosigner equivocated (audit F3). The aborted node keeps its staged share\
          \ quarantined. Signing continues where a quorum shares a sharing, now with less margin. Identify\
          \ the suspect node, then on the aborted node (daemon stopped) `rutli-cosigner ceremony recover-commit\
          \ --ceremony-id <id>` \u2014 docs/ceremonies.md, \"A split ceremony\"."
    - alert: RutliCeremonyUnknownFlood
      expr: increase(rutli_ceremony_unknown_refused_total[15m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused no-votes for unknown ceremonies (cap\
          \ reached)"
        description: 'A peer asked {{ $labels.instance }} about more made-up ceremony ids (or opened more
          orphaned sessions) than the caps allow (audit F2). The node refuses instead of writing more
          records, which is safe, but a legitimate peer asking about a ceremony this node really lost
          now waits instead of aborting. The log line `refusing to record another no-vote` names the asking
          peer: treat it as misbehaving.'
    - alert: RutliSignJournalErrors
      expr: increase(rutli_sign_journal_errors_total[10m]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} cannot write or read its sign journal"
        description: "{{ $labels.instance }} failed to append to (or open) its per-key sign journal under\
          \ data_dir/journal. A node that cannot journal a share does not release it, so it is out of\
          \ signing for that key and the others carry the quorum \u2014 at 2-of-3 with no margin. Usual\
          \ causes: a full or read-only volume, or a journal segment that no longer verifies (a malformed\
          \ line or a broken hash chain, which the node refuses to sign past). Check the cosigner log\
          \ for 'sign journal', free space on the data volume, and `rutli-cosigner audit-cross-check`\
          \ against a copy of the journal (docs/audit-cross-check.md). Never delete a journal to make\
          \ the alert go away: it is the cluster's independent record of every signature."
    - alert: RutliSignPolicyRefusals
      expr: sum by (instance, reason) (increase(rutli_sign_policy_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused signatures by policy ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused to take part in a signature because its signing policy\
          \ said no (reason {{ $labels.reason }}). Expected reasons during a rollout: missing (require_intent\
          \ on before the driver signs intents), approval (a gated key without its approvals), expiry\
          \ (clock skew beyond clock_skew_secs \u2014 check NTP on the driver and the node). Suspicious\
          \ ones: signer, certificate, signature, pin, cluster, key \u2014 something presented an intent\
          \ this node did not accept, which is what a compromised cosigner or a stolen-but-revoked driver\
          \ key looks like. The cosigner log names the refusal; cross-check the driver audit log (docs/approval-quorum.md)."
    - alert: RutliSignIntentAbsent
      expr: increase(rutli_sign_intent_absent_total[1h]) > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} signs without client intents"
        description: '{{ $labels.instance }} has accepted signatures that carried no client-signed intent
          for over an hour. That is the transition state of this release (signing_policy.require_intent
          off): approvals, ACLs and rate limits then bind only in the driver, and a compromised cosigner
          can still obtain shares for arbitrary digests. Finish the rollout: upgrade the driver, then
          set require_intent on every node (docs/approval-quorum.md, Switching enforcement on). On a cluster
          that already enforces, this alert should never fire.'
    - alert: RutliCeremonyIntentRefused
      expr: sum by (instance, reason) (increase(rutli_ceremony_intent_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a DKG/refresh ceremony intent ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused to fence or start a DKG or refresh (reason {{ $labels.reason\
          \ }}). On the mesh path (the cosigner log says 'ceremony fence refused' / 'ceremony part 1 refused'\
          \ and names the asking peer) a cosigner led a ceremony no authorized client signed for: missing\
          \ with signing_policy.require_ceremony_intent on means either a leader on an older release (it\
          \ drops the intent: finish the rollout) or that peer is compromised; signer, certificate, signature,\
          \ pin, cluster, purpose, key, ceremony-id mean something presented an intent this node did not\
          \ accept \u2014 investigate the asking cosigner. At the leader (Signer.Dkg/Refresh): signer\
          \ = a refresh by the driver with signer_may_refresh off, or an intent replayed through another\
          \ client's connection; missing = an old driver or refresh CLI; expiry = clock skew (NTP). docs/ceremonies.md,\
          \ Ceremony intents."
    - alert: RutliCeremonyIntentAbsent
      expr: increase(rutli_ceremony_intent_absent_total[1h]) > 0
      for: 0m
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} ran a DKG/refresh without a client ceremony\
          \ intent"
        description: '{{ $labels.instance }} took part in a DKG or refresh that carried no client-signed
          ceremony intent, accepted because signing_policy.require_ceremony_intent is off. That is the
          transition state of this release: a compromised cosigner can still start (and split) ceremonies
          on this node. Once the driver and the refresh job run this release, set require_ceremony_intent
          on every node (docs/approval-quorum.md, Switching enforcement on). On a cluster that enforces,
          this never fires.'
    - alert: RutliSignRateLimited
      expr: increase(rutli_sign_rate_limited_total[10m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} hit a per-key sign rate limit"
        description: "{{ $labels.instance }} refused a signature because the key reached signing_policy.sign_rate_limit_per_min\
          \ / _per_day (or a rate_limits rule). The driver does not fail over on it (every node enforces\
          \ the same ceiling). Either a key outgrew its limit \u2014 raise it on every node \u2014 or\
          \ something with the driver certificate is signing in bulk: compare the sign journals with the\
          \ driver audit log (rutli-cosigner audit-cross-check)."
    - alert: RutliSignerAclAbsent
      expr: increase(rutli_signer_acl_absent_total[1h]) > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} serves a client with no key ACL"
        description: "A Signer client CN without a signing_policy.signer_acl entry used a key on {{ $labels.instance\
          \ }} \u2014 allowed while signer_acl_required is off, which means a stolen driver certificate\
          \ may use every key, including another tenant's. Add an ACL entry for every signer CN and turn\
          \ signer_acl_required on."
    - alert: RutliDeleteIntentRefused
      expr: sum by (instance, reason) (increase(rutli_delete_intent_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a hosted-key delete ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused a hosted-key delete or a peer's tombstone (reason\
          \ {{ $labels.reason }}). disabled / role: a client outside hosted_keys.delete_allowlist tried\
          \ to delete (with the driver certificate, that is either an unconfigured Canton deleteKey or\
          \ someone holding the certificate). signature / certificate / signer / cluster / malformed in\
          \ an anti-entropy log line: a peer presented a tombstone it could not back with a valid delete\
          \ intent \u2014 suspect that cosigner. stale: a tombstone older than the copy it would delete\
          \ (an undeleted or regenerated key) \u2014 expected after hosted-undelete until every node is\
          \ undeleted. rollback: a PurgeKey without an intent outside a fenced generation. The cosigner\
          \ log names the key."
    - alert: RutliHostedKeyDeleted
      expr: sum by (instance, how) (increase(rutli_hosted_tombstones_written_total[15m])) > 0
      for: 0m
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} tombstoned a hosted key ({{ $labels.how }})"
        description: 'A hosted key was deleted on {{ $labels.instance }} (how={{ $labels.how }}: converted
          = a live copy became a tombstone, recorded = a tombstone recorded for a key this node did not
          hold). Deletes are authorized by a signed delete intent every node verified, and the material
          stays sealed in the tombstone for hosted_keys.delete_grace_secs (rutli-cosigner hosted-undelete
          on every node to undo). Confirm the delete was intended; the cosigner log names the key and
          the signer CN.'
    - alert: RutliKeyFilesUnopenable
      expr: max by (instance) (rutli_keyfiles{dek="unknown"}) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} holds key files no DEK it has opens"
        description: "At start-up {{ $labels.instance }} found key files sealed under a DEK its seal bundle\
          \ does not hold \u2014 typically previous_share_deks dropped (seal drop-previous) before every\
          \ file was re-sealed, or the wrong bundle mounted. Those keys are unusable on this node. Mount\
          \ the bundle that still lists the previous DEK, restart (the node re-seals at start), and check\
          \ `rutli-cosigner keyfile status` before dropping it again."
    - alert: RutliKeyFileMigrationPending
      expr: max by (instance) (rutli_keyfiles{dek="previous"}) > 0 or max by (instance) (rutli_keyfiles{format="plaintext"})
        > 0
      for: 1d
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} has key files under a previous DEK, or plaintext"
        description: '{{ $labels.instance }} reported key files still sealed under a previous DEK (a DEK
          rotation not finished: restart the node or run keyfile migrate, then seal drop-previous after
          a backup) or plaintext key files for a day. The legacy seal master can be destroyed only after
          every node''s files are under a fresh DEK (decision P1). Check with `rutli-cosigner keyfile
          status`.'
    - alert: RutliLockPoisonRecovered
      expr: increase(rutli_lock_poison_recoveries_total[1h]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} recovered from a panic holding {{ $labels.lock\
          \ }}"
        description: 'A request panicked on {{ $labels.instance }} while holding the {{ $labels.lock }}
          lock. The node recovered the lock and keeps serving (in-flight signing sessions or the key cache
          may have been dropped, ceremony votes reloaded from disk), but a panic is a bug: find it in
          the cosigner log just before ''recovered a lock poisoned by a panicking request'' and report
          it.'
    - alert: RutliHostedKeyConflict
      expr: increase(rutli_anti_entropy_conflicts_total[1h]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli hosted key conflict detected on {{ $labels.instance }}"
        description: "{{ $labels.instance }} found a peer holding DIFFERENT material under a key id it\
          \ also holds. Hosted keys are create-once-immutable, so this is an invariant violation \u2014\
          \ not replication lag \u2014 and anti-entropy deliberately refuses to reconcile it: picking\
          \ a side automatically could destroy the only copy that can decrypt already-recorded traffic.\
          \ Find the conflicting key id in the cosigner logs (logged at error level), stop rotating that\
          \ key, and resolve by hand."
    - alert: RutliHostedKeyUnderReplicated
      expr: rutli_key_replicas < 3
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli hosted key under-replicated on {{ $labels.instance }}"
        description: At least one cluster-hosted key is held by fewer than 3 cosigners and has not healed
          within 30 minutes. A key written at the 2-of-3 write quorum is expected to be repaired by the
          next anti-entropy sweep (default 300s), so a sustained shortfall means a cosigner is down or
          sweeps are failing. Check that every cosigner is up and reachable on the mesh.
    - alert: RutliHostedKeyCriticallyUnderReplicated
      expr: rutli_key_replicas < 2
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli hosted key has a single copy on {{ $labels.instance }}"
        description: At least one cluster-hosted key is held by only ONE cosigner. Losing that node loses
          the key, and because Canton peers encrypt to the published public key, the loss is unrecoverable
          for already-recorded traffic (see docs/disaster-recovery.md 3b). Restore the missing cosigners
          immediately; do not rotate or delete keys until replication recovers.
    - alert: RutliHostedKeyErrors
      expr: rate(rutli_hosted_key_ops_total{result="error"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli hosted-key {{ $labels.op }} errors on {{ $labels.instance }}"
        description: '{{ $labels.instance }} has had a non-zero rate of failed hosted-key "{{ $labels.op
          }}" operations over the last 5m, sustained for 5m. Canton has no software fallback for a KMS
          decrypt: sustained op="decrypt" errors surface as KmsDecryptError and can disconnect the participant
          from the synchronizer. Check whether this node actually holds the key (a lagging replica repairs
          on demand) before suspecting the sealing or crypto backend.'
    - alert: RutliHostedKeyReplicaShortfall
      expr: max by (job) (rutli_hosted_keys) - min by (job) (rutli_hosted_keys) > 0
      for: 20m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli hosted keys are unevenly replicated across job {{ $labels.job }}"
        description: "Cosigners in job {{ $labels.job }} report different hosted-key counts, meaning at\
          \ least one key exists on fewer nodes than the cluster has. Writes commit at write_quorum (default\
          \ 2 of 3), so a node that was down during a GenerateKey lags legitimately until the anti-entropy\
          \ sweep heals it (default every 300s; the gauge itself only refreshes at the end of a node's\
          \ own sweep or when a peer lists its keys). Divergence sustained for 20 minutes means healing\
          \ is failing \u2014 check rutli_anti_entropy_repairs_total and the sweep logs. Two replicas\
          \ survive one node loss; one survives none."
    - alert: RutliUnreadableKeyFiles
      expr: increase(rutli_unreadable_key_files_total[30m]) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli key file on {{ $labels.instance }} cannot be read"
        description: "{{ $labels.instance }} has a key file on disk it cannot open, and has been unable\
          \ to open it for at least 15 minutes. Such a file is logged, counted and SKIPPED from the hosted-key\
          \ inventory \u2014 failing the whole listing would stop anti-entropy for every healthy key too\
          \ \u2014 so the damaged key is invisible to replication: it is neither pushed to peers nor pulled\
          \ back from them, while rutli_hosted_keys can still look even across the cluster. Usual causes\
          \ are a seal master secret rotated without re-sealing the existing files, a partial or foreign\
          \ restore, or disk corruption. It does not self-heal. Take the key id from the cosigner's error\
          \ log, then restore the seal secret that file was written under, restore a good copy (rutli-cosigner\
          \ restore, or import-key from an export \u2014 see docs/disaster-recovery.md 3d), or, after\
          \ confirming a readable copy on another cosigner, delete the file so anti-entropy can replace\
          \ it."
    - alert: RutliDecryptRateLimited
      expr: increase(rutli_decrypt_rate_limited_total[10m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli is refusing hosted-key decryptions on {{ $labels.instance }} (rate limit)"
        description: "{{ $labels.instance }} has refused hosted-key decryptions for at least 5 minutes\
          \ because a key hit hosted_keys.decrypt_rate_limit_per_min (default 6000/min per key, enforced\
          \ per node). In normal operation this counter never moves: the default is ~100 decryptions per\
          \ second sustained on a SINGLE key, far above what a Canton participant does. Two readings.\
          \ (1) Legitimate growth \u2014 the cosigner logs 'approaching its rate limit' with the key id\
          \ before it starts refusing, so check for that warning and raise the limit. Canton sees RESOURCE_EXHAUSTED\
          \ and backs off; the driver deliberately does NOT fail over to another cosigner, since every\
          \ node enforces the same ceiling. (2) Abuse \u2014 this is what a stolen driver certificate\
          \ looks like, and because Canton's encryption keys protect per-view session keys, whoever holds\
          \ it can read retrospectively. If the traffic is not yours, treat it as a live confidentiality\
          \ incident: check the driver certificate's provenance and signer_allowlist, then rotate the\
          \ encryption key through Canton topology and the driver cert. See docs/hosted-keys.md section\
          \ 5."
