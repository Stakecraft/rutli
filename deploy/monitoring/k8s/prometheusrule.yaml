# GENERATED by render-prometheusrule.py from ../prometheus-rules.yml — do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rutli-cosigner
  namespace: rutli
  labels:
    release: prometheus
    app.kubernetes.io/name: rutli-cosigner
    app.kubernetes.io/part-of: rutli
spec:
  groups:
  - name: rutli-cosigner
    rules:
    - alert: RutliCosignerDown
      expr: up{job="rutli-cosigner"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} is down"
        description: "Cosigner instance {{ $labels.instance }} (job rutli-cosigner) has had up == 0 for\
          \ more than 2 minutes. With a 2-of-3 quorum, one lost cosigner leaves zero margin \u2014 a second\
          \ failure will halt signing entirely."
    - alert: RutliCosignerRolloutPending
      expr: "kube_statefulset_status_replicas_updated{statefulset=~\".*rutli-cosigner.*\"}\n  < kube_statefulset_replicas{statefulset=~\"\
        .*rutli-cosigner.*\"}\n"
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner StatefulSet {{ $labels.statefulset }} runs an old pod template"
        description: 'StatefulSet {{ $labels.statefulset }} has had a newer pod template than its pod
          for at least 30 minutes. The chart sets updateStrategy OnDelete on the per-node StatefulSets,
          so a helm upgrade restarts no pod by itself and the cosigner keeps the old image and settings
          until it is rolled. Run scripts/upgrade-cosigners.sh --status to see the running and the target
          revision of each node, then scripts/upgrade-cosigners.sh to roll them one at a time (docs: chart
          README, Upgrading). Not an outage: signing is unaffected, but the cluster is not on the version
          you deployed.'
    - alert: RutliKeystoreUnreadable
      expr: rutli_keystore_unreadable == 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} cannot read or write its key store"
        description: "{{ $labels.instance }} has been unable to list its key store (data_dir/keys), write\
          \ to it, or open any key file in it for at least 1 minute. It answers UNAVAILABLE to Sign, Dkg,\
          \ Refresh and every key operation (INTERNAL only in the first ~15s, before its first failed\
          \ probe, where its share is not cached), reports Health NOT_SERVING, shows READY 0/1, and refuses\
          \ to join other leaders' signing quorums (rutli_sign_round1_skips_total climbs) and ceremonies;\
          \ the driver fails over away from it. Signing continues on the other two cosigners \u2014 but\
          \ at 2-of-3 the margin is gone, one more failure halts signing, and no DKG or refresh can run\
          \ until it is fixed. Usual cause: something outside the cosigner changed the volume \u2014 a\
          \ backup or maintenance job remounting the RWO PVC, a recursive chown/chmod, a read-only remount\
          \ after a storage fault. Check `kubectl -n rutli exec <pod> -- ls -la /data/keys`, the mount\
          \ flags (`mount | grep /data`), and what else touched the PVC (CronJobs, operators, the CSI\
          \ driver's events); the cosigner's error log names the path and the OS error. Fix the volume\
          \ rather than restarting the pod \u2014 a restart does not repair it and discards the evidence;\
          \ the gauge clears on its own within ~15s of recovery. Not the same as RutliUnreadableKeyFiles\
          \ (rutli_unreadable_key_files_total), which is individual key files failing to open or unseal\
          \ on an otherwise healthy volume."
    - alert: RutliSignErrors
      expr: rate(rutli_sign_requests_total{result="error"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} is returning sign errors"
        description: '{{ $labels.instance }} has had a non-zero rate of Sign RPC errors (result="error")
          over the last 5m, sustained for 5m. Check leader logs for the failing peer(s).'
    - alert: RutliSignLatencyHigh
      expr: histogram_quantile(0.99, sum by (le, instance) (rate(rutli_sign_duration_seconds_bucket[5m])))
        > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli sign latency is high on {{ $labels.instance }}"
        description: p99 Sign RPC latency on {{ $labels.instance }} has exceeded 5s (5m window) for 10
          minutes. Signing may be timing out, or a quorum peer may be slow or unreachable.
    - alert: RutliPeerSkips
      expr: increase(rutli_sign_round1_skips_total[10m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli peer round-1 skips detected on {{ $labels.instance }}"
        description: "{{ $labels.instance }} recorded sign round-1 skips in the last 10 minutes, meaning\
          \ a quorum peer failed or was unreachable during round 1. With a 2-of-3 quorum the safety margin\
          \ is shrinking \u2014 investigate the skipped peer before another one goes down."
    - alert: RutliPeerDown
      expr: max by (instance, peer) (max_over_time(rutli_peer_state{job="rutli-cosigner",state="down"}[1m]))
        == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} has repeatedly seen peer {{ $labels.peer }}\
          \ down for 5 minutes"
        description: '{{ $labels.instance }} has held cosigner {{ $labels.peer }} as down (unreachable,
          stalled or refusing) for at least 5 minutes (trials in between failed), and tries it last in
          every signature but one trial per window. Check rutli_peer_breaker_transitions_total{peer="{{
          $labels.peer }}"} for the reason: unreachable is the network or the process (connect, TLS, keepalive),
          stalled is a member whose sign rounds stopped completing (a hung volume), refusing is a member
          whose key store is down (RutliKeystoreUnreadable on it). If every node reports the same peer,
          look at that peer; if only one does, look at the link between them. At 2-of-3 the margin is
          gone while it lasts.'
    - alert: RutliNoQuorum
      expr: count(increase(rutli_sign_fast_refusals_total{job="rutli-cosigner",reason="no-quorum"}[5m])
        > 0) >= 2
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli: two or more cosigners refuse signatures for lack of a reachable quorum"
        description: 'At least two cosigners answered Sign with UNAVAILABLE no-quorum in the last 5 minutes:
          each sees fewer than t cosigners (itself included) it can reach. One leader alone doing so is
          a cut-off node and the driver signs elsewhere; two or more means no leader can form a quorum.
          Check rutli_peer_state on every instance to see which links are down, then the network between
          the nodes (NetworkPolicy, CNI, node failures) and whether a majority of cosigners is up at all.'
    - alert: RutliPeerFlapping
      expr: sum by (instance, peer) (increase(rutli_peer_breaker_transitions_total{job="rutli-cosigner",to="down"}[15m]))
        > 6
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} keeps marking peer {{ $labels.peer }} down"
        description: '{{ $labels.instance }} marked cosigner {{ $labels.peer }} down more than 6 times
          in 15 minutes. Each time it recovered (a probe or a successful call) and failed again. Each
          failure costs at most one signature one peer deadline (2 s in round 1, 5 s in round 2). Look
          for a lossy or saturated link, a member whose round latency sits near its deadline (rutli_peer_call_duration_seconds
          on this instance), or a member restarting in a loop.'
    - alert: RutliPendingSessionsGrowing
      expr: rutli_pending_sign_sessions > 50
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli pending sign sessions growing on {{ $labels.instance }}"
        description: '{{ $labels.instance }} has held more than 50 in-flight round-1 sign sessions for
          over 10 minutes. This gauge should hover near 0; a sustained high value suggests sessions are
          leaking rather than being cleaned up.'
    - alert: RutliCeremonyFailure
      expr: increase(rutli_ceremony_requests_total{result="error"}[1h]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli key ceremony failed on {{ $labels.instance }}"
        description: "{{ $labels.instance }} recorded a failed {{ $labels.kind }} ceremony (DKG or refresh)\
          \ in the last hour. Ceremonies are rare and safety-critical \u2014 do NOT retry automatically;\
          \ an operator must investigate the cause before attempting another ceremony."
    - alert: RutliSignAborts
      expr: increase(rutli_sign_aborts_total[15m]) > 3
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli repeated sign aborts on {{ $labels.instance }}"
        description: "{{ $labels.instance }} issued more than 3 leader-side sign aborts in the last 15\
          \ minutes. This indicates repeated give-ups on in-flight sign sessions \u2014 peers may be flapping\
          \ or the cluster may be degraded."
    - alert: RutliStaleShare
      expr: max by (instance, key) (rutli_stale_share) == 1
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} holds a stale share of {{ $labels.key }}"
        description: "{{ $labels.instance }} marked its share of {{ $labels.key }} stale and refuses to\
          \ sign or lead for the key, so signing continues on the other cosigners \u2014 at 2-of-3 with\
          \ no margin left. First read the reason in the node's log (`this node's share is STALE`). If\
          \ it says the claim is unconfirmed, one cosigner claims a newer epoch and none that holds this\
          \ node's epoch answered: a wrong or compromised cosigner can cause that while the others restart\
          \ or a refresh is still committing. Do not restore anything yet: compare `rutli-cosigner verify-key`\
          \ across the nodes; the mark clears by itself on the next pass that reaches a cosigner on this\
          \ node's epoch, at most 30 s later. Otherwise a newer committed sharing exists that this node\
          \ never voted for, or its own ceremony record names a newer epoch than its share \u2014 typically\
          \ a restore from an old backup or a volume snapshot rollback. Fix: restore a current backup\
          \ of this node (daemon stopped) or re-enrol it; the mark clears by itself once the share is\
          \ current (docs/ceremonies.md, Signing across epochs). Never copy another node's share file."
    - alert: RutliBackupVolumeFilling
      expr: "kubelet_volume_stats_used_bytes{persistentvolumeclaim=~\".*-backup-n[0-9]+\"}\n  / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~\"\
        .*-backup-n[0-9]+\"} > 0.8\n"
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli backup volume {{ $labels.persistentvolumeclaim }} is over 80% full"
        description: "The backup volume {{ $labels.persistentvolumeclaim }} has been over 80% full for\
          \ an hour. A full volume stops the node's backups, which matters most right after a refresh.\
          \ Read the backup sidecar's log: `BACKUP_RETENTION_SKIPPED` or `BACKUP_RETENTION_FAILED` says\
          \ why retention is not deleting (an archive whose epoch cannot be read, a node behind its newest\
          \ archive, a key epoch that is unproven: RutliKeyEpochUnproven, a missing binary in the backup\
          \ image), and the `BACKUP_RETENTION archive=\u2026 reason=\u2026` lines say why each archive\
          \ is kept. `rutli-cosigner backup-retain --dry-run` lists the verdicts. Raise backup.pvc.size\
          \ only after that: more space hides the cause. docs/disaster-recovery.md, Backup retention."
    - alert: RutliKeyEpochUnproven
      expr: rutli_key_epoch_proven == 0 and rutli_key_epoch_age_seconds > 259200
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli key {{ $labels.key }} has run its current epoch on {{ $labels.instance }} for\
          \ over 3 days without a proof"
        description: 'The key file of {{ $labels.key }} on {{ $labels.instance }} is more than 3 days
          old and its live epoch has no proof: nobody has recorded that the shares of this epoch sign
          together. Run `rutli-cosigner verify-key --sign-test --json` for the key, then `rutli-cosigner
          keyfile prove --key-id <key> --epoch <epoch> --report <file>` on every node (docs/ceremonies.md,
          Proving an epoch). Expect this alert for every key after upgrading to the release that adds
          the command. A node whose share is stale (RutliStaleShare) cannot prove the epoch: bring it
          back first. Not an outage.'
    - alert: RutliEpochMismatch
      expr: increase(rutli_epoch_mismatch_total[15m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a leader on another epoch"
        description: '{{ $labels.instance }} refused sign round 1 because the leader signs with a different
          sharing (epoch, PKP digest) of the key than this node committed. Leaders route around it, but
          two cosigners hold different epochs of one key: compare `rutli-cosigner verify-key` across nodes,
          and check RutliStaleShare and rutli_ceremonies_staged (a ceremony still resolving clears within
          a minute).'
    - alert: RutliInvalidSignatureShare
      expr: increase(rutli_invalid_signature_shares_total[1h]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli leader {{ $labels.instance }} received an invalid signature share"
        description: "A cosigner returned a signature share that failed verification when {{ $labels.instance\
          \ }} aggregated a signature. The leader excluded that cosigner and retried with another quorum,\
          \ so no bad signature was returned \u2014 but a correct cosigner never produces an invalid share:\
          \ suspect a corrupted share file or a compromised node. The leader's log names the cosigner\
          \ (`a cosigner returned an invalid signature share`)."
    - alert: RutliCeremonySplit
      expr: max by (instance) (rutli_ceremonies_split) > 0 or increase(rutli_ceremony_equivocations_total[1h])
        > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }}: a DKG/refresh was resolved differently on\
          \ different nodes"
        description: "{{ $labels.instance }} aborted a ceremony that a peer reports COMMITTED with the\
          \ same outcome, or saw COMMITTED and ABORTED reported for one ceremony. With crash faults this\
          \ is impossible: a cosigner equivocated (audit F3). The aborted node keeps its staged share\
          \ quarantined. Signing continues where a quorum shares a sharing, now with less margin. Identify\
          \ the suspect node, then on the aborted node (daemon stopped) `rutli-cosigner ceremony recover-commit\
          \ --ceremony-id <id>` \u2014 docs/ceremonies.md, \"A split ceremony\"."
    - alert: RutliCeremonyUnknownFlood
      expr: increase(rutli_ceremony_unknown_refused_total[15m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused no-votes for unknown ceremonies (cap\
          \ reached)"
        description: 'A peer asked {{ $labels.instance }} about more made-up ceremony ids (or opened more
          orphaned sessions) than the caps allow (audit F2). The node refuses instead of writing more
          records, which is safe, but a legitimate peer asking about a ceremony this node really lost
          now waits instead of aborting. The log line `refusing to record another no-vote` names the asking
          peer: treat it as misbehaving.'
    - alert: RutliSignJournalErrors
      expr: increase(rutli_sign_journal_errors_total[10m]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} cannot write or read its sign journal"
        description: "{{ $labels.instance }} failed to append to (or open) its per-key sign journal under\
          \ data_dir/journal. A node that cannot journal a share does not release it, so it is out of\
          \ signing for that key and the others carry the quorum \u2014 at 2-of-3 with no margin. Usual\
          \ causes: a full or read-only volume, or a journal segment that no longer verifies (a malformed\
          \ line or a broken hash chain, which the node refuses to sign past). Check the cosigner log\
          \ for 'sign journal', free space on the data volume, and `rutli-cosigner audit-cross-check`\
          \ against a copy of the journal (docs/audit-cross-check.md). Never delete a journal to make\
          \ the alert go away: it is the cluster's independent record of every signature."
    - alert: RutliSignPolicyRefusals
      expr: sum by (instance, reason) (increase(rutli_sign_policy_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused signatures by policy ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused to take part in a signature because its signing policy\
          \ said no (reason {{ $labels.reason }}). Expected reasons during a rollout: missing (require_intent\
          \ on, its default with TLS, while the driver does not sign intents: a driver older than 0.4.0-rc.3\
          \ or frost.sign-intents = off), approval (a gated key without its approvals), expiry (clock\
          \ skew beyond clock_skew_secs \u2014 check NTP on the driver and the node). Suspicious ones:\
          \ signer, certificate, signature, pin, cluster, key \u2014 something presented an intent this\
          \ node did not accept, which is what a compromised cosigner or a stolen-but-revoked driver key\
          \ looks like. The cosigner log names the refusal; cross-check the driver audit log (docs/approval-quorum.md)."
    - alert: RutliPeerPinRefused
      expr: sum by (instance, direction) (increase(rutli_peer_pin_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a peer's TLS key ({{ $labels.direction\
          \ }})"
        description: "{{ $labels.instance }} refused a mesh connection because the peer's certificate\
          \ carries a key that is not pinned in its peers[].tls_spki_sha256 (direction {{ $labels.direction\
          \ }}: inbound = a peer called this node, outbound = this node dialled a peer). The certificate's\
          \ name and chain were valid. Either a pin is stale (a certificate was swapped before its new\
          \ pin reached every node \u2014 the log line names the CN and the key it saw: compare with `rutli-cosigner\
          \ tls spki <cert>`), or something with a CA-signed certificate for that node's name answered\
          \ or called in its place: a replaced node's old certificate, or one minted with the CA key.\
          \ Treat the second as an incident (docs/security/threat-model.md, Holder of the cluster CA key;\
          \ docs/ca-rotation.md \xA710)."
    - alert: RutliPeerPinsOff
      expr: max by (instance) (rutli_peer_pins_unpinned) > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} accepts {{ $value }} peer(s) by certificate\
          \ name alone"
        description: "{{ $labels.instance }} runs with tls.require_peer_pins: false and some roster entries\
          \ have no tls_spki_sha256. Any certificate with such a peer's name under the cluster CA is accepted\
          \ as that peer \u2014 a replaced node's old certificate, or one minted with the CA key. Expected\
          \ only during a rollout; pin every node (`rutli-cosigner tls spki <cert>`, Helm peerPins) and\
          \ remove the opt-out."
    - alert: RutliSignUnknownSessions
      expr: increase(rutli_sign_round2_unknown_session_total[15m]) > 3.5
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} keeps getting sign round 2 for sessions it\
          \ does not hold"
        description: '{{ $labels.instance }} answered more than 3 sign round-2 requests in 15 minutes
          as an unknown signing session: it held no round-1 nonces for them. No share leaves for such
          a request and the leader signs with the other cosigners, so signatures still complete, with
          less margin. One or two right after this node restarted or committed a refresh are normal and
          stay under this threshold. More means one of: the node restarts again and again (check its restart
          count and log); it keeps dropping its loaded keys (RutliLockPoisonRecovered); or a peer sends
          round 2 for session ids this node never had, which a correct cosigner does not do (a round 2
          for another leader''s live session is refused and counted under RutliSignSessionOwnerRefused
          instead). A leader whose sign lost this node logs it (`excluding a cosigner from this signature`,
          with `unknown signing session` and the session id). This node does not log the request, so if
          no leader''s log accounts for the count, suspect the other cosigners. On a node that requires
          signing intents such a request used to count under RutliSignPolicyRefusals (reason missing).'
    - alert: RutliSignSessionOwnerRefused
      expr: sum by (instance, call) (increase(rutli_sign_session_owner_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a sign {{ $labels.call }} from a peer\
          \ that did not open the session"
        description: "{{ $labels.instance }} got a sign round 2 or abort ({{ $labels.call }}) for a live\
          \ session that another caller opened. Since 0.5.0 a sign session belongs to the peer whose certificate\
          \ CN opened it (or to the node's own leader), so the request was refused and took nothing: no\
          \ other peer can abort or advance the session. A correct cosigner never sends this. The cosigner\
          \ log line 'refused a sign \u2026 from a caller that did not open the session' names the caller\
          \ and the owner: investigate the caller as compromised."
    - alert: RutliSignSessionCapReached
      expr: sum by (instance, cap) (increase(rutli_sign_sessions_refused_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused sign round 1: too many waiting sessions\
          \ ({{ $labels.cap }})"
        description: '{{ $labels.instance }} refused a sign round 1 because a cap on sessions waiting
          for round 2 was reached. cap=opener: one opener (a peer''s certificate CN, or the node''s own
          leader) holds 256 sessions for one key; cap=request: one opener holds 20 sessions for one signing
          request. An honest leader holds about as many as it has signs in flight (normally a few; up
          to about 128 on a large participant host or a leader serving two participants) plus sessions
          of calls the driver gave up on, which it now aborts, so either that opener floods this node
          with round 1s (a compromised cosigner replaying an intent it saw) or it is leaking sessions.
          Only that opener is refused: other leaders keep their room, and a leader that hears this answer
          tries other cosigners instead of excluding this one. On a mesh without TLS no peer is identified,
          so all remote leaders share one opener''s room and one filler takes all of it. cap=key: all
          openers together hold 1024 for the key, which needs at least four openers at their caps. The
          cosigner log line ''refusing sign round 1: too many sessions waiting for round 2'' names the
          opener; rutli_pending_sign_sessions shows the total. Sessions expire after 5 minutes.'
    - alert: RutliSignIntentAbsent
      expr: increase(rutli_sign_intent_absent_total[1h]) > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} signs without client intents"
        description: '{{ $labels.instance }} has accepted signatures that carried no client-signed intent
          for over an hour. It does so only where signing_policy.require_intent is off: set to false (the
          opt-out; on by default with TLS since 0.5.0), or on a node without TLS. Approvals, ACLs and
          rate limits then bind only in the driver, and a compromised cosigner can still obtain shares
          for arbitrary digests. Once the driver signs intents (0.4.0-rc.3 or later, frost.sign-intents
          on), remove the opt-out on every node (docs/approval-quorum.md, Switching enforcement on). On
          a cluster that enforces, this alert should never fire.'
    - alert: RutliCeremonyIntentRefused
      expr: sum by (instance, reason) (increase(rutli_ceremony_intent_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a ceremony or generate intent ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused to fence or start a DKG or refresh, or to fence a\
          \ hosted-key generation (reason {{ $labels.reason }}). On the mesh path (the cosigner log says\
          \ 'ceremony fence refused' / 'ceremony part 1 refused' / 'ceremony genkey fence refused' and\
          \ names the asking peer and the key) a cosigner led a ceremony or a key generation no authorized\
          \ client signed for: missing with signing_policy.require_ceremony_intent on means either a leader\
          \ on an older release (it drops the intent: finish the rollout) or that peer is compromised;\
          \ signer, certificate, signature, pin, cluster, purpose, key, spec, leader, ceremony-id mean\
          \ something presented an intent this node did not accept \u2014 investigate the asking cosigner\
          \ (leader: a cosigner presented a generate intent the client signed for another cosigner). At\
          \ the leader (Signer.Dkg/Refresh/GenerateKey): signer = a refresh by the driver with signer_may_refresh\
          \ off, or an intent replayed through another client's connection; missing = a driver older than\
          \ 0.5.0 (GenerateKey) or 0.4.0-rc.4 (Dkg), or an old refresh CLI; expiry = clock skew (NTP).\
          \ docs/ceremonies.md, Ceremony intents; docs/hosted-keys.md, Generate."
    - alert: RutliCeremonyIntentAbsent
      expr: increase(rutli_ceremony_intent_absent_total[1h]) > 0
      for: 0m
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} ran a DKG/refresh or a hosted-key generation\
          \ without a client intent"
        description: '{{ $labels.instance }} took part in a DKG, a refresh or a hosted-key generation
          that carried no client-signed intent, accepted because signing_policy.require_ceremony_intent
          is off on this node: set to false (the opt-out; on by default with TLS since 0.4.0-rc.6), or
          the node runs without TLS. A compromised cosigner can still start (and split) ceremonies on
          it, and create a hosted key nobody asked for. Once the driver (0.5.0 or later) and the refresh
          job sign their intents, remove the opt-out on every node (docs/approval-quorum.md, Switching
          enforcement on). On a cluster that enforces, this never fires.'
    - alert: RutliRefreshRefused
      expr: sum by (instance) (increase(rutli_refresh_interval_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a refresh that came too soon"
        description: '{{ $labels.instance }} refused to take part in a refresh because it took part in
          a refresh of the same key less than signing_policy.refresh_min_interval_secs ago (default 72
          h). The refusal (cosigner log, and the client''s error) names the ceremony it counts from: look
          that ceremony up (rutli-cosigner ceremony status, or verify-key''s refresh count). If it committed
          and you did not start it, the key is already on a new epoch and every older backup no longer
          restores a node: first make sure every node has a backup of the new epoch: the backup sidecar
          takes one within backup.checkEverySecs (5 min) of the commit; check each node''s backup container
          log for BACKUP_TRIGGER followed by BACKUP_OK after the commit time. Then replace the credential:
          the refresher certificate''s signer_pins entry, and turn signer_may_refresh off if the driver
          certificate may be the one. A refusal right after one of your own runs is expected. An incident
          refresh that cannot wait needs signing_policy.refresh_interval_waived_at on every node (docs/ceremonies.md,
          Refresh interval).'
    - alert: RutliRefreshOffSchedule
      expr: max by (key) (rutli_refreshes_6d) > 1
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli key {{ $labels.key }} was refreshed more than once in 6 days"
        description: 'A cosigner committed more than one refresh of {{ $labels.key }} in the last 6 days,
          counted by commit time. The shipped schedule is weekly; the window is a day shorter than the
          schedule so a weekly run that lands a little early (scheduler jitter) does not fire this. Check
          that each refresh was yours (an incident refresh, a retried run); if not, replace the refresher
          certificate''s pin and turn signer_may_refresh off. Every refresh leaves the nodes'' older backups
          unable to restore them: check that each node logged BACKUP_TRIGGER and BACKUP_OK after the last
          refresh (docs/disaster-recovery.md, docs/ceremonies.md Refresh interval).'
    - alert: RutliSignRateLimited
      expr: increase(rutli_sign_rate_limited_total[10m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} hit a per-key sign rate limit"
        description: "{{ $labels.instance }} refused a signature because the key reached signing_policy.sign_rate_limit_per_min\
          \ / _per_day (or a rate_limits rule). The driver does not fail over on it (every node enforces\
          \ the same ceiling). Either a key outgrew its limit \u2014 raise it on every node \u2014 or\
          \ something with the driver certificate is signing in bulk: compare the sign journals with the\
          \ driver audit log (rutli-cosigner audit-cross-check)."
    - alert: RutliSignerAclAbsent
      expr: increase(rutli_signer_acl_absent_total[1h]) > 0
      for: 1h
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} serves a client with no key ACL"
        description: "A Signer client CN without a signing_policy.signer_acl entry used a key on {{ $labels.instance\
          \ }} \u2014 allowed while signer_acl_required is off, which means a stolen driver certificate\
          \ may use every key, including another tenant's. Add an ACL entry for every signer CN and turn\
          \ signer_acl_required on."
    - alert: RutliDeleteIntentRefused
      expr: sum by (instance, reason) (increase(rutli_delete_intent_refusals_total[15m])) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused a hosted-key delete ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused a hosted-key delete or a peer's tombstone (reason\
          \ {{ $labels.reason }}). disabled / role: a client outside hosted_keys.delete_allowlist tried\
          \ to delete (with the driver certificate, that is either an unconfigured Canton deleteKey or\
          \ someone holding the certificate). signature / certificate / signer / cluster / malformed in\
          \ an anti-entropy log line: a peer presented a tombstone it could not back with a valid delete\
          \ intent \u2014 suspect that cosigner. stale: a tombstone older than the copy it would delete\
          \ (an undeleted or regenerated key) \u2014 expected after hosted-undelete until every node is\
          \ undeleted. rollback: a PurgeKey without an intent outside a fenced generation. The cosigner\
          \ log names the key."
    - alert: RutliHostedKeyDeleted
      expr: sum by (instance, how) (increase(rutli_hosted_tombstones_written_total[15m])) > 0
      for: 0m
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} tombstoned a hosted key ({{ $labels.how }})"
        description: 'A hosted key was deleted on {{ $labels.instance }} (how={{ $labels.how }}: converted
          = a live copy became a tombstone, recorded = a tombstone recorded for a key this node did not
          hold). Deletes are authorized by a signed delete intent every node verified, and the material
          stays sealed in the tombstone for hosted_keys.delete_grace_secs (rutli-cosigner hosted-undelete
          on every node to undo). Confirm the delete was intended; the cosigner log names the key and
          the signer CN.'
    - alert: RutliKeyFilesUnopenable
      expr: max by (instance) (rutli_keyfiles{dek="unknown"}) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} holds key files no DEK it has opens"
        description: "At start-up {{ $labels.instance }} found key files sealed under a DEK its seal bundle\
          \ does not hold \u2014 typically previous_share_deks dropped (seal drop-previous) before every\
          \ file was re-sealed, or the wrong bundle mounted. Those keys are unusable on this node. Mount\
          \ the bundle that still lists the previous DEK, restart (the node re-seals at start), and check\
          \ `rutli-cosigner keyfile status` before dropping it again."
    - alert: RutliKeyFileMigrationPending
      expr: max by (instance) (rutli_keyfiles{dek="previous"}) > 0 or max by (instance) (rutli_keyfiles{format="plaintext"})
        > 0
      for: 1d
      labels:
        severity: info
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} has key files under a previous DEK, or plaintext"
        description: '{{ $labels.instance }} reported key files still sealed under a previous DEK (a DEK
          rotation not finished: restart the node or run keyfile migrate, then seal drop-previous after
          a backup) or plaintext key files for a day. The legacy seal master can be destroyed only after
          every node''s files are under a fresh DEK (decision P1). Check with `rutli-cosigner keyfile
          status`.'
    - alert: RutliLockPoisonRecovered
      expr: increase(rutli_lock_poison_recoveries_total[1h]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} recovered from a panic holding {{ $labels.lock\
          \ }}"
        description: 'A request panicked on {{ $labels.instance }} while holding the {{ $labels.lock }}
          lock. The node recovered the lock and keeps serving (in-flight signing sessions or the key cache
          may have been dropped, ceremony votes reloaded from disk), but a panic is a bug: find it in
          the cosigner log just before ''recovered a lock poisoned by a panicking request'' and report
          it.'
    - alert: RutliGrpcAcceptErrors
      expr: increase(rutli_grpc_accept_errors_total[15m]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} failed to accept gRPC connections"
        description: '{{ $labels.instance }} could not accept new gRPC connections and is retrying with
          a backoff; meanwhile the driver and the peers cannot reach it. Usually the process is out of
          file descriptors: compare rutli_fd_limit with rutli_grpc_connections and the node''s open descriptors,
          and look for ''accepting a gRPC connection failed'' in its log. Raise the container''s nofile
          limit if rutli_fd_limit is low.'
    - alert: RutliGrpcConnectionsNearLimit
      expr: rutli_grpc_connections / rutli_grpc_connection_limit > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} is near its gRPC connection limit"
        description: '{{ $labels.instance }} has had more than 90% of its gRPC connection slots in use
          for 5 minutes. Past the limit, new connections wait in the listen backlog, so the driver or
          a peer may time out. A cosigner normally needs a handful of connections (the drivers and the
          peers multiplex calls); many more come from a misbehaving client or something holding connections
          open. Check the sources of the connections to the gRPC port.'
    - alert: RutliBackgroundLoopRestarted
      expr: increase(rutli_background_loop_restarts_total[1h]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} restarted its {{ $labels.loop }} loop after\
          \ a panic"
        description: 'A pass of the {{ $labels.loop }} background loop panicked on {{ $labels.instance
          }}. The loop was restarted after 30 s (anti_entropy then also waits one anti_entropy_interval_secs
          before its next sweep) and keeps running, but a panic is a bug: find it in the cosigner log
          at ''background loop panicked; restarting it'' (the panic message is in the same line) and report
          it. A loop that panics on every pass gets no pass done: ceremony_resolver leaves STAGED ceremonies
          unresolved, epoch_check stops refreshing stale-share marks, nonce_pruner lets burned nonce markers
          pile up on the key volume, anti_entropy stops healing hosted keys.'
    - alert: RutliHostedKeyConflict
      expr: increase(rutli_anti_entropy_conflicts_total[1h]) > 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli hosted key conflict detected on {{ $labels.instance }}"
        description: "{{ $labels.instance }} saw two different materials under one hosted key id: a peer\
          \ holds other material than this node (anti-entropy), peers that it would pull from disagree,\
          \ it refused a push over another copy, or a GenerateKey it led was aborted and rolled back.\
          \ Hosted keys are create-once-immutable, so this is an invariant violation \u2014 not replication\
          \ lag \u2014 and nothing reconciles it automatically: picking a side could destroy the only\
          \ copy that can decrypt already-recorded traffic. A node that lacks the key answers UNAVAILABLE\
          \ for it while the copies disagree. Find the key id and the peers in the cosigner logs (error\
          \ level, \"CONFLICT\" or \"ABORTED\"), stop rotating that key, run verify-hosted, and resolve\
          \ by hand (docs/hosted-keys.md, section 4: When rutli_anti_entropy_conflicts_total increases)."
    - alert: RutliHostedReplicationRefused
      expr: sum by (instance, reason) (increase(rutli_hosted_replication_refusals_total{reason=~"unfenced|invalid|timestamp|unverifiable|throttled|spec|intent|mixed-version"}[15m]))
        > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} refused hosted key material ({{ $labels.reason\
          \ }})"
        description: "{{ $labels.instance }} refused hosted key material from a peer (reason {{ $labels.reason\
          \ }}). unfenced: a peer pushed a key this node does not hold without holding this node's generation\
          \ fence for it. During a rolling upgrade from 0.4.0 this is a 0.4.0 node's anti-entropy push\
          \ and stops once this node has pulled the key itself; otherwise suspect the peer named in the\
          \ log. invalid: the material does not open or validate (an RSA or EC key whose public half is\
          \ not its own). timestamp: a creation or undelete time in the future beyond signing_policy.clock_skew_secs\
          \ \u2014 check that node's clock. unverifiable: a push refused because another cosigner answered\
          \ with a copy this node cannot check (see invalid / timestamp for that cosigner). throttled:\
          \ read-repair lookups for keys this node lacks exceed 20 a second \u2014 a client flooding made-up\
          \ key ids; the requests got UNAVAILABLE and the driver failed over. spec: a peer pushed a key\
          \ of another spec than the generation's fence declared; intent: a push under a fence taken without\
          \ a generate intent on a node that now requires one \u2014 suspect the peer in the log. mixed-version:\
          \ this node, as leader, refused a generation because a reachable cosigner is older than 0.5.0\
          \ \u2014 finish the upgrade. Nothing was stored. The cosigner log names the key and the peer."
    - alert: RutliHostedRollbackIncomplete
      expr: increase(rutli_hosted_rollback_incomplete_total[1h]) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} could not roll back an aborted hosted-key generation\
          \ everywhere"
        description: 'A GenerateKey led by {{ $labels.instance }} was aborted, and its rollback did not
          reach at least one cosigner (log: "did not reach this cosigner", with the node and the key).
          That node may keep, and serve, a copy of a key no client was given; if it is down when the client
          retries, the retry can create a second key under the id. Run verify-hosted for the key; if the
          copy is still there and no client uses the key, quarantine that file by hand (docs/hosted-keys.md,
          section 3, "A leader that dies mid-generation").'
    - alert: RutliHostedKeyFutureTimestamp
      expr: max by (instance) (rutli_hosted_keys_future_timestamp) > 0
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli cosigner {{ $labels.instance }} holds a hosted key with a time in the future"
        description: '{{ $labels.instance }} holds hosted keys whose creation or undelete time lies in
          the future beyond the clock skew allowance (written before 0.5.0, which refuses such keys from
          peers). The key still serves, but every delete of it is refused as stale until that time, and
          other nodes will not pull this copy. The cosigner log names the key ("hosted key with a time
          in the future"). Check the clocks of the cosigners; see docs/hosted-keys.md.'
    - alert: RutliHostedKeyUnderReplicated
      expr: rutli_key_replicas < 3
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli hosted key under-replicated on {{ $labels.instance }}"
        description: At least one cluster-hosted key is held by fewer than 3 cosigners and has not healed
          within 30 minutes. A key written at the 2-of-3 write quorum is pulled by the missing node's
          next anti-entropy sweep (default 300s) once two other nodes hold it, so a sustained shortfall
          means a cosigner is down, sweeps are failing, or only one node holds the key (rutli_hosted_replication_refusals_total{reason="unconfirmed"}
          on the node that lacks it). Check that every cosigner is up and reachable on the mesh.
    - alert: RutliHostedKeyCriticallyUnderReplicated
      expr: rutli_key_replicas < 2
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "R\xFCtli hosted key has a single copy on {{ $labels.instance }}"
        description: 'At least one cluster-hosted key is held by only ONE cosigner. Losing that node loses
          the key, and because Canton peers encrypt to the published public key, the loss is unrecoverable
          for already-recorded traffic (see docs/disaster-recovery.md 3b). A key on one node is not copied
          automatically: another node pulls only what two peers hold. Restore the missing cosigners immediately;
          if they are gone, copy the key by hand (export-key on the holder, import-key on another node,
          docs/disaster-recovery.md). Do not rotate or delete keys until replication recovers.'
    - alert: RutliHostedKeyErrors
      expr: rate(rutli_hosted_key_ops_total{result="error"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli hosted-key {{ $labels.op }} errors on {{ $labels.instance }}"
        description: '{{ $labels.instance }} has had a non-zero rate of failed hosted-key "{{ $labels.op
          }}" operations over the last 5m, sustained for 5m. Canton has no software fallback for a KMS
          decrypt: sustained op="decrypt" errors surface as KmsDecryptError and can disconnect the participant
          from the synchronizer. Check whether this node actually holds the key (a lagging replica repairs
          on demand) before suspecting the sealing or crypto backend.'
    - alert: RutliHostedKeyReplicaShortfall
      expr: max by (job) (rutli_hosted_keys) - min by (job) (rutli_hosted_keys) > 0
      for: 20m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli hosted keys are unevenly replicated across job {{ $labels.job }}"
        description: "Cosigners in job {{ $labels.job }} report different hosted-key counts, meaning at\
          \ least one key exists on fewer nodes than the cluster has. Writes commit at write_quorum (default\
          \ 2 of 3), so a node that was down during a GenerateKey lags legitimately until its own anti-entropy\
          \ sweep pulls the key from two peers (default every 300s; the gauge itself only refreshes at\
          \ the end of a node's own sweep or when a peer lists its keys). Divergence sustained for 20\
          \ minutes means healing is failing \u2014 check rutli_anti_entropy_repairs_total and the sweep\
          \ logs. Two replicas survive one node loss; one survives none."
    - alert: RutliUnreadableKeyFiles
      expr: increase(rutli_unreadable_key_files_total[30m]) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli key file on {{ $labels.instance }} cannot be read"
        description: "{{ $labels.instance }} has a key file on disk it cannot open, and has been unable\
          \ to open it for at least 15 minutes. Such a file is logged, counted and SKIPPED from the hosted-key\
          \ inventory \u2014 failing the whole listing would stop anti-entropy for every healthy key too\
          \ \u2014 so the damaged key is invisible to replication: peers do not see this node's copy,\
          \ and this node does not pull the key back, while rutli_hosted_keys can still look even across\
          \ the cluster. Usual causes are a seal master secret rotated without re-sealing the existing\
          \ files, a partial or foreign restore, or disk corruption. It does not self-heal. Take the key\
          \ id from the cosigner's error log, then restore the seal secret that file was written under,\
          \ restore a good copy (rutli-cosigner restore, or import-key from an export \u2014 see docs/disaster-recovery.md\
          \ 3d), or, after confirming a readable copy on another cosigner, delete the file so anti-entropy\
          \ can replace it."
    - alert: RutliDecryptRateLimited
      expr: increase(rutli_decrypt_rate_limited_total[10m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "R\xFCtli is refusing hosted-key decryptions on {{ $labels.instance }} (rate limit)"
        description: "{{ $labels.instance }} has refused hosted-key decryptions for at least 5 minutes\
          \ because a key hit hosted_keys.decrypt_rate_limit_per_min (default 6000/min per key, enforced\
          \ per node). In normal operation this counter never moves: the default is ~100 decryptions per\
          \ second sustained on a SINGLE key, far above what a Canton participant does. Two readings.\
          \ (1) Legitimate growth \u2014 the cosigner logs 'approaching its rate limit' with the key id\
          \ before it starts refusing, so check for that warning and raise the limit. Canton sees RESOURCE_EXHAUSTED\
          \ and backs off; the driver deliberately does NOT fail over to another cosigner, since every\
          \ node enforces the same ceiling. (2) Abuse \u2014 this is what a stolen driver certificate\
          \ looks like, and because Canton's encryption keys protect per-view session keys, whoever holds\
          \ it can read retrospectively. If the traffic is not yours, treat it as a live confidentiality\
          \ incident: check the driver certificate's provenance and signer_allowlist, then rotate the\
          \ encryption key through Canton topology and the driver cert. See docs/hosted-keys.md section\
          \ 5."
