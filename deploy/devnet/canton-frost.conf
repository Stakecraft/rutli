// Phase 2 devnet — Canton participant whose namespace/identity key is served by the FROST cosigner
// cluster, and whose other keys are served by the delegate backend.
//
// Prereq: a running cosigner cluster (deploy/frost/docker-compose.yml) reachable at frost.endpoint.
// The Ed25519 namespace key is generated via cluster DKG and its topology transactions are signed
// by threshold FROST — no single machine ever holds the whole key.
//
// This config uses `delegate = "software"` so it runs without an HSM. In production use
// `delegate = "hsm"` and add the `hsm { ... }` block (see canton-frost via docs/phase-1-hsm.md).

canton {
  parameters {
    non-standard-config = yes
  }

  participants.participant1 {
    storage.type = memory
    ledger-api.port = 5011
    admin-api.port  = 5012
    http-ledger-api.port = 5013

    crypto {
      provider = kms
      kms {
        type = driver
        name = "rutli"
        config = {
          backend       = "frost"
          audit-logging = true
          frost = {
            // Full cosigner roster — the driver fails over across these, so a downed cosigner
            // does not block signing (any live node leads the request).
            endpoints = ["localhost:9101", "localhost:9102", "localhost:9103"]
            delegate  = "software"         // "hsm" in production
          }
        }
      }

      // Namespace key must be Ed25519 — that is the key FROST serves.
      signing.keys.default       = ec-curve-25519
      signing.algorithms.default = ed-25519
    }
  }
}
