// Phase 0 devnet — a single Canton participant whose crypto is delegated to the rutli driver.
//
// On auto-init the participant generates its namespace/identity + signing keys THROUGH the driver
// (external key storage) and SIGNS its own identity topology transactions with the namespace key
// via the driver's `sign`. That alone exercises the full integration seam end-to-end.
//
// Node/port schema follows Canton 3.5.x community. If a key is rejected, diff against the
// `reference.conf` shipped in your Canton release.

canton {
  parameters {
    // Allow the KMS driver config block (a non-default provider path).
    non-standard-config = yes
  }

  participants.participant1 {
    storage.type = memory
    ledger-api.port = 5011
    admin-api.port  = 5012
    http-ledger-api.port = 5013

    crypto {
      provider = kms
      kms {
        type = driver
        name = "rutli"
        config = {
          backend       = "software"
          audit-logging = true
        }
      }

      // Pin Ed25519 (the KMS-provider default is EC-P256). Ed25519 is the production target for the
      // namespace key — the exact algorithm the Phase 2 FROST backend thresholdizes.
      // Syntax per Canton's own test configs (community/app/src/test/resources/*kms*.conf).
      signing.keys.default       = ec-curve-25519
      signing.algorithms.default = ed-25519
    }
  }

  // Minimal embedded synchronizer, so you can optionally extend the smoke test to connect the
  // participant and sign cross-node topology transactions. These use the default (jce) provider.
  sequencers.sequencer1 {
    storage.type    = memory
    public-api.port = 5001
    admin-api.port  = 5002
  }

  mediators.mediator1 {
    admin-api.port = 5007
  }
}
