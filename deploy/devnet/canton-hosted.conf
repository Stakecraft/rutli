// Cluster-hosted keys end-to-end — a Canton participant with NO local key state and NO HSM.
//
// Every key this node needs lives in the cosigner cluster:
//   - the Ed25519 namespace/identity key as a true 2-of-3 FROST threshold key (never assembled), and
//   - the RSA-2048 encryption keypair + AES-256-GCM symmetric key as cluster-hosted keys
//     (replicated whole keys, sealed at rest on each cosigner — see docs/hosted-keys.md).
//
// `delegate = "none"` is the point of this config: there is no software or HSM backend behind the
// driver at all, so an operation that fails to route to the cluster fails loudly instead of quietly
// doing local crypto. This is the configuration the 2026-08-12 incident argues for — a restarted
// participant has nothing to lose, because it never held a private key.
//
// Prereq: a cosigner cluster with `hosted_keys.enabled` reachable at the endpoints below, e.g.
//   RUTLI_SEAL_SECRET=… docker compose -f deploy/soak/docker-compose.yml up -d
// (deploy/frost/config-tls already enables hosted keys.)

canton {
  parameters {
    non-standard-config = yes
  }

  participants.participant1 {
    storage.type = memory
    ledger-api.port = 5011
    admin-api.port  = 5012
    http-ledger-api.port = 5013

    crypto {
      provider = kms
      kms {
        type = driver
        name = "rutli"
        config = {
          backend       = "frost"
          audit-logging = true
          frost = {
            // Full roster: the driver fails over across these, so a downed cosigner does not block
            // signing or decryption (any live node can lead, and every node holds the hosted keys).
            // Each endpoint names the certificate it must present (cosigner<id>), so one cosigner's
            // certificate cannot answer at another's address (audit M3).
            endpoints = [
              { url = "localhost:9101", tls-name = "cosigner1" },
              { url = "localhost:9102", tls-name = "cosigner2" },
              { url = "localhost:9103", tls-name = "cosigner3" }
            ]
            // Route the non-FROST keys (RSA encryption, AES symmetric) to the cluster too.
            hosted-keys = true
            // No local backend at all. Requires hosted-keys = true.
            delegate = "none"
            tls = {
              ca-cert = "deploy/frost/certs/ca.crt"
              cert    = "deploy/frost/certs/driver.crt"
              key     = "deploy/frost/certs/driver.key"
            }
          }
        }
      }

      // The namespace key FROST serves is Ed25519.
      signing.keys.default       = ec-curve-25519
      signing.algorithms.default = ed-25519
      // Canton's KMS mode uses RSA-OAEP for asymmetric encryption; that is what the cluster hosts.
      encryption.keys.default       = rsa-2048
      encryption.algorithms.default = rsa-oaep-sha-256
    }
  }
}
