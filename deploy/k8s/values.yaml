#
# Chart values deploy/k8s/cosigner.yaml is rendered with (scripts/render-k8s.sh). Edit here, then
# re-render; or install the chart directly with your own values.
topology: perNode
# The chart's default: the cosigners refuse to start until every enforcement setting is on
# (docs/production-profile.md). Before the first apply, fill in the per-cluster values a checked-in
# manifest cannot know — clusterId, keyfile.cluster_uuid (then write_version: 2, accept_v1: false)
# and signingPolicy.signer_pins — and run `rutli-cosigner check-config` on the rendered config.
profile: production
replicaCount: 3
threshold: 2
signerAllowlist: [driver]
operatorAllowlist: [operator]
# The refresh CronJob's certificate (cronjob-refresh.yaml): Refresh + KeyStatus, never Sign.
refreshAllowlist: [refresher]
# Cluster-hosted keys need per-cluster public values (hostedKeys.commitmentKey and each node's
# distPublicKey), which a checked-in manifest cannot know. Enable them by rendering with your own
# values (README §5), or with the chart.
hostedKeys:
  enabled: false
# Per-node backup sidecars into per-node backup PVCs (README, "Backups").
backup:
  enabled: true
# Enforcement the production profile requires that needs no per-cluster value. The driver's
# certificate keeps every key (`""`); give it a prefix when several participants share the cluster.
signingPolicy:
  require_epoch_match: true
  signer_acl_required: true
  signer_may_refresh: false
  signer_acl:
    driver: [""]
