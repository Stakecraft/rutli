# Copyright 2026 StakeCraft
# SPDX-License-Identifier: Apache-2.0
#
# Node 1 (topology=perNode). This pod spec names exactly one seal Secret and one TLS Secret —
# node 1's — so only the kubelet running this pod may read them (node authorizer), and no
# other pod spec ever references them. scripts/check-deploy-policy.sh enforces that.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rutli-cosigner-n1
  labels:
    helm.sh/chart: rutli-cosigner-0.4.0-rc.2
    app.kubernetes.io/name: rutli-cosigner
    app.kubernetes.io/instance: rutli
    app.kubernetes.io/version: "0.4.0-rc.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: rutli
    rutli.io/node: "1"
spec:
  # A StatefulSet, not a Deployment, even for one replica: it never starts a replacement while the
  # old pod object still exists, so a partitioned node cannot end up with two live processes on one
  # share (a ReplicaSet replaces a Terminating pod at once).
  serviceName: rutli-cosigner
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: rutli-cosigner
      app.kubernetes.io/instance: rutli
      rutli.io/node: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rutli-cosigner
        app.kubernetes.io/instance: rutli
        rutli.io/node: "1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
        prometheus.io/path: /metrics
    spec:
      # No API access from a cosigner pod, ever.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        # Across all nodes' StatefulSets (shared labels): never two shares on one host.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rutli-cosigner
                  app.kubernetes.io/instance: rutli
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rutli-cosigner
              app.kubernetes.io/instance: rutli
      containers:
        - name: cosigner
          image: ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.2@sha256:dfb5c859ccb508a283ea7f029077d79608f171a08335c4eb58960c9a71b8c2b4
          imagePullPolicy: IfNotPresent
          args: ["--config", "/config/cosigner-1.json"]
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: grpc
              containerPort: 9101
            - name: metrics
              containerPort: 9200
          # Readiness = "this node can actually sign" (key store usable + gRPC port open); see the
          # legacy StatefulSet template and README, "Probes".
          readinessProbe:
            exec:
              command: ["rutli-cosigner", "--config", "/config/cosigner-1.json", "health"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness stays a bare TCP check on purpose: a restart does not fix a broken volume.
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: seal, mountPath: /run/rutli/seal, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        # Copies this node's SEALED key files to this node's destination. Data volume read-only; no
        # seal bundle, no TLS key, no API token: it never holds anything that opens a share.
        - name: backup
          image: ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.2@sha256:dfb5c859ccb508a283ea7f029077d79608f171a08335c4eb58960c9a71b8c2b4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/destination/backup-loop.sh"]
          env:
            - { name: NODE_ID, value: "1" }
            - { name: DAILY_AT_UTC, value: "03:17" }
            - { name: RUN_ON_START, value: "true" }
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
