#
# Enable only on a cluster where EVERY cosigner runs 0.4.0-rc.2 or later (ceremony protocol 2: the
# leader never sees a round-2 package, audit C1; two-phase commit, audit H1). Never on a mixed
# cluster. See docs/ceremonies.md.
#
# Example: weekly proactive share refresh. Runs against one Signer endpoint. From 0.4.0-rc.4
# signing goes on during the refresh (no need to drain topology traffic; a few signs in flight at
# the commit are retried by their leader). On rc.3 and earlier the fence paused signing for the key.
# Set KEY_ID to the FROST key (e.g. frost-participant1-namespace).
#
# Runs as the REFRESHER role (audit C2): a certificate on the cosigners' `refresh_allowlist`, which
# may call Refresh and KeyStatus and nothing else — never Sign. It mounts ONLY that cert/key (Secret
# rutli-refresher-tls, kubernetes.io/tls) and the CA (rutli-cosigner-ca) — never the driver's or a
# cosigner's key — with client-refresher.json from rutli-client-config (client-config.yaml).
# `scripts/gen-frost-certs.sh` issues `refresher.{crt,key}`.
#
# No refresher certificate yet (a cluster whose CA key is lost, until docs/ca-rotation.md issues
# one)? Use the operator certificate: put its CN in the cosigners' `refresh_allowlist` too
# (`refreshAllowlist: [operator]` in the chart; the operator role cannot sign either), create the
# Secret from operator.{crt,key} under the name rutli-refresher-tls, and change client-refresher.json's
# cert paths to the operator files. Do NOT use the driver certificate: once
# `signing_policy.signer_may_refresh` is off (the target state) the cosigners refuse it, and a job
# that carries the driver key is a signing credential sitting in a CronJob.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cosigner-refresh
  namespace: rutli
spec:
  schedule: "0 4 * * 1" # Mondays 04:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            rutli.io/client: "true" # NetworkPolicy: may dial Signer
        spec:
          restartPolicy: Never
          # fsGroup so uid 10001 can read the 0440 projected key.
          securityContext: { fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: refresh
              image: ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.3@sha256:f4d92758cc1b7f8036fdabe67aab79ac60bce6499e549f853ca160efb1b631e8
              imagePullPolicy: IfNotPresent
              env:
                - name: KEY_ID
                  value: frost-participant1-namespace # <-- set me
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  rutli-cosigner --config /config/client-refresher.json \
                    refresh --key-id "$KEY_ID" \
                    --target https://rutli-node-1.rutli.svc:9101
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: certs, mountPath: /certs, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: config
              configMap: { name: rutli-client-config }
            - name: certs
              projected:
                defaultMode: 0440
                sources:
                  - secret: { name: rutli-cosigner-ca, items: [{ key: ca.crt, path: ca.crt }] }
                  - secret:
                      name: rutli-refresher-tls
                      items: [{ key: tls.crt, path: refresher.crt }, { key: tls.key, path: refresher.key }]
            - name: tmp
              emptyDir: {}
