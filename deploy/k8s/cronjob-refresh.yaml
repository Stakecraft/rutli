#
# DO NOT ENABLE YET: until the ceremony fixes ship (audit C1: the leader sees every round-2 package;
# H1: a refresh interrupted between nodes can leave mixed share epochs), a refresh is a risk to the
# key, not a mitigation. See docs/runbook-per-node-seal.md.
#
# Example: weekly proactive share refresh. Runs against one Signer endpoint; the leader fences the
# key cluster-wide, so drain heavy topology traffic first (or accept SignInProgress retries).
# Set KEY_ID to the FROST key (e.g. frost-participant1-namespace). Runs as the driver role (CN
# `driver`, on signer_allowlist): it mounts ONLY the driver's cert/key (Secret rutli-driver-tls,
# kubernetes.io/tls) and the CA (rutli-cosigner-ca) — never a cosigner key — with the client config
# client-driver.json from rutli-client-config (client-config.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cosigner-refresh
  namespace: rutli
spec:
  schedule: "0 4 * * 1" # Mondays 04:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            rutli.io/client: "true" # NetworkPolicy: may dial Signer
        spec:
          restartPolicy: Never
          # fsGroup so uid 10001 can read the 0440 projected key.
          securityContext: { fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: refresh
              image: ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.2@sha256:dfb5c859ccb508a283ea7f029077d79608f171a08335c4eb58960c9a71b8c2b4
              imagePullPolicy: IfNotPresent
              env:
                - name: KEY_ID
                  value: frost-participant1-namespace # <-- set me
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  rutli-cosigner --config /config/client-driver.json \
                    refresh --key-id "$KEY_ID" \
                    --target https://rutli-node-1.rutli.svc:9101
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: certs, mountPath: /certs, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: config
              configMap: { name: rutli-client-config }
            - name: certs
              projected:
                defaultMode: 0440
                sources:
                  - secret: { name: rutli-cosigner-ca, items: [{ key: ca.crt, path: ca.crt }] }
                  - secret:
                      name: rutli-driver-tls
                      items: [{ key: tls.crt, path: driver.crt }, { key: tls.key, path: driver.key }]
            - name: tmp
              emptyDir: {}
