#
# Nightly sealed-share backups, taken INSIDE each running cosigner with `kubectl exec` — one exec
# per StatefulSet ordinal — and then shipped off-cluster by an operator-supplied script.
#
# HARD RULE: never mount a cosigner's data volume into another pod. On 2026-10-07 the previous
# version of this file did exactly that (a Job pod bound cosigner-0's ReadWriteOnce PVC, with no
# fsGroup); the second mount left /data/keys unreadable to the live cosigner, which kept passing
# its gRPC health check and answered every Sign with INTERNAL — a total signing outage on the
# DevNet soak until the pod was restarted (docs/soak-2026-10-devnet.md, incident #1). A cosigner's
# volume is its own. This design touches it only through the cosigner's own process.
#
# What one run does, for i in 0..2 (pod cosigner-i runs config cosigner-(i+1).json):
#   1. kubectl exec cosigner-i -- rutli-cosigner backup --out /data/backup-<weekday>
#        -> a 7-day rotation on the node's OWN volume (covers the "wiped keys/" restore drill)
#   2. kubectl exec cosigner-i -- tar -cf - backup-<weekday>   > /work/<stamp>/cosigner-i.tar
#        -> streamed out of the pod, never through a shared mount
#   3. sh /destination/ship.sh /work/<stamp>
#        -> YOUR off-cluster upload, from ConfigMap rutli-backup-destination (below). The shipped
#           placeholder exits 1 so an unconfigured destination is a failed Job, not a silent gap.
#
# Share files are written atomically and only rewritten by a refresh ceremony, so a live copy is
# consistent unless a refresh is in flight: keep refresh drills away from the backup minute.
# Backups are sealed (ciphertext); they are only useful together with RUTLI_SEAL_SECRET — store
# the two in different trust domains (docs/disaster-recovery.md §4).
#
# Enable by uncommenting this file in kustomization.yaml, then edit the ship.sh below.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rutli-backup
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner-backup
    app.kubernetes.io/part-of: rutli
automountServiceAccountToken: false # mounted explicitly on the Job pod only
---
# Least privilege: `kubectl exec` is a GET on the pod followed by a POST on pods/exec, so that is
# all the Role grants — and only for the three cosigner pods by name. No list, no logs, no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rutli-backup
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner-backup
    app.kubernetes.io/part-of: rutli
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
    resourceNames: [cosigner-0, cosigner-1, cosigner-2]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
    resourceNames: [cosigner-0, cosigner-1, cosigner-2]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rutli-backup
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner-backup
    app.kubernetes.io/part-of: rutli
subjects:
  - kind: ServiceAccount
    name: rutli-backup
    namespace: rutli
roleRef:
  kind: Role
  name: rutli-backup
  apiGroup: rbac.authorization.k8s.io
---
# The backup destination. Replace ship.sh's body with your upload; everything else is generic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rutli-backup-destination
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner-backup
    app.kubernetes.io/part-of: rutli
data:
  ship.sh: |
    #!/bin/sh
    # Called once per run with ONE argument: a directory holding one tar per cosigner
    # (cosigner-0.tar, cosigner-1.tar, cosigner-2.tar), each containing that node's
    # backup-<weekday>/ directory of sealed share + hosted-key files.
    #
    # Keep the tars in a different trust domain from RUTLI_SEAL_SECRET, and ideally one
    # destination per cosigner (docs/disaster-recovery.md §4). Two bodies that work:
    #
    #   # (a) a volume of the backup Job's OWN — never a cosigner's claim — mounted at /backups
    #   #     (add the volume + mount to the CronJob below):
    #   cp -r "$1" /backups/ && ls -l /backups
    #
    #   # (b) object storage, with an image that carries the uploader and credentials from a
    #   #     Secret injected as env on the backup container:
    #   rclone copy "$1" "remote:rutli-backups/$(basename "$1")"
    #
    set -eu
    echo "ship.sh: no backup destination configured — edit ConfigMap rutli-backup-destination" >&2
    echo "ship.sh: this run's backups exist only on each cosigner's own volume (/data/backup-<weekday>)" >&2
    exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cosigner-backup
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner-backup
    app.kubernetes.io/part-of: rutli
spec:
  schedule: "17 3 * * *" # daily 03:17 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900 # a hung exec must not block the next night's run
      template:
        metadata:
          labels:
            # Deliberately NOT the cosigner selector labels: this pod must never be adopted by the
            # StatefulSet or admitted by the cosigner NetworkPolicies.
            app.kubernetes.io/name: rutli-cosigner-backup
            app.kubernetes.io/part-of: rutli
        spec:
          restartPolicy: Never
          serviceAccountName: rutli-backup
          automountServiceAccountToken: true # kubectl needs the in-cluster token
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              # alpine/k8s = kubectl + bash + coreutils. Pinned by digest; bump deliberately.
              image: alpine/k8s:1.31.13@sha256:7a319b15cfc99c9aaa27ec9891d6b4ca24632b795908591c7b0ba89b03549e0a
              imagePullPolicy: IfNotPresent
              env:
                - { name: HOME, value: /tmp } # kubectl writes its discovery cache under $HOME
                - { name: REPLICAS, value: "3" } # = StatefulSet replicas
                - { name: POD_PREFIX, value: cosigner } # = StatefulSet name
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  day=$(date -u +%u)                       # 1..7: seven-day rotation on each node
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  work="/work/$stamp"; mkdir -p "$work"
                  rc=0
                  for i in $(seq 0 $((REPLICAS - 1))); do
                    pod="$POD_PREFIX-$i"
                    cfg="/config/cosigner-$((i + 1)).json"
                    if kubectl exec "$pod" -c cosigner -- sh -c \
                         "rm -rf /data/backup-$day && rutli-cosigner --config $cfg backup --out /data/backup-$day" \
                       && kubectl exec "$pod" -c cosigner -- tar -C /data -cf - "backup-$day" > "$work/$pod.tar"; then
                      echo "$pod: backup at /data/backup-$day, copied out as $work/$pod.tar ($(wc -c < "$work/$pod.tar") bytes)"
                    else
                      echo "$pod: BACKUP FAILED" >&2; rc=1; rm -f "$work/$pod.tar"
                    fi
                  done
                  # Ship whatever was taken, even on a partial failure — a backup of two shares
                  # beats none. The placeholder ship.sh fails until a destination is configured.
                  if ls "$work"/*.tar >/dev/null 2>&1; then
                    sh /destination/ship.sh "$work" || { echo "ship.sh FAILED" >&2; rc=1; }
                  fi
                  exit $rc
              resources:
                requests: { cpu: "20m", memory: "64Mi" }
                limits: { cpu: "200m", memory: "128Mi" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: destination, mountPath: /destination, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: destination
              configMap: { name: rutli-backup-destination, defaultMode: 0555 }
            # Scratch for the streamed-out tars. Only volumes the backup Job OWNS go here; a
            # cosigner's PVC (data-cosigner-N) never does — see the header.
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
