#
# Headless service: gives each StatefulSet pod a stable DNS name (cosigner-0.rutli-cosigner, …) for
# the mesh and for the Canton driver's `frost.endpoints`.
apiVersion: v1
kind: Service
metadata:
  name: rutli-cosigner
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner
spec:
  clusterIP: None
  # Peers must resolve each other during DKG before all are "ready". Consequence: a pod failing its
  # readiness probe (e.g. an unreadable key store) stays in DNS for the driver too — readiness makes
  # it visible (READY 0/1, PDB, rollouts); the driver's failover does the routing.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rutli-cosigner
  ports:
    - name: grpc
      port: 9101
      targetPort: grpc
