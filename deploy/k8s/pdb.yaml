#
# Keep at least 2 of 3 cosigners up during voluntary disruptions so a 2-of-3 threshold can still
# sign. Do not drain more than one pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cosigner
  namespace: rutli
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rutli-cosigner
