apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cosigner
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner
spec:
  serviceName: rutli-cosigner
  replicas: 3
  podManagementPolicy: Parallel # DKG needs every node reachable; bring them up together
  selector:
    matchLabels:
      app.kubernetes.io/name: rutli-cosigner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rutli-cosigner
      annotations:
        # Prometheus discovery (annotation-based scraping; for the Operator, use a PodMonitor on
        # port "metrics" instead). Metrics are counts/latencies only — no key material.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Never co-locate two shares on the same node. Add zone topologySpreadConstraints (below) so
      # shares also spread across failure domains when the cluster has zone labels.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rutli-cosigner
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway # set DoNotSchedule once you have ≥3 zones
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rutli-cosigner
      containers:
        - name: cosigner
          image: ghcr.io/stakecraft/rutli-cosigner:0.3.2@sha256:af38fd04fdc2446dbfa7478ed65a3296d1cc24ba337f24ceb1e43940fc6d7d3f
          imagePullPolicy: IfNotPresent
          # Pod cosigner-<ordinal> runs config cosigner-<ordinal+1>.json.
          command: ["/bin/sh", "-c"]
          args:
            - 'exec rutli-cosigner --config /config/cosigner-$(( ${HOSTNAME##*-} + 1 )).json'
          env:
            - name: RUST_LOG
              value: info
            - name: RUTLI_SEAL_SECRET # shared cluster master; each node derives its own key
              valueFrom:
                secretKeyRef:
                  name: rutli-seal
                  key: RUTLI_SEAL_SECRET
          ports:
            - name: grpc
              containerPort: 9101
            - name: metrics
              containerPort: 9200
          # Readiness = "this node can actually sign": its key store under /data/keys can be listed,
          # opened and written, and the gRPC port accepts connections (`rutli-cosigner health`). An
          # exec, not a `grpc:` probe — the port is mTLS and kubelet's gRPC probe is plaintext-only.
          # A node whose volume goes unreadable (2026-10-07 incident) now shows READY 0/1, holds a
          # rollout and counts against the PDB. It is NOT removed from the driver's endpoints: the
          # headless Service publishes not-ready addresses (the mesh needs them during DKG), so
          # routing around a sick node is the driver's failover plus the node refusing to lead or
          # join quorums.
          # `health` exits 0 (ready) or 1 (not ready); it exists since 0.3.1, so the image pin
          # must be ≥ 0.3.1.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'exec rutli-cosigner --config /config/cosigner-$(( ${HOSTNAME##*-} + 1 )).json health'
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness stays a bare TCP check on purpose: restarting the pod does not fix a broken
          # volume, and it would destroy the evidence (logs, the mount as it is) mid-incident.
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: rutli-cosigner-config }
        - name: certs
          # 0440 (not 0400): with fsGroup 10001 the non-root user reads the key via group perms.
          secret: { secretName: rutli-cosigner-tls, defaultMode: 0440 }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data # holds the sealed key share + nonce markers — MUST be durable
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
