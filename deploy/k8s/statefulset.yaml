apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cosigner
  namespace: rutli
  labels:
    app.kubernetes.io/name: rutli-cosigner
spec:
  serviceName: rutli-cosigner
  replicas: 3
  podManagementPolicy: Parallel # DKG needs every node reachable; bring them up together
  selector:
    matchLabels:
      app.kubernetes.io/name: rutli-cosigner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rutli-cosigner
      annotations:
        # Prometheus discovery (annotation-based scraping; for the Operator, use a PodMonitor on
        # port "metrics" instead). Metrics are counts/latencies only — no key material.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9200"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread shares across nodes (and, with topology labels, across zones) — independence is the
      # point of a threshold cluster. Make this `required...` in a multi-node/multi-zone cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rutli-cosigner
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cosigner
          image: ghcr.io/stakecraft/rutli-cosigner:latest # build+push from frost/Dockerfile
          imagePullPolicy: IfNotPresent
          # Pod cosigner-<ordinal> runs config cosigner-<ordinal+1>.json.
          command: ["/bin/sh", "-c"]
          args:
            - 'exec rutli-cosigner --config /config/cosigner-$(( ${HOSTNAME##*-} + 1 )).json'
          env:
            - name: RUST_LOG
              value: info
            - name: RUTLI_SEAL_SECRET # shared cluster master; each node derives its own key
              valueFrom:
                secretKeyRef:
                  name: rutli-seal
                  key: RUTLI_SEAL_SECRET
          ports:
            - name: grpc
              containerPort: 9101
            - name: metrics
              containerPort: 9200
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: rutli-cosigner-config }
        - name: certs
          # 0440 (not 0400): with fsGroup 10001 the non-root user reads the key via group perms.
          secret: { secretName: rutli-cosigner-tls, defaultMode: 0440 }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data # holds the sealed key share + nonce markers — MUST be durable
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
