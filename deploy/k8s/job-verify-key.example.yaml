#
# Example: one-off `rutli-cosigner verify-key --sign-test` for the split ceremony
# (docs/split-ceremony.md, Gates B and C), run in-cluster as the OPERATOR role.
#
# The operator certificate (CN `operator`, on operator_allowlist: KeyStatus + HostedKeyStatus +
# CeremonySignTest only) is never part of the standing deployment. Create its Secret for the
# ceremony, run this Job, read its log, and delete both afterwards:
#
#   kubectl -n rutli create secret tls rutli-operator-tls --cert=certs/operator.crt --key=certs/operator.key
#   KEY_ID=frost-import-… FP=1220… envsubst < deploy/k8s/job-verify-key.example.yaml | kubectl apply -f -
#   kubectl -n rutli logs -f job/verify-key
#   kubectl -n rutli delete job verify-key && kubectl -n rutli delete secret rutli-operator-tls
#
# Not listed in kustomization.yaml on purpose.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-key
  namespace: rutli
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        rutli.io/client: "true" # NetworkPolicy: may dial Signer
    spec:
      restartPolicy: Never
      securityContext: { fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: verify-key
          image: ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.6@sha256:8304e662d495eb1a8330cb5b04ba86b725ff1bf414fa217283add66b2df45ae3 # ≥ 0.4.0 for verify-key
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec rutli-cosigner --config /config/client-operator.json
              verify-key --key-id "${KEY_ID}" --expect-fingerprint "${FP}" --sign-test
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: certs, mountPath: /certs, readOnly: true }
      volumes:
        - name: config
          configMap: { name: rutli-client-config }
        - name: certs
          projected:
            defaultMode: 0440
            sources:
              - secret: { name: rutli-cosigner-ca, items: [{ key: ca.crt, path: ca.crt }] }
              - secret:
                  name: rutli-operator-tls
                  items: [{ key: tls.crt, path: operator.crt }, { key: tls.key, path: operator.key }]
