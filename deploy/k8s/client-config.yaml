#
# Client-side configs for the operator CLI run as Jobs: the driver role (cronjob-refresh.yaml:
# refresh) and the operator role (job-verify-key.example.yaml: verify-key, and verify-hosted the
# same way). Only the roster, threshold and tls block are used; each presents its own client cert,
# never a cosigner key.
# identifier/listen/data_dir are placeholders the parser requires. Each node is dialled at its
# per-node Service and verified under its own TLS name (cosigner<id>, the default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rutli-client-config
  namespace: rutli
data:
  client-driver.json: |
    {
      "identifier": 1,
      "listen": "127.0.0.1:0",
      "threshold": 2,
      "data_dir": "/tmp",
      "peers": [
        { "identifier": 1, "endpoint": "https://rutli-node-1.rutli.svc:9101" },
        { "identifier": 2, "endpoint": "https://rutli-node-2.rutli.svc:9101" },
        { "identifier": 3, "endpoint": "https://rutli-node-3.rutli.svc:9101" }
      ],
      "tls": { "ca_cert": "/certs/ca.crt", "cert": "/certs/driver.crt", "key": "/certs/driver.key" },
      "signer_allowlist": ["driver"],
      "peer_allowlist": ["cosigner1", "cosigner2", "cosigner3"],
      "operator_allowlist": ["operator"]
    }
  client-operator.json: |
    {
      "identifier": 1,
      "listen": "127.0.0.1:0",
      "threshold": 2,
      "data_dir": "/tmp",
      "peers": [
        { "identifier": 1, "endpoint": "https://rutli-node-1.rutli.svc:9101" },
        { "identifier": 2, "endpoint": "https://rutli-node-2.rutli.svc:9101" },
        { "identifier": 3, "endpoint": "https://rutli-node-3.rutli.svc:9101" }
      ],
      "tls": { "ca_cert": "/certs/ca.crt", "cert": "/certs/operator.crt", "key": "/certs/operator.key" },
      "signer_allowlist": ["driver"],
      "peer_allowlist": ["cosigner1", "cosigner2", "cosigner3"],
      "operator_allowlist": ["operator"]
    }
