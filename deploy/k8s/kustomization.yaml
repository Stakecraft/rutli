#
# Applies the cosigner cluster. Create the two Secrets out-of-band first (see secrets.example.yaml);
# they are intentionally NOT listed here so real key material is never kustomize-managed from the repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rutli
resources:
  - namespace.yaml
  - cosigner-config.yaml
  - service.yaml
  - statefulset.yaml
  - networkpolicy.yaml
  - pdb.yaml
  # Day-2 CronJobs are examples — review KEY_ID / PVC claimName before enabling:
  # - cronjob-backup.yaml
  # - cronjob-refresh.yaml
images:
  - name: ghcr.io/stakecraft/rutli-cosigner
    newTag: "0.3.0"
    digest: sha256:bf35937ada817ec7f898b3d793a4fc3b0fa87536092ee09637988d7f287815bd
