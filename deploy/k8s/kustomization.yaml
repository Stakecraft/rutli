#
# Applies the cosigner cluster. Create the Secrets out-of-band first (see secrets.example.yaml);
# they are intentionally NOT listed here so real key material is never kustomize-managed from the repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rutli
resources:
  - namespace.yaml
  # GENERATED from the Helm chart (scripts/render-k8s.sh, values.yaml): per-node StatefulSets,
  # Services, PVCs, backup sidecars, the config, NetworkPolicy and PDB.
  - cosigner.yaml
  - client-config.yaml
  # Opt-in: cronjob-refresh.yaml needs KEY_ID and the refresher's cert (rutli-refresher-tls), and
  # every cosigner on 0.4.0-rc.2+; see its header. There is no backup CronJob: each pod's backup
  # sidecar does it.
  # - cronjob-refresh.yaml
images:
  - name: ghcr.io/stakecraft/rutli-cosigner
    newTag: "0.4.0-rc.5"
    digest: sha256:94b52f8254a19d26cae315f46f9fcb5da7140585af9f05b80a40e31ab535ed4e
