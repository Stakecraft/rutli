#
# Applies the cosigner cluster. Create the Secrets out-of-band first (see secrets.example.yaml);
# they are intentionally NOT listed here so real key material is never kustomize-managed from the repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rutli
resources:
  - namespace.yaml
  # GENERATED from the Helm chart (scripts/render-k8s.sh, values.yaml): per-node StatefulSets,
  # Services, PVCs, backup sidecars, the config, NetworkPolicy and PDB.
  - cosigner.yaml
  - client-config.yaml
  # Opt-in: cronjob-refresh.yaml needs KEY_ID — and must NOT run until the ceremony fixes (audit
  # C1/H1) ship; see its header. There is no backup CronJob: each pod's backup sidecar does it.
  # - cronjob-refresh.yaml
images:
  - name: ghcr.io/stakecraft/rutli-cosigner
    newTag: "0.4.0-rc.2"
    digest: sha256:dfb5c859ccb508a283ea7f029077d79608f171a08335c4eb58960c9a71b8c2b4
