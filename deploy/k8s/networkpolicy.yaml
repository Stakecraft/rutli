# Lock the cosigner signing port down to the mesh + the Canton driver. Requires a NetworkPolicy-
# enforcing CNI (Calico, Cilium, …). Label BOTH the Canton namespace (`rutli.io/client-ns: "true"`)
# and the participant pod (`rutli.io/client: "true"`) — a pod label alone in an arbitrary namespace
# is not enough.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosigner-ingress
  namespace: rutli
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rutli-cosigner
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # peer-to-peer mesh (other cosigners)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rutli-cosigner
        # the Canton driver: namespace + pod must both be labelled
        - namespaceSelector:
            matchLabels:
              rutli.io/client-ns: "true"
          podSelector:
            matchLabels:
              rutli.io/client: "true"
      ports:
        - { protocol: TCP, port: 9101 }
    - from:
        # Prometheus (any namespace): label the scraper pod `rutli.io/scraper: "true"`, mirroring
        # the driver's rutli.io/client label. Metrics are plaintext counts/latencies only.
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              rutli.io/scraper: "true"
      ports:
        - { protocol: TCP, port: 9200 }
---
# DNS + peer egress for the cosigners themselves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosigner-egress
  namespace: rutli
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rutli-cosigner
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rutli-cosigner
      ports:
        - { protocol: TCP, port: 9101 }
    - to: [] # DNS
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
