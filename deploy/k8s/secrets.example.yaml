#
# ⚠️ EXAMPLE ONLY — do NOT commit real secrets. Create the Secrets from real material instead of
# applying this file, e.g.:
#
#   # 1) mTLS material: the CA, then ONE Secret PER COSIGNER (kubernetes.io/tls: tls.crt/tls.key).
#   #    Generate with:  scripts/gen-frost-certs.sh 3 ./certs   (CN/SAN cosigner<id>, no shared name)
#   kubectl -n rutli create secret generic rutli-cosigner-ca --from-file=ca.crt=certs/ca.crt
#   for i in 1 2 3; do
#     kubectl -n rutli create secret tls rutli-cosigner-tls-$i \
#       --cert=certs/cosigner$i.crt --key=certs/cosigner$i.key
#   done
#   # Each node's pod spec references only its own; see README.md, "Secrets: what each pod sees".
#
#   # 1b) Only if you run cronjob-refresh.yaml: the driver's client cert, and nothing else.
#   kubectl -n rutli create secret tls rutli-driver-tls --cert=certs/driver.crt --key=certs/driver.key
#   #     The operator cert (verify-key) is NOT a standing Secret: see job-verify-key.example.yaml.
#
#   # 2) One seal bundle PER NODE (its share DEK + hosted-key distribution seed, nothing else),
#   #    made on a workstation and never kept together with another node's:
#   for i in 1 2 3; do
#     rutli-cosigner seal new-node --node $i --out node-$i.json
#     kubectl -n rutli create secret generic rutli-seal-node-$i --from-file=node.json=node-$i.json
#     shred -u node-$i.json
#   done
#   #    There is no shared seal master any more (the deprecated `rutli-seal` / RUTLI_SEAL_SECRET
#   #    gave every pod every node's DEK root — audit C3).
#
# The placeholders below only document the expected shape.
apiVersion: v1
kind: Secret
metadata:
  name: rutli-cosigner-ca
  namespace: rutli
type: Opaque
stringData:
  ca.crt: "<PEM cluster CA cert>"
---
apiVersion: v1
kind: Secret
metadata:
  name: rutli-cosigner-tls-1 # …-2, …-3: one per cosigner identifier
  namespace: rutli
type: kubernetes.io/tls
stringData:
  tls.crt: "<PEM cosigner1 cert>"
  tls.key: "<PEM PKCS#8 cosigner1 key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: rutli-seal-node-1 # …-2, …-3: one per node, each from that node's bundle only
  namespace: rutli
type: Opaque
stringData:
  # Output of `rutli-cosigner seal new-node --node 1` (or `seal split-legacy`). Keep it in a
  # different trust domain from node 1's backups.
  node.json: '{"v":1,"kind":"rutli-node-seal","node":1,"share_dek":"<64 hex>","dist_seed":"<64 hex>"}'
