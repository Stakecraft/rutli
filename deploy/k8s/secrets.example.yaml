#
# ⚠️ EXAMPLE ONLY — do NOT commit real secrets. Create the two Secrets from real material instead of
# applying this file, e.g.:
#
#   # 1) mTLS material (one CA + a cert/key per cosigner). Generate with:
#   #      scripts/gen-frost-certs.sh 3 ./certs      (adds the shared `rutli-cosigner` SAN)
#   kubectl -n rutli create secret generic rutli-cosigner-tls \
#     --from-file=ca.crt=certs/ca.crt \
#     --from-file=cosigner1.crt=certs/cosigner1.crt --from-file=cosigner1.key=certs/cosigner1.key \
#     --from-file=cosigner2.crt=certs/cosigner2.crt --from-file=cosigner2.key=certs/cosigner2.key \
#     --from-file=cosigner3.crt=certs/cosigner3.crt --from-file=cosigner3.key=certs/cosigner3.key
#
#   # 2) The share-sealing master secret (shared across nodes; each derives its own per-node key).
#   #    In production source this from your secret manager / KMS, not a literal.
#   kubectl -n rutli create secret generic rutli-seal \
#     --from-literal=RUTLI_SEAL_SECRET="$(openssl rand -hex 32)"
#
# The placeholders below only document the expected shape.
apiVersion: v1
kind: Secret
metadata:
  name: rutli-cosigner-tls
  namespace: rutli
type: Opaque
stringData:
  ca.crt: "<PEM cluster CA cert>"
  cosigner1.crt: "<PEM>"
  cosigner1.key: "<PEM PKCS#8>"
  cosigner2.crt: "<PEM>"
  cosigner2.key: "<PEM PKCS#8>"
  cosigner3.crt: "<PEM>"
  cosigner3.key: "<PEM PKCS#8>"
---
apiVersion: v1
kind: Secret
metadata:
  name: rutli-seal
  namespace: rutli
type: Opaque
stringData:
  # >= 32 bytes of entropy; keep in a different trust domain from the share backups.
  RUTLI_SEAL_SECRET: "<openssl rand -hex 32>"
