---
# LAB ONLY (preflight.yml refuses these two variables under the production profile).
- name: Lab - copy the seal bundle from the control machine
  ansible.builtin.copy:
    src: "{{ rutli_cosigner_lab_seal_bundle_src }}"
    dest: /etc/rutli-cosigner/secrets/seal.json
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when:
    - rutli_cosigner_profile == 'lab'
    - rutli_cosigner_lab_seal_bundle_src | length > 0

- name: Lab - copy the TLS key from the control machine
  ansible.builtin.copy:
    src: "{{ rutli_cosigner_lab_tls_key_src }}"
    dest: /etc/rutli-cosigner/secrets/tls.key
    owner: root
    group: root
    mode: "0400"
  no_log: true
  when:
    - rutli_cosigner_profile == 'lab'
    - rutli_cosigner_lab_tls_key_src | length > 0

# Every profile: the two files must be there, regular files, root:root 0400. Only their metadata is
# read.
- name: Look at the two secret files
  ansible.builtin.stat:
    path: "/etc/rutli-cosigner/secrets/{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - seal.json
    - tls.key
  register: rutli_cosigner__secrets

- name: The seal bundle and the TLS key are in place, root:root 0400
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == '0400'
    fail_msg: >-
      /etc/rutli-cosigner/secrets/{{ item.item }} must exist as a regular file, root:root, mode
      0400. This role does not create it: put it there yourself (docs/bare-metal.md, "Production",
      or the lab variables under the lab profile).
    quiet: true
  loop: "{{ rutli_cosigner__secrets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not ansible_check_mode
