#
# Production-flavored 2-of-3 FROST cosigner cluster: mutual TLS + share sealing.
# Still single-host (containers stand in for separate hosts/accounts/regions).
#
# Prerequisites:
#   1. Certs:   scripts/gen-frost-certs.sh 3 deploy/frost/certs
#   2. Seal:    export RUTLI_SEAL_SECRET="$(openssl rand -hex 32)"
#   3. Bring up (pulls the pinned default image):
#        RUTLI_SEAL_SECRET=… docker compose -f deploy/frost/docker-compose.tls.yml up -d
#      Or build from source: add --build
#
# Override image: RUTLI_COSIGNER_IMAGE=ghcr.io/stakecraft/rutli-cosigner:latest

x-cosigner: &cosigner
  image: ${RUTLI_COSIGNER_IMAGE:-ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.6@sha256:8304e662d495eb1a8330cb5b04ba86b725ff1bf414fa217283add66b2df45ae3}
  build:
    context: ../../frost
    dockerfile: Dockerfile
  pull_policy: ${RUTLI_PULL_POLICY:-always}
  restart: unless-stopped
  environment:
    RUTLI_SEAL_SECRET: ${RUTLI_SEAL_SECRET:?set RUTLI_SEAL_SECRET (e.g. openssl rand -hex 32)}
    RUST_LOG: info
  volumes:
    - ./config-tls:/config:ro
    - ./certs:/certs:ro

# `rutli-cosigner health`: key store readable + writable AND the gRPC port open. A bare TCP check
# stayed green through the 2026-10-07 incident, when a node's /data/keys went unreadable and it
# failed every Sign. `health` exits 0 (healthy) or 1; it exists since 0.3.1, so the image must be
# ≥ 0.3.1.
x-healthcheck: &hc
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  cosigner1:
    <<: *cosigner
    command: ["--config", "/config/cosigner1.json"]
    volumes:
      - ./config-tls:/config:ro
      - ./certs:/certs:ro
      - c1:/data
    ports: ["9101:9101", "9201:9200"]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "rutli-cosigner --config /config/cosigner1.json health"]

  cosigner2:
    <<: *cosigner
    command: ["--config", "/config/cosigner2.json"]
    volumes:
      - ./config-tls:/config:ro
      - ./certs:/certs:ro
      - c2:/data
    ports: ["9102:9102", "9202:9200"]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "rutli-cosigner --config /config/cosigner2.json health"]

  cosigner3:
    <<: *cosigner
    command: ["--config", "/config/cosigner3.json"]
    volumes:
      - ./config-tls:/config:ro
      - ./certs:/certs:ro
      - c3:/data
    ports: ["9103:9103", "9203:9200"]
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "rutli-cosigner --config /config/cosigner3.json health"]

volumes:
  c1:
  c2:
  c3:
