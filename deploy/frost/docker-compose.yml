#
# Local 2-of-3 FROST cosigner cluster (dev: plaintext gRPC, unsealed shares).
#
#   # pull published image (default):
#   docker compose -f deploy/frost/docker-compose.yml up -d
#
#   # or build from source:
#   docker compose -f deploy/frost/docker-compose.yml up -d --build
#
# ⚠️ Dev topology only. Production: docker-compose.tls.yml (+ mTLS + sealing).

x-cosigner: &cosigner
  image: ${RUTLI_COSIGNER_IMAGE:-ghcr.io/stakecraft/rutli-cosigner:0.4.0-rc.6@sha256:8304e662d495eb1a8330cb5b04ba86b725ff1bf414fa217283add66b2df45ae3}
  build:
    context: ../../frost
    dockerfile: Dockerfile
  pull_policy: ${RUTLI_PULL_POLICY:-always}
  restart: unless-stopped

services:
  cosigner1:
    <<: *cosigner
    command: ["--config", "/config/cosigner1.json"]
    volumes:
      - ./config:/config:ro
      - c1:/data
    ports:
      - "9101:9101"

  cosigner2:
    <<: *cosigner
    command: ["--config", "/config/cosigner2.json"]
    volumes:
      - ./config:/config:ro
      - c2:/data
    ports:
      - "9102:9102"

  cosigner3:
    <<: *cosigner
    command: ["--config", "/config/cosigner3.json"]
    volumes:
      - ./config:/config:ro
      - c3:/data
    ports:
      - "9103:9103"

volumes:
  c1:
  c2:
  c3:
