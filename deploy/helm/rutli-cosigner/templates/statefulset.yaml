{{- if eq (include "rutli-cosigner.topology" .) "legacy" }}
# Copyright 2026 StakeCraft
# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rutli-cosigner.fullname" . }}
  labels:
    {{- include "rutli-cosigner.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rutli-cosigner.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "rutli-cosigner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rutli-cosigner.selectorLabels" . | nindent 8 }}
      {{- if and .Values.metrics.enabled .Values.metrics.annotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or (ne .Values.podAntiAffinity "none") .Values.affinity }}
      affinity:
        {{- if eq .Values.podAntiAffinity "required" }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "rutli-cosigner.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
        {{- else if eq .Values.podAntiAffinity "preferred" }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "rutli-cosigner.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- end }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "rutli-cosigner.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Only this node's TLS material reaches the cosigner container: copy ca.crt and
      # cosigner<id>.{crt,key} (id = ordinal + 1) from the source Secret(s) into the in-memory
      # `certs` volume. The source volume is mounted here and nowhere else, so the long-running,
      # network-facing process never has another node's key on its filesystem.
      initContainers:
        - name: tls-select
          image: {{ include "rutli-cosigner.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              id=$(( ${HOSTNAME##*-} + 1 ))
              umask 077
              cat /tls-src/ca.crt > /certs/ca.crt
              cat "/tls-src/cosigner${id}.crt" > "/certs/cosigner${id}.crt"
              cat "/tls-src/cosigner${id}.key" > "/certs/cosigner${id}.key"
              chmod 0444 /certs/ca.crt "/certs/cosigner${id}.crt"
              chmod 0400 "/certs/cosigner${id}.key"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tls-src, mountPath: /tls-src, readOnly: true }
            - { name: certs, mountPath: /certs }
      containers:
        - name: cosigner
          image: {{ include "rutli-cosigner.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - 'exec rutli-cosigner --config /config/cosigner-$(( ${HOSTNAME##*-} + 1 )).json'
          env:
            - name: RUST_LOG
              value: info
            - name: RUTLI_SEAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sealSecretName }}
                  key: {{ .Values.sealSecretKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
            {{- end }}
          # Readiness = "this node can actually sign": its key store under /data/keys can be listed,
          # opened and written, and the gRPC port accepts connections (`rutli-cosigner health`). An
          # exec, not a `grpc:` probe — the port is mTLS and kubelet's gRPC probe is plaintext-only.
          # A node whose volume goes unreadable (2026-10-07 incident) now shows READY 0/1, holds a
          # rollout and counts against the PDB. It is NOT removed from the driver's endpoints: the
          # headless Service publishes not-ready addresses (the mesh needs them during DKG), so
          # routing around a sick node is the driver's failover plus the node refusing to lead or
          # join quorums.
          # `health` exits 0 (ready) or 1 (not ready); it exists since 0.3.1, so the image pin
          # must be ≥ 0.3.1.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'exec rutli-cosigner --config /config/cosigner-$(( ${HOSTNAME##*-} + 1 )).json health'
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness stays a bare TCP check on purpose: restarting the pod does not fix a broken
          # volume, and it would destroy the evidence (logs, the mount as it is) mid-incident.
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "rutli-cosigner.fullname" . }}-config
        # This node's TLS material only (filled by tls-select); in memory, never on the node's disk.
        - name: certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Every node's TLS material — mounted into tls-select only.
        - name: tls-src
          {{- if eq .Values.tls.layout "perNode" }}
          projected:
            # 0440 (not 0400): with fsGroup the non-root user reads the keys via group perms.
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.tls.caSecretName }}
                  items: [{ key: ca.crt, path: ca.crt }]
              {{- range $i := until (int .Values.replicaCount) }}
              {{- $id := add $i 1 }}
              - secret:
                  name: {{ $.Values.tls.perNodeSecretPrefix }}{{ $id }}
                  items:
                    - { key: tls.crt, path: cosigner{{ $id }}.crt }
                    - { key: tls.key, path: cosigner{{ $id }}.key }
              {{- end }}
          {{- else if eq .Values.tls.layout "shared" }}
          secret:
            secretName: {{ .Values.tlsSecretName }}
            defaultMode: 0440
          {{- else }}
          {{- fail "tls.layout must be perNode or shared" }}
          {{- end }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ .Values.persistence.accessModes | toJson }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
