{{/*
Copyright 2026 StakeCraft
SPDX-License-Identifier: Apache-2.0
Per-node cosigner JSON: node <id> runs cosigner-<id>.json. No secrets in here — only where they are.
topology=legacy:  pod ordinal i runs cosigner-(i+1).json; peers are the headless pod DNS names
                  https://<fullname>-(k-1).<fullname>:grpcPort; sealing from the shared env master.
topology=perNode: peers are the per-node Services https://<servicePrefix><k>.<ns>.svc:grpcPort,
                  each verified under its own TLS name (cosigner<k>, the cosigner default); sealing
                  from the node's own bundle file; hosted keys use pinned distribution keys.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rutli-cosigner.fullname" . }}-config
  labels:
    {{- include "rutli-cosigner.labels" . | nindent 4 }}
data:
{{- $fullname := include "rutli-cosigner.fullname" . }}
{{- $n := int .Values.replicaCount }}
{{- $t := int .Values.threshold }}
{{- $port := int .Values.service.grpcPort }}
{{- $metricsPort := int .Values.service.metricsPort }}
{{- $domain := .Values.tlsDomain }}
{{- $allow := .Values.signerAllowlist }}
{{/* Peer (mesh) API allowlist: the cosigner cert CNs. Defaults to cosigner1..N, matching
     scripts/gen-frost-certs.sh. Without it any cluster-CA cert — including the driver's — could
     drive the raw FROST rounds directly and forge a signature over an arbitrary message. */}}
{{- $peerAllow := .Values.peerAllowlist }}
{{- if not $peerAllow }}
  {{- $peerAllow = list }}
  {{- range $k := until $n }}{{ $peerAllow = append $peerAllow (printf "cosigner%d" (add $k 1)) }}{{ end }}
{{- end }}
{{/* Cluster-hosted keys (replicated whole RSA/AES keys, not threshold shares — docs/hosted-keys.md).
     The cosigner refuses to start on an unreachable write quorum; fail at template time instead so
     the operator sees it here rather than as a CrashLoopBackOff. Sealing is always configured
     below, which is the other precondition. */}}
{{- /* Cluster id pin (docs/ca-rotation.md): must have the derived shape, or nodes would bind envelopes
     to different ids. A bare all-digit value would reach here as a number (YAML), not a string. */}}
{{- $clusterId := .Values.clusterId | default "" }}
{{- if $clusterId }}
  {{- if not (kindIs "string" $clusterId) }}
    {{- fail (printf "clusterId must be a string — quote it, or use --set-string clusterId=<id> (got %v)" $clusterId) }}
  {{- end }}
  {{- if not (regexMatch "^[0-9a-f]{16}$" $clusterId) }}
    {{- fail (printf "clusterId %q must be exactly 16 lowercase hex characters — the id derived from the current CA: shasum -a 256 ca.crt | cut -c1-16" $clusterId) }}
  {{- end }}
{{- end }}
{{- $hosted := .Values.hostedKeys }}
{{- if $hosted.enabled }}
  {{- $q := int $hosted.writeQuorum }}
  {{- if or (lt $q 1) (gt $q $n) }}
    {{- fail (printf "hostedKeys.writeQuorum %d out of range 1..%d (replicaCount)" $q $n) }}
  {{- end }}
{{- end }}
{{- if eq (include "rutli-cosigner.topology" .) "perNode" }}
{{- $nodes := include "rutli-cosigner.nodes" . | fromJsonArray }}
{{- if not .Values.peerAllowlist }}
  {{- $peerAllow = list }}
  {{- range $node := $nodes }}{{ $peerAllow = append $peerAllow (printf "cosigner%d" (int $node.id)) }}{{ end }}
{{- end }}
{{- if $hosted.enabled }}
  {{- if not (regexMatch "^[0-9a-fA-F]{64}$" (toString $hosted.commitmentKey)) }}
    {{- fail "topology=perNode with hostedKeys.enabled needs hostedKeys.commitmentKey (64 hex): the value `rutli-cosigner seal split-legacy` prints, or `openssl rand -hex 32` for a new cluster" }}
  {{- end }}
  {{- range $node := $nodes }}
    {{- if not (regexMatch "^[0-9a-fA-F]{64}$" $node.distPublicKey) }}
      {{- fail (printf "topology=perNode with hostedKeys.enabled needs nodes[id=%d].distPublicKey (64 hex) — printed by `rutli-cosigner seal split-legacy` / `seal inspect`" (int $node.id)) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $node := $nodes }}
{{- $id := int $node.id }}
  cosigner-{{ $id }}.json: |
    {
      "identifier": {{ $id }},
      {{- if $clusterId }}
      "cluster_id": {{ $clusterId | quote }},
      {{- end }}
      {{- if $.Values.clusterIdChangeAllowed }}
      "cluster_id_change_allowed": true,
      {{- end }}
      "listen": "0.0.0.0:{{ $port }}",
      {{- if $.Values.metrics.enabled }}
      "metrics_listen": "0.0.0.0:{{ $metricsPort }}",
      {{- end }}
      "threshold": {{ $t }},
      "data_dir": "/data",
      "peers": [
        {{- range $k, $peer := $nodes }}
        { "identifier": {{ int $peer.id }}, "endpoint": "https://{{ $peer.service }}.{{ $.Release.Namespace }}.svc:{{ $port }}"{{ if $hosted.enabled }}, "dist_public_key": {{ $peer.distPublicKey | lower | quote }}{{ end }} }{{ if lt (add $k 1) (len $nodes) }},{{ end }}
        {{- end }}
      ],
      "tls": {
        "ca_cert": "/certs/ca.crt",
        "cert": "/certs/cosigner{{ $id }}.crt",
        {{- if $.Values.tls.allowExpiredCa }}
        "allow_expired_ca": true,
        {{- end }}
        "key": "/certs/cosigner{{ $id }}.key"
      },
      "share_seal": { "secret_file": "/run/rutli/seal/{{ $.Values.seal.secretKey }}" },
      {{- if $hosted.enabled }}
      "hosted_keys": { "enabled": true, "write_quorum": {{ int $hosted.writeQuorum }}, "anti_entropy_interval_secs": {{ int $hosted.antiEntropyIntervalSecs }}, "decrypt_rate_limit_per_min": {{ int (default 6000 $hosted.decryptRateLimitPerMin) }}, "commitment_key": {{ $hosted.commitmentKey | lower | quote }}{{ if $hosted.deleteAllowlist }}, "delete_allowlist": {{ $hosted.deleteAllowlist | toJson }}{{ end }}{{ if $hosted.deleteAcl }}, "delete_acl": {{ $hosted.deleteAcl | toJson }}{{ end }}{{ if $hosted.deleteApprovalThreshold }}, "delete_approval_threshold": {{ int $hosted.deleteApprovalThreshold }}{{ end }}, "delete_grace_secs": {{ int (default 604800 $hosted.deleteGraceSecs) }} },
      {{- end }}
      "signer_allowlist": {{ $allow | toJson }},
      {{- if $.Values.operatorAllowlist }}
      "operator_allowlist": {{ $.Values.operatorAllowlist | toJson }},
      {{- end }}
      {{- if $.Values.refreshAllowlist }}
      "refresh_allowlist": {{ $.Values.refreshAllowlist | toJson }},
      {{- end }}
      {{- if $.Values.signingPolicy }}
      "signing_policy": {{ $.Values.signingPolicy | toJson }},
      {{- end }}
      {{- if $.Values.keyfile }}
      "keyfile": {{ $.Values.keyfile | toJson }},
      {{- end }}
      "peer_allowlist": {{ $peerAllow | toJson }}
    }
{{- end }}
{{- else }}
{{- range $i := until $n }}
{{- $id := add $i 1 }}
  cosigner-{{ $id }}.json: |
    {
      "identifier": {{ $id }},
      {{- if $clusterId }}
      "cluster_id": {{ $clusterId | quote }},
      {{- end }}
      {{- if $.Values.clusterIdChangeAllowed }}
      "cluster_id_change_allowed": true,
      {{- end }}
      "listen": "0.0.0.0:{{ $port }}",
      {{- if $.Values.metrics.enabled }}
      "metrics_listen": "0.0.0.0:{{ $metricsPort }}",
      {{- end }}
      "threshold": {{ $t }},
      "data_dir": "/data",
      "peers": [
        {{- range $j := until $n }}
        {{- $jid := add $j 1 }}
        { "identifier": {{ $jid }}, "endpoint": "https://{{ $fullname }}-{{ $j }}.{{ $fullname }}:{{ $port }}" }{{ if lt (add $j 1) $n }},{{ end }}
        {{- end }}
      ],
      "tls": {
        "ca_cert": "/certs/ca.crt",
        "cert": "/certs/cosigner{{ $id }}.crt",
        "key": "/certs/cosigner{{ $id }}.key",
        {{- if $.Values.tls.allowExpiredCa }}
        "allow_expired_ca": true,
        {{- end }}
        "domain": {{ $domain | quote }}
      },
      "share_seal": { "secret_env": "RUTLI_SEAL_SECRET" },
      {{- if $hosted.enabled }}
      "hosted_keys": { "enabled": true, "write_quorum": {{ int $hosted.writeQuorum }}, "anti_entropy_interval_secs": {{ int $hosted.antiEntropyIntervalSecs }}, "decrypt_rate_limit_per_min": {{ int (default 6000 $hosted.decryptRateLimitPerMin) }}{{ if $hosted.deleteAllowlist }}, "delete_allowlist": {{ $hosted.deleteAllowlist | toJson }}{{ end }}{{ if $hosted.deleteAcl }}, "delete_acl": {{ $hosted.deleteAcl | toJson }}{{ end }}{{ if $hosted.deleteApprovalThreshold }}, "delete_approval_threshold": {{ int $hosted.deleteApprovalThreshold }}{{ end }}, "delete_grace_secs": {{ int (default 604800 $hosted.deleteGraceSecs) }} },
      {{- end }}
      "signer_allowlist": {{ $allow | toJson }},
      {{- if $.Values.operatorAllowlist }}
      "operator_allowlist": {{ $.Values.operatorAllowlist | toJson }},
      {{- end }}
      {{- if $.Values.refreshAllowlist }}
      "refresh_allowlist": {{ $.Values.refreshAllowlist | toJson }},
      {{- end }}
      {{- if $.Values.signingPolicy }}
      "signing_policy": {{ $.Values.signingPolicy | toJson }},
      {{- end }}
      {{- if $.Values.keyfile }}
      "keyfile": {{ $.Values.keyfile | toJson }},
      {{- end }}
      "peer_allowlist": {{ $peerAllow | toJson }}
    }
{{- end }}
{{- end }}
