#
# Default values for rutli-cosigner. Secrets (TLS + seal) are NOT created by this chart —
# create them out-of-band (see README / secrets.example.yaml in deploy/k8s/).

replicaCount: 3
threshold: 2

image:
  repository: ghcr.io/stakecraft/rutli-cosigner
  # Multi-arch index digest for v0.3.1 (amd64 + arm64). Retag/retarget carefully.
  tag: "0.3.1@sha256:21fd2730fc47e57e59ec320063517c0cecc2784afa4e0fae3827b14a979f97a7"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
# Stable headless service / StatefulSet name → peer DNS: rutli-cosigner-N.rutli-cosigner
fullnameOverride: rutli-cosigner

service:
  grpcPort: 9101
  metricsPort: 9200

# Existing Secret with CA + per-cosigner cert/key (and optionally driver cert for operators).
# Keys expected: ca.crt, cosigner1.crt, cosigner1.key, … cosignerN.crt/key
tlsSecretName: rutli-cosigner-tls

# Existing Secret with key RUTLI_SEAL_SECRET (≥ 32 chars; e.g. openssl rand -hex 32)
sealSecretName: rutli-seal
sealSecretKey: RUTLI_SEAL_SECRET

# Client cert CNs allowed to call Signer (DKG / Sign / Refresh). Required when TLS is on.
signerAllowlist:
  - driver

# Cert CNs allowed on the mesh Peer API — the cosigners themselves. Required when TLS is on.
# Empty = derived as cosigner1..cosigner<replicaCount> (what scripts/gen-frost-certs.sh issues).
# The driver's CN must NOT appear here: the Peer API is the raw FROST protocol, so anything that
# can call it on `threshold` nodes can aggregate a signature over an arbitrary message.
peerAllowlist: []

# mTLS domain / shared SAN on cosigner certs
tlsDomain: rutli-cosigner

# Cluster-hosted (non-FROST) keys: the RSA-2048-OAEP encryption keypair and the AES-256-GCM
# symmetric key Canton needs, held by the cluster so the participant needs no HSM and no local key
# state. Off by default — turning it on is a custody decision, not a tuning knob.
#
# These are REPLICATED WHOLE KEYS, not threshold shares: generated on one cosigner, copied to the
# others (wrapped per recipient), sealed at rest on each, and any node can serve a decrypt. One
# compromised cosigner yields those keys, and because they protect Canton's per-view session keys,
# an attacker who extracts one can read *previously recorded* traffic encrypted to it — rotation
# fixes the future, not the past. The Ed25519 namespace key is unaffected: it stays true 2-of-3
# threshold and is never replicated. The win is relocation — key material moves off the busy,
# internet-adjacent participant host onto three hardened single-purpose nodes.
# See docs/hosted-keys.md before enabling.
hostedKeys:
  enabled: false
  # How many cosigners must hold a new key before it counts as created. 2 matches the cluster's own
  # fault model; requiring all `replicaCount` would block key rotation whenever any node is down,
  # which is worse than the single copy an HSM gives. Must be 1..=replicaCount. Below quorum the
  # write rolls back rather than leaving one lonely copy.
  writeQuorum: 2
  # Anti-entropy sweep: pull keys this node lacks, push keys a peer lacks. This is what heals an
  # under-quorum write or a node restored from a stale backup, so a writeQuorum below replicaCount
  # is only safe with it running. Floor of 10s is enforced by the cosigner.
  antiEntropyIntervalSecs: 300
  # Ceiling on decryptions per key per minute, enforced by the cosigner (0 disables). This is the
  # bound on a stolen driver certificate, which can otherwise bulk-decrypt recorded traffic at line
  # rate. The default is ~100/s sustained on one key — far above real Canton traffic.
  decryptRateLimitPerMin: 6000

persistence:
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  # Canton participant namespace must carry this label; pod must carry clientLabel.
  clientNamespaceLabel: rutli.io/client-ns
  clientPodLabel: rutli.io/client
  scraperPodLabel: rutli.io/scraper

podAntiAffinity: required # required | preferred | none

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

metrics:
  enabled: true
  annotations: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

# Extra env vars for every cosigner
extraEnv: []

# Nightly sealed-share backups, taken INSIDE each running cosigner with `kubectl exec` (one exec
# per ordinal), streamed out as one tar per cosigner, then handed to `backup.ship` for off-cluster
# storage. This is the only supported way to back a cosigner up on Kubernetes:
#
#   NEVER MOUNT A COSIGNER'S DATA VOLUME INTO ANOTHER POD. On 2026-10-07 a backup Job that bound a
#   cosigner's ReadWriteOnce PVC left /data/keys unreadable to the live cosigner, which kept passing
#   its health check and failed every Sign — a total signing outage on the DevNet soak
#   (docs/soak-2026-10-devnet.md, incident #1). The chart refuses a backup.extraVolumes entry that
#   names a cosigner's claim.
#
# Off by default. Turning it on also needs a destination: the default `ship` body exits 1, so an
# unconfigured destination shows up as a failed Job, not as a silent gap. Each run also leaves a
# seven-day rotation on the node's own volume (/data/backup-<weekday>), which is what the
# "wipe keys/, restore" drill uses.
backup:
  enabled: false
  schedule: "17 3 * * *" # daily 03:17 UTC — keep refresh drills away from this minute
  image:
    # kubectl + bash + coreutils. Pinned by digest; bump deliberately.
    repository: alpine/k8s
    tag: "1.31.13@sha256:7a319b15cfc99c9aaa27ec9891d6b4ca24632b795908591c7b0ba89b03549e0a"
    pullPolicy: IfNotPresent
  # POSIX sh body, run once per backup with $1 = a directory holding one tar per cosigner
  # (<fullname>-0.tar … <fullname>-N.tar), each containing that node's backup-<weekday>/ directory
  # of sealed share + hosted-key files. Keep the tars in a different trust domain from the seal
  # secret, ideally one destination per cosigner (docs/disaster-recovery.md §4). For example:
  #   cp -r "$1" /backups/                                        # a volume of the Job's OWN, via extraVolumes
  #   rclone copy "$1" "remote:rutli-backups/$(basename "$1")"    # object storage; image + creds via extraEnv
  ship: |
    echo "ship.sh: no backup destination configured — set backup.ship" >&2
    echo "ship.sh: this run's backups exist only on each cosigner's own volume (/data/backup-<weekday>)" >&2
    exit 1
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  activeDeadlineSeconds: 900 # a hung exec must not block the next night's run
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Credentials for `ship` (e.g. object-storage keys via secretKeyRef).
  extraEnv: []
  # Volumes the backup Job OWNS (e.g. its own destination PVC mounted at /backups). A cosigner's
  # claim (data-<fullname>-N) is rejected at template time.
  extraVolumes: []
  extraVolumeMounts: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
