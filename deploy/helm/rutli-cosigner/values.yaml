#
# Default values for rutli-cosigner. Secrets (TLS + seal) are NOT created by this chart —
# create them out-of-band (see README / secrets.example.yaml in deploy/k8s/).

# How the cosigners are laid out.
#
# perNode (default for new installs): one StatefulSet (replicas 1) and one Service per node. Each
#   pod spec references ONLY its own seal-bundle Secret and TLS Secret, mounted as files, so the
#   kubelet's node authorizer lets a host read only the secrets of the node it runs — compromising
#   one host or one pod spec yields one node's keys, below threshold (audit C3). Sealing uses a
#   per-node seal bundle (`rutli-cosigner seal split-legacy` / `seal new-node`); there is no seal
#   env var. Peers and the driver dial the per-node Services under per-node TLS names (cosigner<id>).
# legacy: the ≤ 0.4.0-rc.1 layout — one StatefulSet whose single pod template references every
#   node's TLS Secret and injects the shared master RUTLI_SEAL_SECRET as an env var into every pod.
#   Kept only so an existing install upgrades without moving (deploy/soak/cosigner-values.yaml pins
#   it) until it runs docs/runbook-per-node-seal.md. It fails scripts/check-deploy-policy.sh.
topology: perNode

replicaCount: 3
threshold: 2

# topology=perNode: the roster. Empty = nodes 1..replicaCount with every default below. Per entry:
#   id:             node identifier (1..n), its config is cosigner-<id>.json
#   existingClaim:  reuse this PVC as the node's data volume (the soak: data-rutli-cosigner-<id-1>,
#                   the legacy StatefulSet's claims). Omit to let the chart create
#                   data-<fullname>-n<id> (kept on uninstall: helm.sh/resource-policy keep).
#   sealSecret:     Secret holding this node's seal bundle under key seal.secretKey
#                   (default <seal.perNodeSecretPrefix><id>)
#   tlsSecret:      kubernetes.io/tls Secret of this node (default <tls.perNodeSecretPrefix><id>)
#   distPublicKey:  this node's hosted-key distribution public key (64 hex; required with
#                   hostedKeys.enabled — printed by `seal split-legacy` / `seal inspect`)
#   backupClaim:    backup.destination.type=pvc: use this PVC instead of the chart-made
#                   <fullname>-backup-n<id>
#   backupSecret:   backup.destination.type=script: credentials Secret for THIS node's destination,
#                   mounted into its backup sidecar only, at /backup-creds
# e.g.
#   nodes:
#     - { id: 1, existingClaim: data-rutli-cosigner-0, distPublicKey: "…" }
#     - { id: 2, existingClaim: data-rutli-cosigner-1, distPublicKey: "…" }
#     - { id: 3, existingClaim: data-rutli-cosigner-2, distPublicKey: "…" }
nodes: []

# topology=perNode: the Service in front of each node is <perNode.servicePrefix><id> (ClusterIP,
# publishes not-ready addresses). Peer endpoints and the driver's frost.endpoints use it:
#   https://<perNode.servicePrefix><id>.<namespace>.svc:<grpcPort>  with tls-name cosigner<id>
perNode:
  servicePrefix: rutli-node-

# topology=perNode: per-node seal bundles (share_seal.secret_file). Create one Secret per node from
# its bundle file and nothing else:
#   kubectl -n rutli create secret generic rutli-seal-node-1 --from-file=node.json=node-1.json
seal:
  perNodeSecretPrefix: rutli-seal-node-
  secretKey: node.json

image:
  repository: ghcr.io/stakecraft/rutli-cosigner
  # Multi-arch index digest for v0.4.0-rc.2 (amd64 + arm64). Retag/retarget carefully.
  tag: "0.4.0-rc.2@sha256:dfb5c859ccb508a283ea7f029077d79608f171a08335c4eb58960c9a71b8c2b4"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
# Stable headless service / StatefulSet name → peer DNS: rutli-cosigner-N.rutli-cosigner
fullnameOverride: rutli-cosigner

service:
  grpcPort: 9101
  metricsPort: 9200

# mTLS material. Whatever the layout, the cosigner CONTAINER of pod <fullname>-<o> (identifier
# o+1) only ever sees ca.crt and its own cosigner<o+1>.crt/.key: a short init container copies
# them from the source Secret(s) into an in-memory volume, and only that volume is mounted into
# the cosigner. (A single StatefulSet cannot mount a different Secret per ordinal, so the pod spec
# and its init container still reference every node's material — see README, "TLS material".)
tls:
  # perNode (default): one Secret per node named <perNodeSecretPrefix><identifier>, with keys
  #   tls.crt / tls.key (the kubernetes.io/tls shape; cert-manager can write it), plus
  #   <caSecretName> with key ca.crt.
  # shared (the ≤ 0.3.x layout): one Secret <tlsSecretName> holding ca.crt and every
  #   cosigner<i>.crt / cosigner<i>.key. Keep it for an existing install until it has migrated
  #   (README, "Migrating from the shared TLS Secret").
  layout: perNode
  perNodeSecretPrefix: rutli-cosigner-tls-
  caSecretName: rutli-cosigner-ca
  # ca.crt must hold only CA certificates that are valid now — a cosigner refuses to start on a
  # leaf, a private key or an expired/not-yet-valid CA in it (each is a full mTLS trust anchor).
  # true accepts an expired or not-yet-valid CA (never a non-CA): emergency use only, to rotate
  # away from a CA that has already expired (docs/ca-rotation.md). Set it back to false after.
  allowExpiredCa: false

# tls.layout=shared only: the legacy Secret with ca.crt + cosigner1..N .crt/.key.
tlsSecretName: rutli-cosigner-tls

# topology=legacy only: existing Secret with key RUTLI_SEAL_SECRET (the shared master, ≥ 32 chars).
# Deprecated (audit C3): every pod gets every node's DEK root through its env.
sealSecretName: rutli-seal
sealSecretKey: RUTLI_SEAL_SECRET

# Client cert CNs allowed to call Signer (DKG / Sign / Refresh). Required when TLS is on.
signerAllowlist:
  - driver

# Cert CNs allowed on the mesh Peer API — the cosigners themselves. Required when TLS is on.
# Empty = derived as cosigner1..cosigner<replicaCount> (what scripts/gen-frost-certs.sh issues).
# The driver's CN must NOT appear here: the Peer API is the raw FROST protocol, so anything that
# can call it on `threshold` nodes can aggregate a signature over an arbitrary message.
peerAllowlist: []

# Client cert CNs of the operator role: KeyStatus + HostedKeyStatus + CeremonySignTest only (the
# split ceremony's `verify-key --sign-test`, and `verify-hosted` for an imported encryption key),
# never Sign/DKG/Refresh/hosted-key operations. Empty = no operator role (then both commands need
# the driver cert). Must not share a CN with signerAllowlist or peerAllowlist.
operatorAllowlist: []

# Client cert CNs of the refresher role (audit C2): Refresh + KeyStatus only, never Sign — the
# certificate the refresh CronJob carries. May be the operator CN (both roles cannot sign), e.g.
# [operator] until a `refresher` certificate is issued (gen-frost-certs.sh issues one). Must not share
# a CN with signerAllowlist or peerAllowlist. Empty = no refresher role (the driver role keeps
# Refresh while signingPolicy.signer_may_refresh is on).
refreshAllowlist: []

# Cosigner-side signing policy (audit C2), written into every node's config as `signing_policy`
# verbatim — snake_case keys exactly as docs/approval-quorum.md documents them. Empty = defaults:
# signing intents verified when present but not required, no ACLs or pins, 300/min and 20000/day
# per key, journal kept 90 days / 64 MiB per key. Switch enforcement on (require_intent,
# signer_acl_required, signer_may_refresh: false) only after every cosigner AND the driver run this
# release. Example:
#   signingPolicy:
#     require_intent: true
#     signer_acl_required: true
#     signer_may_refresh: false
#     signer_acl: { driver: ["participant1-"] }
#     signer_pins: { driver: ["<sha256 of the driver cert's SPKI>"] }
#     rate_limits: [{ key_id_prefix: "participant1-frost-namespace", per_min: 10, per_day: 200 }]
#     rules: [{ key_id_prefix: "participant1-frost-namespace", mode: quorum, threshold: 2 }]
#     approvers: [{ id: alice, public_key_spki_b64: "MCowBQYDK2VwAyEA..." }]
signingPolicy: {}

# topology=perNode: node ids whose cosigner container runs NO daemon (`sleep infinity`, no probes),
# for the offline commands that take the instance lock — restore, keyfile migrate/downgrade,
# hosted-undelete, hosted-clear-tombstone, ceremony resolve, discard-partial-key — run with
# `kubectl exec <pod> -c cosigner -- rutli-cosigner --config /config/cosigner-<id>.json …`.
# One node at a time; the others keep signing. Empty in normal operation.
maintenanceNodes: []

# Key-file format (audit M4), written into every node's config as `keyfile` verbatim. Empty =
# this release's defaults: read v1 and v2, write v1 (so a rollback to an older image stays
# possible). After every cosigner runs this release: set cluster_uuid (one lowercase UUID for the
# whole cluster, never changed — `uuidgen | tr A-Z a-z`), then write_version: 2 (each node re-seals
# its files as v2 at start). accept_v1: false once no rollback is wanted. Example:
#   keyfile:
#     cluster_uuid: "6f1d3c1e-8a0b-4a43-9c55-0d4f1f0b7a11"
#     write_version: 2
keyfile: {}

# topology=legacy only: the tls.domain written into each config. Since 0.4.0-rc.2 the cosigners
# verify each peer under its own name (cosigner<id>) whatever this says; it only remains the
# fallback name for operator commands against a non-roster target.
tlsDomain: rutli-cosigner

# Cluster id pin (`cluster_id` in every cosigner's config): the identity hosted-key replication
# envelopes and split-ceremony requests/bundles are bound to. Empty = derived from the bytes of
# ca.crt (`shasum -a 256 ca.crt | cut -c1-16`), so ANY change to ca.crt — including adding a second CA
# for a rotation — would change it and split the cluster mid-rollout. Set it to the CURRENT derived
# id before any CA change, and never change it afterwards (docs/ca-rotation.md). Exactly 16
# lowercase hex characters; pass it as a string (`--set-string clusterId=…`).
# Requires a cosigner image with `cluster_id` support — older images silently ignore the field:
# check each pod's startup log for `cluster id <id> (pinned in config)`.
#
# The id belongs to ONE cluster: never copy clusterId (or a values file that carries it) to another
# cluster. A new cluster leaves it empty and gets its own derived id.
#
# Once set, it must survive every later upgrade. `helm upgrade` WITHOUT `--reuse-values` or
# `-f <saved values>` resets it to "" — the pods would then derive an id from ca.crt, which after a
# rotation is a different one. Upgrade with `-f <saved values>` (`helm get values <release> -o yaml
# > saved.yaml` first) or `--reuse-values`. As a backstop each cosigner records the id it runs under
# in data_dir/cluster-id and refuses to start under a different one (`cluster id mismatch` in the
# pod log; the rollout stops at that pod with the others still serving).
clusterId: ""

# Allow the next start of every cosigner to run under a different cluster id than the one it
# recorded (see clusterId). Only for a deliberate change, never for a rotation: set it for one
# rollout, then set it back to false.
clusterIdChangeAllowed: false

# Cluster-hosted (non-FROST) keys: the RSA-2048-OAEP encryption keypair and the AES-256-GCM
# symmetric key Canton needs, held by the cluster so the participant needs no HSM and no local key
# state. Off by default — turning it on is a custody decision, not a tuning knob.
#
# These are REPLICATED WHOLE KEYS, not threshold shares: generated on one cosigner, copied to the
# others (wrapped per recipient), sealed at rest on each, and any node can serve a decrypt. One
# compromised cosigner yields those keys, and because they protect Canton's per-view session keys,
# an attacker who extracts one can read *previously recorded* traffic encrypted to it — rotation
# fixes the future, not the past. The Ed25519 namespace key is unaffected: it stays true 2-of-3
# threshold and is never replicated. The win is relocation — key material moves off the busy,
# internet-adjacent participant host onto three hardened single-purpose nodes.
# See docs/hosted-keys.md before enabling.
hostedKeys:
  enabled: false
  # How many cosigners must hold a new key before it counts as created. 2 matches the cluster's own
  # fault model; requiring all `replicaCount` would block key rotation whenever any node is down,
  # which is worse than the single copy an HSM gives. Must be 1..=replicaCount. Below quorum the
  # write rolls back rather than leaving one lonely copy.
  writeQuorum: 2
  # Anti-entropy sweep: pull keys this node lacks, push keys a peer lacks. This is what heals an
  # under-quorum write or a node restored from a stale backup, so a writeQuorum below replicaCount
  # is only safe with it running. Floor of 10s is enforced by the cosigner.
  antiEntropyIntervalSecs: 300
  # Ceiling on decryptions per key per minute, enforced by the cosigner (0 disables). This is the
  # bound on a stolen driver certificate, which can otherwise bulk-decrypt recorded traffic at line
  # rate. The default is ~100/s sustained on one key — far above real Canton traffic.
  # PER NODE: every cosigner enforces it independently (no shared state), so a stolen certificate
  # that calls every pod directly gets replicaCount x this budget per key (default 3 x 6000). The
  # driver sends a key's traffic to one leader at a time, so this must still cover the full
  # legitimate rate on one node: set it to cluster_budget / replicaCount, keeping it above that peak.
  decryptRateLimitPerMin: 6000
  # topology=perNode: the cluster-wide hosted-key commitment key (64 hex, public, the same on every
  # node). Required with enabled=true. A migrated install takes the value `seal split-legacy`
  # prints; a new cluster generates one: openssl rand -hex 32.
  commitmentKey: ""
  # Deletes (audit M2). A delete replaces the key with a tombstone on every node, authorized by a
  # delete intent signed by a client CN listed here (its own role: the driver certificate cannot
  # delete unless listed). Empty = hosted keys cannot be deleted. Never a cosigner CN. Requires
  # every cosigner to run this release before any delete (older nodes ignore tombstones).
  deleteAllowlist: []
  # Optional key-id prefixes per delete CN, e.g. { operator: ["participant1-"] }.
  deleteAcl: {}
  # Distinct signingPolicy.approvers that must approve a delete (rutli-approve, same inbox format).
  # 0 = none; at least 1 is recommended in production.
  deleteApprovalThreshold: 0
  # How long a deleted key's material stays sealed in its tombstone for `hosted-undelete`.
  deleteGraceSecs: 604800

persistence:
  size: 1Gi
  storageClassName: ""
  # ReadWriteOncePod: the kernel lets exactly ONE pod mount a share volume, so a second cosigner
  # process on the same share (a force-deleted pod on a partitioned node, a debug or backup pod
  # that binds the claim) cannot start. Needs a CSI driver that supports it (Kubernetes >= 1.29,
  # GA). The cosigner also takes a flock on its data dir, which covers two processes on ONE node.
  #
  # volumeClaimTemplates are IMMUTABLE on an existing StatefulSet: `helm upgrade` of a release
  # installed with the old default fails ("updates to statefulset spec ... are forbidden"). An
  # EXISTING install must keep the mode it was created with — override it:
  #   persistence:
  #     accessModes: [ReadWriteOnce]
  # (deploy/soak/cosigner-values.yaml does this for the DevNet soak). Moving an existing install to
  # ReadWriteOncePod means recreating the StatefulSet and its claims (restore from backup); do it
  # only as a planned operation.
  accessModes:
    - ReadWriteOncePod

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  # Canton participant namespace must carry this label; pod must carry clientLabel.
  clientNamespaceLabel: rutli.io/client-ns
  clientPodLabel: rutli.io/client
  scraperPodLabel: rutli.io/scraper

podAntiAffinity: required # required | preferred | none

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

metrics:
  enabled: true
  annotations: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}

# Extra env vars for every cosigner
extraEnv: []

# Backups (topology=perNode only): a `backup` sidecar in each cosigner pod copies that node's
# SEALED key files (data_dir/keys/*.json — never nonce markers, temps or staged files) to that
# node's own destination, once a day. The sidecar mounts the node's data volume read-only (same pod:
# no second mount of the claim, so not the 2026-10-07 failure mode) and never mounts the seal
# bundle or the TLS key: nothing in the backup path ever holds a DEK. There is no CronJob, no
# ServiceAccount and no pods/exec RBAC — the exec-based backup was removed (audit C3: its Role could
# exec into every cosigner and read every node's seal secret).
#
# Each run logs one line, `BACKUP_OK node=<id> files=<n> bytes=<n> dest=<…>` or
# `BACKUP_FAILED node=<id> …`. The sidecar never exits non-zero (a crashing sidecar would flip the
# pod's readiness and eat the PDB), so alert on the log line or on the destination's newest object.
backup:
  enabled: false
  # Daily at this UTC time (HH:MM). Keep refresh drills away from it.
  dailyAtUtc: "03:17"
  # Also take one backup as soon as the pod starts (shows the destination works right away).
  runOnStart: true
  destination:
    # pvc (default): a per-node backup PVC (<fullname>-backup-n<id>, or nodes[].backupClaim), mounted
    #   in that node's sidecar only, at /backup. Keeps the newest `keep` tars. Protects against a
    #   wiped or corrupted data volume; for loss of the storage backend, also ship off-cluster.
    # script: run `ship` with $1 = the tar, $2 = the node id; credentials from nodes[].backupSecret
    #   (mounted at /backup-creds, per node). Add the endpoint to backup.egress.
    type: pvc
    keep: 14
    pvc:
      size: 1Gi
      storageClassName: ""
      accessModes:
        - ReadWriteOncePod
    # type=script only. POSIX sh body; must exit non-zero on failure. For example:
    #   rclone --config /backup-creds/rclone.conf copyto "$1" "remote:rutli-backups/node-$2/$(basename "$1")"
    ship: |
      echo "ship: no backup destination script configured — set backup.destination.ship" >&2
      exit 1
  # Extra egress for the cosigner pods so the sidecar can reach an off-cluster destination
  # (type=script). The pod shares one network namespace, so this also opens the path for the
  # cosigner process — keep it to the one endpoint. e.g. [{ cidr: 203.0.113.10/32, port: 443 }]
  egress: []
  # Defaults to the cosigner image (it has /bin/sh, tar and coreutils).
  image: {}
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
