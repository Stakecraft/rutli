# Prometheus config for the Rütli soak stack. Job name MUST stay "rutli-cosigner" — the shipped
# alert rules (deploy/monitoring/prometheus-rules.yml) select on it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/rutli.yml

scrape_configs:
  - job_name: rutli-cosigner
    static_configs:
      - targets:
          - cosigner1:9200
          - cosigner2:9200
          - cosigner3:9200
