#
# Daily sealed-share backups for a Helm cosigner cluster — run INSIDE each running cosigner via
# `kubectl exec`, exactly like the compose soak runbook does with `docker exec`.
#
#   kubectl apply -f deploy/soak/k8s/cosigner-backup-exec-cronjob.yaml -n rutli
#
# This is the soak cluster's applied copy: it must apply-and-run on day 0, so the backup stays on
# each node's own volume and there is no mandatory ship step. The off-cluster upgrade path is the
# same design in the repo proper — deploy/k8s/cronjob-backup.yaml (kustomize) and the chart's
# `backup.enabled=true` — which additionally stream each backup out of the pod with
# `kubectl exec … tar -cf -` and hand the tars to an operator-supplied ship.sh (ConfigMap
# rutli-backup-destination / value backup.ship; the placeholder exits 1 until configured).
#
# Why exec and not a second pod on the PVC: on 2026-10-07 a job pod that mounted a cosigner's
# RWO data volume left data_dir/keys unreadable to the running cosigner, which kept passing its
# gRPC health check and failed every signature until it was restarted (docs/soak-2026-10-devnet.md,
# incident #1). A cosigner's volume is its own; nothing else mounts it.
#
# The backup lands on the node's own volume under /data/backup-<weekday> (a 7-day rotation). That
# protects against a wiped keys/ directory — the week-2 restore drill — not against losing the
# volume; ship the directory off-cluster for that.
#
# Share files are written atomically and only rewritten by a refresh, so a live copy is
# consistent unless a refresh ceremony is in flight: schedule refresh drills away from 03:xx UTC.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rutli-backup
  labels: { app.kubernetes.io/part-of: rutli }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rutli-backup
  labels: { app.kubernetes.io/part-of: rutli }
# Least privilege: `kubectl exec` is a GET on the pod followed by a POST on pods/exec, so that is
# all the Role grants — and only for the three cosigner pods by name. No list, no logs, no secrets.
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
    resourceNames: [rutli-cosigner-0, rutli-cosigner-1, rutli-cosigner-2]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
    resourceNames: [rutli-cosigner-0, rutli-cosigner-1, rutli-cosigner-2]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rutli-backup
  labels: { app.kubernetes.io/part-of: rutli }
subjects:
  - kind: ServiceAccount
    name: rutli-backup
roleRef:
  kind: Role
  name: rutli-backup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rutli-cosigner-backup
  labels: { app.kubernetes.io/part-of: rutli, app: rutli-cosigner-backup }
spec:
  schedule: "17 3 * * *" # daily 03:17 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: rutli-cosigner-backup }
        spec:
          restartPolicy: Never
          serviceAccountName: rutli-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              # kubectl + bash + coreutils. Pinned by digest; bump deliberately.
              image: alpine/k8s:1.31.13@sha256:7a319b15cfc99c9aaa27ec9891d6b4ca24632b795908591c7b0ba89b03549e0a
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  day=$(date -u +%u)
                  rc=0
                  for i in 0 1 2; do
                    pod="rutli-cosigner-$i"
                    cfg="/config/cosigner-$((i+1)).json"
                    if kubectl exec "$pod" -c cosigner -- sh -c "rm -rf /data/backup-$day && rutli-cosigner --config $cfg backup --out /data/backup-$day"; then
                      echo "$pod: backup written to /data/backup-$day"
                    else
                      echo "$pod: BACKUP FAILED" >&2; rc=1
                    fi
                  done
                  exit $rc
              env:
                - { name: HOME, value: /tmp } # kubectl writes its cache under $HOME
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
