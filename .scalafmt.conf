#
# scalafmt settings for driver/. Chosen to match the existing code as closely as possible, so that
# the quality ratchet counts real drift rather than a style change: the codebase has not been
# reformatted. The generated gRPC Java in driver/src/main/java is not Scala and is not formatted.
version = "3.11.5"
runner.dialect = scala213
maxColumn = 130
docstrings.style = keep
newlines.source = keep
rewrite.trailingCommas.style = keep
project.excludePaths = ["glob:**/driver/src/main/java/**"]
