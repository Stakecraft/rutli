# libFuzzer needs a nightly compiler (-Zsanitizer). Pinned, so a nightly regression does not turn the
# fuzz job red overnight; bump it deliberately. .github/workflows/fuzz.yml installs this version. The
# shipped binaries are built with frost/rust-toolchain.toml, never with this one.
[toolchain]
channel = "nightly-2026-11-15"
profile = "minimal"
