#
# cargo-about configuration: THIRD-PARTY-LICENSES.txt (shipped in the cosigner image and next to the
# rutli-dealer release binary) is generated from it by scripts/third-party-licenses.sh. Accept the
# same licenses as deny.toml.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
# Only what ends up in the shipped binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are covered by the repository LICENSE.
private = { ignore = true }
