[package]
name = "rutli-cosigner"
description = "FROST cosigner daemon for the Rütli Canton KMS. Exposes a gRPC signing API (Sign/Health) backed by rutli-frost-core, and orchestrates DKG + two-round signing across the cosigner mesh. One share per node; the full key is never assembled."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rutli-cosigner"
path = "src/main.rs"

# The split ceremony's offline dealer. Never shipped in the cosigner image (see the Dockerfile).
[[bin]]
name = "rutli-dealer"
path = "src/bin/rutli-dealer.rs"

[dependencies]
rutli-frost-core = { path = "../core" }
# Canton key parsing (the split ceremony's dealer) and the Canton fingerprint of a group key.
rutli-canton-key = { path = "../canton-key" }
frost-ed25519 = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
x509-parser = { workspace = true }
metrics = { workspace = true }
aws-lc-rs = { workspace = true }
x25519-dalek = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
libc = { workspace = true }
# verify-key checks every test signature with verify_strict, independently of the cluster.
ed25519-dalek = { workspace = true }
# PEM bodies of the mTLS cert/key that sign split-ceremony recipient requests (request_auth.rs).
base64 = { workspace = true }
# verify-key's TLS probe (tls_probe.rs).
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tempfile = "3"
rcgen = { workspace = true }
