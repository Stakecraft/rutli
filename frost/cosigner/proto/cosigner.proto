syntax = "proto3";
package rutli.cosigner.v1;

// Java/Scala side (the KMS driver's FrostBackend) uses grpc-java stubs generated from this file.
// These options only affect Java codegen; the Rust cosigner (tonic) ignores them.
option java_multiple_files = true;
option java_package = "com.stakecraft.rutli.grpc";
option java_outer_classname = "CosignerProto";

// Client-facing signing API. This is what the Scala FrostBackend (the Canton KMS driver's MPC
// backend) calls. The node it connects to acts as the session leader for that request.
service Signer {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc GroupKey(GroupKeyRequest) returns (GroupKeyReply);
  rpc Dkg(DkgRequest) returns (DkgReply);
  rpc Sign(SignRequest) returns (SignReply);
  // Proactively refresh the shares for a key. Same group key out; shares re-randomized cluster-wide.
  rpc Refresh(RefreshRequest) returns (RefreshReply);
  // This node's local, read-only view of one FROST key — public values only (group key, its own
  // verifying share, the public key package and its digest, provenance). For `rutli-cosigner
  // verify-key`, which asks every node and compares. Allowlisted like GroupKey. The driver does
  // not call it.
  rpc KeyStatus(KeyStatusRequest) returns (KeyStatusReply);
  // Split ceremony verification: sign a fixed, server-computed test digest for an imported key
  // with EXACTLY the given quorum, so every t-subset of cosigners can be proven to sign. The
  // message is never caller-supplied (0x1220 ‖ SHA-256("rutli-verify-key/" ‖ ceremony_id ‖
  // key_id), from the key's recorded provenance), and keys without a dealer-split origin are
  // refused. Callable by the operator role (operator_allowlist) as well as the driver role.
  rpc CeremonySignTest(CeremonySignTestRequest) returns (CeremonySignTestReply);

  // --- cluster-hosted (non-FROST) keys: RSA-2048 and EC P-256 (ECIES) encryption, AES-256-GCM ---
  // These are replicated whole keys, not threshold shares (docs/hosted-keys-design.md). They let a
  // participant run with no HSM and no local key state.

  // What this cluster supports. The driver queries it at startup instead of hardcoding specs, so
  // adding a key type later needs no driver release.
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesReply);
  // Generate a hosted key. key_id is caller-supplied, making retries idempotent.
  rpc GenerateKey(GenerateKeyRequest) returns (GenerateKeyReply);
  // X.509 SubjectPublicKeyInfo DER for an asymmetric hosted key.
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyReply);
  rpc KeyInfo(KeyInfoRequest) returns (KeyInfoReply);
  // Delete a hosted key (audit M2): replaces it with a durable TOMBSTONE on every node, which wins
  // over any live copy in anti-entropy, so a node that was down cannot resurrect it. Requires a
  // signed delete intent (SignedIntent, purpose "delete-key") from a client on every node's
  // hosted_keys.delete_allowlist — a separate role: the driver certificate cannot delete unless an
  // operator lists it. Each node verifies the intent itself. The material stays sealed inside the
  // tombstone for hosted_keys.delete_grace_secs (default 7 days), for `rutli-cosigner
  // hosted-undelete`; the id is never reused.
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyReply);
  // RSAES-OAEP-SHA256. The full unpad happens server-side — returning raw c^d mod N would be a
  // padding oracle.
  rpc Decrypt(DecryptRequest) returns (DecryptReply);
  // ECIES (EcP256 / EciesHkdfHmacSha256Aes128Cbc): the static ECDH only, Z = x(d·V) for the
  // sender's ephemeral point V. The driver completes KDF2 + AES-128-CBC + HMAC-SHA256 with
  // BouncyCastle's own IESEngine, so the cluster never reimplements Canton's framing — and a v2
  // threshold P-256 key answers this same RPC from partial points. Charged against the key's
  // decryption rate limit like Decrypt; refused for every spec but "ec-p256-ecies".
  rpc EcdhDerive(EcdhDeriveRequest) returns (EcdhDeriveReply);
  rpc SymmetricEncrypt(SymmetricRequest) returns (SymmetricReply);
  rpc SymmetricDecrypt(SymmetricRequest) returns (SymmetricReply);
  // This node's own copy of one hosted key, public half only, read from its key file — NO
  // read-repair, so a node that lacks the key says so instead of fetching it. For `rutli-cosigner
  // verify-hosted`, which asks every node and compares. Callable by the operator role
  // (operator_allowlist) as well as the driver role, like KeyStatus. The driver does not call it.
  rpc HostedKeyStatus(HostedKeyStatusRequest) returns (HostedKeyStatusReply);
}

// Mesh-internal API: cosigner-to-cosigner. All FROST packages are carried as opaque bytes
// (serde_json of the frost-ed25519 types) so the protocol schema is not pinned into protobuf.
service Peer {
  rpc SignRound1(SignRound1Request) returns (SignRound1Reply);
  rpc SignRound2(SignRound2Request) returns (SignRound2Reply);
  // Ceremony protocol 1 (leader-relayed round 2 — audit C1). Retained ONLY so that a node of this
  // release refuses an older leader loudly: every one of these answers FAILED_PRECONDITION.
  rpc DkgPart1(DkgPart1Request) returns (DkgPart1Reply);
  rpc DkgPart2(DkgPart2Request) returns (DkgPart2Reply);
  rpc DkgPart3(DkgPart3Request) returns (DkgPart3Reply);
  rpc RefreshPart1(RefreshPart1Request) returns (DkgPart1Reply);
  rpc RefreshPart2(DkgPart2Request) returns (DkgPart2Reply);
  rpc RefreshPart3(DkgPart3Request) returns (DkgPart3Reply);
  // Ceremony protocol 2 (DKG and refresh share one path). The leader coordinates only: it never
  // sees a round-2 package. Part 2 makes each node deliver its round-2 packages DIRECTLY to their
  // recipients (CeremonyDeliver, node to node over mTLS), and every delivery carries the sender's
  // digest of the round-1 map, so a leader that shows nodes different maps makes all abort. Part 3
  // stages the new share and records a yes-vote; CeremonyCommit then resolves (two-phase commit).
  rpc CeremonyPart1(CeremonyPart1Request) returns (CeremonyPart1Reply);
  rpc CeremonyPart2(CeremonyPart2Request) returns (CeremonyPart2Reply);
  // Sender -> recipient. The recipient takes the sender from the caller's certificate CN (exact
  // roster mapping) and refuses a `from` that differs, or a `to` that is not itself.
  rpc CeremonyDeliver(CeremonyDeliverRequest) returns (CeremonyDeliverReply);
  rpc CeremonyPart3(CeremonyPart3Request) returns (CeremonyPart3Reply);
  // Best-effort: drop an in-flight sign session so its round-1 nonces are freed immediately
  // instead of lingering until the pending-TTL sweep. Sent by the leader when a sign gives up.
  rpc AbortSign(AbortSignRequest) returns (AbortSignReply);
  // Cluster-wide ceremony fence: take the per-key guard on every peer BEFORE DKG/refresh crypto
  // (or a hosted-key write), so no other ceremony for the key can start while this one is in
  // flight. It does not pause signing (since 0.4.0-rc.4). Release rolls back a partial fence if a
  // later peer refuses.
  rpc CeremonyFence(CeremonyFenceRequest) returns (CeremonyFenceReply);
  rpc CeremonyRelease(CeremonyReleaseRequest) returns (CeremonyReleaseReply);

  // --- hosted-key replication ---
  // Key material moves between cosigners ONLY over these RPCs, and only ever wrapped to the
  // recipient node (never plaintext-inside-TLS). The Peer API is restricted to cosigner certs by
  // peer_allowlist — the driver must never be able to call it.

  // Push a wrapped hosted key to this node (leader -> peer during generation).
  rpc ReplicateKey(ReplicateKeyRequest) returns (ReplicateKeyReply);
  // Pull a hosted key this node is missing (anti-entropy / read-repair). The responder wraps to
  // the *caller's* node identity, derived from its client certificate.
  rpc FetchKey(FetchKeyRequest) returns (FetchKeyReply);
  // Hosted-key inventory for anti-entropy. FROST shares are never listed or transferred — copying
  // a share would give two nodes the same share and silently break the threshold scheme.
  rpc ListKeys(ListKeysRequest) returns (ListKeysReply);
  // Replicated delete: with a delete intent, this node verifies it and tombstones the key. Without
  // one, only the rollback of a key this node stored in the same, still-fenced generation that did
  // not reach its write quorum (genkey ceremony id) — anything else is refused.
  rpc PurgeKey(PurgeKeyRequest) returns (PurgeKeyReply);
  // This node's identifier and X25519 distribution public key (for wrapping hosted keys to it).
  rpc NodeInfo(NodeInfoRequest) returns (NodeInfoReply);

  // --- two-phase ceremonies (DKG/refresh) ---
  // This node's committed epoch and PKP digest for one FROST key, and whether a ceremony for it is
  // staged here. Public values only. The leader asks every node before a DKG (idempotent retry)
  // or a refresh (every node must be on the same sharing).
  rpc KeyEpoch(KeyEpochRequest) returns (KeyEpochReply);
  // Resolve a ceremony this node STAGED, now: it asks every roster node for its vote DIRECTLY and
  // commits only if all of them hold a yes-vote for the same outcome, aborts only on a no-vote or a
  // divergent one, else stays STAGED (its background resolver keeps asking). The caller's word is
  // never evidence. Returns where the ceremony stands on this node afterwards.
  rpc CeremonyCommit(CeremonyCommitRequest) returns (CeremonyStatusReply);
  // This node's vote on a ceremony. A node with neither a session nor a record durably votes
  // ABORTED before it answers, so an answer never changes later.
  rpc CeremonyStatus(CeremonyStatusRequest) returns (CeremonyStatusReply);
  // The leader gives up: drops this node's in-memory session (recording ABORTED). A recorded vote
  // (STAGED included) is returned unchanged.
  rpc CeremonyAbort(CeremonyAbortRequest) returns (CeremonyStatusReply);
}

message HealthRequest {}
message HealthReply {
  bool ok = 1;
  string detail = 2;
}

message GroupKeyRequest { string key_id = 1; }
message GroupKeyReply { bytes group_verifying_key = 1; } // 32-byte RFC 8032 Ed25519 key

// Coordinate a distributed key generation across the whole configured cluster.
message DkgRequest { string key_id = 1; }
message DkgReply { bytes group_verifying_key = 1; }

// Proactively refresh shares for a key (same group key, re-randomized shares).
message RefreshRequest { string key_id = 1; }
message RefreshReply { bytes group_verifying_key = 1; } // unchanged; returned for confirmation

message CeremonySignTestRequest {
  string key_id = 1;
  // Configured identifiers of the quorum; exactly `threshold` distinct roster members.
  repeated uint32 signers = 2;
}
message CeremonySignTestReply {
  bytes message = 1;    // the 34-byte digest that was signed (server-computed)
  bytes signature = 2;  // 64-byte Ed25519 signature under the group key
}

message KeyStatusRequest { string key_id = 1; }
message KeyStatusReply {
  // This node's FROST identifier, serialized (32-byte little-endian scalar).
  bytes identifier = 1;
  bytes group_verifying_key = 2;   // 32-byte RFC 8032 Ed25519 key
  bytes own_verifying_share = 3;   // this node's verifying share (32-byte point)
  bytes pkp_digest = 4;            // SHA-256 of the canonical public key package
  uint32 threshold = 5;
  bytes public_key_package = 6;    // JSON of the frost-ed25519 PublicKeyPackage (public)
  // "dkg" (born distributed, or written before provenance was recorded) or "dealer-split".
  string origin = 7;
  string ceremony_id = 8;          // dealer-split only
  string canton_fingerprint = 9;   // dealer-split only
  uint64 installed_at = 10;        // dealer-split only, seconds since the Unix epoch
  uint64 refresh_count = 11;       // dealer-split only: refreshes since install
  // dealer-split from a B6 dealer only (empty otherwise): what the key was carried for,
  // "namespace" or "protocol", and its recorded Canton usage, comma-separated as Canton names it
  // ("" = none recorded, which Canton reads as all; "unknown" = plain PKCS#8).
  string carried_for = 12;
  string recorded_usage = 13;
  // Which sharing this node holds: 1 after DKG, +1 per committed refresh; 0 for a share written
  // before epochs existed or installed by the split ceremony. Nodes must agree.
  uint64 epoch = 14;
  // This node's epoch check found its share stale (a peer holds a newer committed sharing of the
  // same group key that this node never voted for, e.g. after a restore from an old backup). A
  // stale node refuses to sign or lead for the key until its share is current again.
  bool stale = 15;
}

message RefreshPart1Request {
  string refresh_id = 1;
  string key_id = 2;
}

message SignRequest {
  string key_id = 1;
  bytes message = 2; // Canton's 34-byte pre-hashed payload
  // The client's signed authorization for exactly this signature (audit C2): every participating
  // cosigner verifies it independently before it commits to a nonce, and again before it releases
  // its share. The leader also requires the intent's signer to be the mTLS caller. Absent from a
  // driver that predates intents: accepted (with rutli_sign_intent_absent_total) unless the node
  // sets signing_policy.require_intent.
  SignedIntent intent = 3;
}

// What a client authorizes: one signature by key_id over digest, until not_after_ms — or, with
// purpose "delete-key", the deletion of hosted key key_id. Carried serialized inside
// SignedIntent.intent, so the verified bytes are exactly the signed bytes.
message SignIntent {
  uint32 version = 1;            // 1
  string cluster_id = 2;         // the cosigners' cluster id (Capabilities.cluster_id) — no cross-cluster replay
  string purpose = 3;            // "sign" | "delete-key"
  string key_id = 4;
  // "sign": exactly the 34-byte Canton digest the signature is over. "delete-key": the 32 bytes
  // SHA-256("rutli-delete-key-v1\n" ‖ key_id) (approvals are over this digest, like a sign's).
  bytes digest = 5;
  bytes request_id = 6;          // 16 random bytes; one per driver sign call, the same across leader failover
  uint64 issued_at_ms = 7;       // Unix epoch milliseconds
  uint64 not_after_ms = 8;
  // Approvals collected by the driver's ApprovalGate for a gated key: Ed25519 signatures over the
  // UTF-8 hex requestId = hex(SHA-256(key_id ‖ SHA-256(digest) ‖ approval_nonce)), exactly what
  // rutli-approve signs (FileApprovalGate.requestIdFor). Every cosigner counts them itself.
  bytes approval_nonce = 9;
  repeated IntentApproval approvals = 10;
}
message IntentApproval {
  string approver_id = 1;
  bytes signature = 2;           // 64-byte Ed25519
}
message SignedIntent {
  bytes intent = 1;              // a serialized SignIntent
  // "ecdsa-p256-sha256" (the driver's mTLS key as gen-frost-certs.sh issues it), or
  // "ecdsa-p384-sha384", "ed25519", "rsa-pkcs1-sha256" — whatever the leaf key is.
  string signature_alg = 2;
  bytes signature = 3;           // over "rutli-intent-v1\n" ‖ intent, by the leaf's key
  repeated bytes signer_chain = 4; // DER certificates, leaf first (the client's mTLS certificate)
}
message SignReply { bytes signature = 1; } // 64-byte Ed25519 signature

message SignRound1Request {
  string key_id = 1;
  string session_id = 2;
  // The client's signing intent (see SignRequest.intent), forwarded by the leader unchanged. This
  // node verifies it itself — signature, certificate chain to the cluster CA, signer allowlist and
  // pins, cluster, key, digest == message, expiry, key ACL, approvals — and binds its nonces to
  // SHA-256(intent.intent). A leader or peer cannot mint or alter one.
  SignedIntent intent = 3;
  // The leader's sharing of key_id: its committed epoch and PKP digest. A node whose own committed
  // share differs refuses (FAILED_PRECONDITION, trailer rutli-error=epoch-mismatch carrying its own
  // rutli-epoch / rutli-pkp-digest) and never signs from a mismatched epoch. An empty pkp_digest is
  // a leader that predates epochs: the check is skipped with a warning unless the node sets
  // signing_policy.require_epoch_match. A node that found its own share stale at its epoch check
  // refuses every round 1 for the key (rutli-error=stale-share).
  uint64 epoch = 4;
  bytes pkp_digest = 5;
  // Session binding: the message this session will sign (Canton's 34-byte digest) and the signer
  // set of this attempt (configured identifiers). The node binds its round-1 nonces to them, and
  // refuses a round 2 for the session with another message, another commitment set or its own
  // commitment altered — before burning the nonce marker. Empty/absent from a leader that predates
  // session binding: not checked.
  bytes message = 7;
  repeated uint32 signers = 8;
  // "sign" (or empty) for a signature a client asked for; "sign-test" for the split ceremony's
  // CeremonySignTest, which carries no intent and is accepted only for the node's OWN test digest
  // of key_id (computed from the key's provenance) as `message`.
  string purpose = 6;
}
message SignRound1Reply { bytes commitments = 1; } // json SigningCommitments

message SignRound2Request {
  string key_id = 1;
  string session_id = 2;
  bytes message = 3;
  bytes commitments_map = 4; // json BTreeMap<Identifier, SigningCommitments>
  // SHA-256 of the SignedIntent.intent bytes round 1 carried; empty when round 1 had none. Must
  // match what this node bound at round 1 (checked before the nonce marker burns).
  bytes intent_digest = 5;
}
message SignRound2Reply { bytes share = 1; } // json SignatureShare

message AbortSignRequest {
  string key_id = 1;
  string session_id = 2;
}
message AbortSignReply {}

message CeremonyFenceRequest {
  string ceremony_id = 1;
  string key_id = 2;
  // "dkg", "refresh", "genkey" or "delkey"
  string kind = 3;
  // refresh: the sharing the leader saw on every node. A node holding another (epoch, PKP digest)
  // refuses. Empty digest = no expectation (DKG, hosted-key fences).
  uint64 expected_epoch = 4;
  bytes expected_pkp_digest = 5;
  // The leader's ceremony protocol. A node refuses a DKG/refresh fence below its own (2).
  uint32 protocol = 6;
}
message CeremonyFenceReply {}

message CeremonyReleaseRequest {
  string ceremony_id = 1;
  string key_id = 2;
}
message CeremonyReleaseReply {}

message DkgPart1Request {
  string dkg_id = 1;
  string key_id = 2;
  uint32 identifier = 3;
  uint32 max_signers = 4;
  uint32 min_signers = 5;
}
message DkgPart1Reply { bytes round1_package = 1; }

message DkgPart2Request {
  string dkg_id = 1;
  bytes round1_map = 2; // json BTreeMap<Identifier, round1::Package>
}
message DkgPart2Reply { bytes round2_map = 1; } // json BTreeMap<Identifier, round2::Package> (addressed to others)

message DkgPart3Request {
  string dkg_id = 1;
  bytes round1_map = 2;        // json BTreeMap<Identifier, round1::Package>
  bytes round2_map_for_me = 3; // json BTreeMap<Identifier, round2::Package> addressed to this node
}
message DkgPart3Reply { bytes group_verifying_key = 1; }

// ── cluster-hosted keys ────────────────────────────────────────────────────────────────────────

message CapabilitiesRequest {}
message CapabilitiesReply {
  // Spec identifiers this cluster can generate/serve: "rsa-2048-oaep-sha256", "aes-256-gcm",
  // "ec-p256-ecies".
  repeated string hosted_key_specs = 1;
  bool hosted_keys_enabled = 2;
  // The cluster id signing intents must name (SignIntent.cluster_id): the pinned `cluster_id`, else
  // derived from the CA file. Public. Empty from a cosigner that predates intents.
  string cluster_id = 3;
}

message GenerateKeyRequest {
  string key_id = 1;  // caller-supplied; regenerating the same id is a no-op, not an error
  string spec = 2;    // "rsa-2048-oaep-sha256", "aes-256-gcm" or "ec-p256-ecies"
}
message GenerateKeyReply {
  string key_id = 1;
  string spec = 2;
  bytes public_key_der = 3;  // X.509 SPKI; empty for symmetric keys
  bool created = 4;          // false = already existed (idempotent retry)
  uint32 replicas = 5;       // how many cosigners hold it, including this one
}

message PublicKeyRequest { string key_id = 1; }
message PublicKeyReply {
  string spec = 1;
  bytes public_key_der = 2;
}

message KeyInfoRequest { string key_id = 1; }
message KeyInfoReply {
  bool exists = 1;
  string spec = 2;
  uint64 created_at = 3;
  uint32 replicas = 4;
}

message DeleteKeyRequest {
  string key_id = 1;
  // Required: purpose "delete-key", signed by the calling client, whose CN must be on every node's
  // hosted_keys.delete_allowlist (with its delete_acl and delete_approval_threshold).
  SignedIntent intent = 2;
}
message DeleteKeyReply {
  bool deleted = 1;      // some node held the key live and tombstoned it
  uint32 tombstones = 2; // how many nodes now hold the tombstone (including this one)
}

message DecryptRequest {
  string key_id = 1;
  bytes ciphertext = 2;
}
message DecryptReply { bytes plaintext = 1; }

message EcdhDeriveRequest {
  string key_id = 1;
  // The sender's ephemeral public key: exactly 65 bytes, uncompressed SEC1 (0x04 ‖ X ‖ Y), on
  // P-256. Compressed, hybrid and SPKI encodings are refused (INVALID_ARGUMENT), as is a point that
  // is not on the curve.
  bytes peer_point = 2;
}
message EcdhDeriveReply {
  // Z: the 32-byte big-endian x-coordinate of d·V (BouncyCastle ECDHBasicAgreement, padded to the
  // field size).
  bytes shared_secret = 1;
}

message HostedKeyStatusRequest { string key_id = 1; }
message HostedKeyStatusReply {
  uint32 identifier = 1;     // the answering node's configured identifier
  bool present = 2;          // false: this node holds no key file under the id
  string spec = 3;
  bytes public_key_der = 4;  // X.509 SPKI; empty for symmetric keys
  uint64 created_at = 5;
}

message SymmetricRequest {
  string key_id = 1;
  bytes data = 2;
}
message SymmetricReply { bytes data = 1; }

// ── hosted-key replication (mesh only) ─────────────────────────────────────────────────────────

// A hosted key sealed to one specific recipient node with HPKE (DHKEM-X25519, HKDF-SHA256,
// AES-256-GCM). The AAD binds cluster, key id, spec and recipient, so an envelope cannot be
// replayed to a different node or key.
message WrappedKey {
  uint32 recipient = 1;
  bytes encapsulated_key = 2;  // HPKE enc
  bytes ciphertext = 3;
  uint32 wrap_version = 4;
}

message ReplicateKeyRequest {
  string ceremony_id = 1;
  string key_id = 2;
  string spec = 3;
  bytes public_key_der = 4;
  WrappedKey wrapped = 5;
}
message ReplicateKeyReply { bytes commitment = 1; }

message FetchKeyRequest { string key_id = 1; }
message FetchKeyReply {
  string spec = 1;
  bytes public_key_der = 2;
  WrappedKey wrapped = 3;
}

message ListKeysRequest {}
message KeyManifest {
  string key_id = 1;
  string spec = 2;
  uint64 created_at = 3;
  // Keyed digest of the key material: lets two nodes agree they hold the SAME key without
  // revealing anything about it off-cluster.
  bytes commitment = 4;
  // A deleted key (audit M2): this node holds its tombstone, not the key. A valid tombstone wins
  // over a live copy: the receiving node verifies delete_intent itself (signature, delete role,
  // ACL, approvals — not its expiry) before it converts its copy or records the tombstone.
  bool tombstone = 5;
  bytes delete_intent = 6;   // serialized SignedIntent
  uint64 deleted_at_ms = 7;
}
message ListKeysReply { repeated KeyManifest keys = 1; }

message PurgeKeyRequest {
  string ceremony_id = 1;
  string key_id = 2;
  // A delete (see Signer.DeleteKey), forwarded by the leader unchanged: this node verifies it and
  // tombstones the key. Absent: a write-quorum rollback (see the Peer.PurgeKey comment).
  SignedIntent intent = 3;
}
message PurgeKeyReply { bool deleted = 1; }

message NodeInfoRequest {}
message NodeInfoReply {
  uint32 identifier = 1;
  bytes dist_public_key = 2;  // X25519, for wrapping hosted keys to this node
  // The hosted-key specs this node can store and serve (as in CapabilitiesReply). Empty from a
  // cosigner older than ec-p256-ecies, or with hosted keys off: a leader refuses to create a key of
  // a spec some peer does not report, so a mixed-version cluster never holds one.
  repeated string hosted_key_specs = 3;
  // The DKG/refresh protocol this node speaks: 2 = direct round-2 delivery + two-phase commit;
  // 0 (absent) from an older cosigner. A leader refuses a ceremony unless every node reports >= 2.
  // dist_public_key is empty when hosted keys are off (this reply no longer fails then).
  uint32 ceremony_protocol = 4;
}

// ── two-phase ceremonies (mesh only) ───────────────────────────────────────────────────────────

message KeyEpochRequest { string key_id = 1; }
message KeyEpochReply {
  bool present = 1;              // a committed key file exists under key_id
  uint64 epoch = 2;              // FROST shares only
  bytes pkp_digest = 3;          // SHA-256 of the canonical public key package
  bytes group_verifying_key = 4; // 32-byte RFC 8032 Ed25519 key
  string origin = 5;             // "dkg", "dealer-split", or "hosted" (not a FROST share)
  bool staged = 6;               // a ceremony for key_id is STAGED here (yes-vote, not resolved)
  string staged_ceremony_id = 7;
  uint64 staged_new_epoch = 8;
  bytes staged_new_pkp_digest = 9;
  // This node found its own share stale (see KeyStatusReply.stale) and refuses to sign with it.
  bool stale = 10;
  string stale_reason = 11;
}

enum CeremonyState {
  CEREMONY_STATE_UNSPECIFIED = 0;
  CEREMONY_STATE_IN_PROGRESS = 1;  // session in memory, before this node's part 3
  CEREMONY_STATE_STAGED = 2;       // yes-vote: new share staged, waiting for every node
  CEREMONY_STATE_COMMITTED = 3;
  CEREMONY_STATE_ABORTED = 4;      // no-vote: this node will never commit it
}
message CeremonyCommitRequest { string ceremony_id = 1; }
message CeremonyStatusRequest { string ceremony_id = 1; }
message CeremonyAbortRequest { string ceremony_id = 1; }
message CeremonyStatusReply {
  CeremonyState state = 1;
  // STAGED / COMMITTED: the outcome voted for — every node must report the same to commit.
  string key_id = 2;
  string kind = 3;
  uint64 new_epoch = 4;
  bytes new_pkp_digest = 5;
  bytes round1_digest = 6;
}

message CeremonyPart1Request {
  string ceremony_id = 1;
  string key_id = 2;
  string kind = 3;              // "dkg" | "refresh"
  repeated uint32 roster = 4;   // every participant; must be exactly the node's own roster
  uint32 protocol = 5;          // the leader's ceremony protocol (2)
}
message CeremonyPart1Reply { bytes round1_package = 1; }  // json round1::Package (public)

message CeremonyPart2Request {
  string ceremony_id = 1;
  bytes round1_map = 2;  // json BTreeMap<Identifier, round1::Package>, every roster node
}
message CeremonyPart2Reply {
  bytes round1_digest = 1;             // the node's digest of the round-1 map
  repeated uint32 delivered_to = 2;    // whom it delivered its round-2 packages to (never the packages)
}

message CeremonyDeliverRequest {
  string ceremony_id = 1;
  uint32 from = 2;            // must equal the caller's certificate identity
  uint32 to = 3;              // must be the receiving node
  bytes round1_digest = 4;    // the sender's digest of the round-1 map
  bytes round2_package = 5;   // json round2::Package for `to` only
}
message CeremonyDeliverReply {}

message CeremonyPart3Request {
  string ceremony_id = 1;
  bytes round1_digest = 2;    // the digest every node reported in part 2
}
message CeremonyPart3Reply {
  uint64 new_epoch = 1;
  bytes new_pkp_digest = 2;
  bytes group_verifying_key = 3;
}
