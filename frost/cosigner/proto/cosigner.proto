syntax = "proto3";
package rutli.cosigner.v1;

// Java/Scala side (the KMS driver's FrostBackend) uses grpc-java stubs generated from this file.
// These options only affect Java codegen; the Rust cosigner (tonic) ignores them.
option java_multiple_files = true;
option java_package = "com.stakecraft.rutli.grpc";
option java_outer_classname = "CosignerProto";

// Client-facing signing API. This is what the Scala FrostBackend (the Canton KMS driver's MPC
// backend) calls. The node it connects to acts as the session leader for that request.
service Signer {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc GroupKey(GroupKeyRequest) returns (GroupKeyReply);
  rpc Dkg(DkgRequest) returns (DkgReply);
  rpc Sign(SignRequest) returns (SignReply);
  // Proactively refresh the shares for a key. Same group key out; shares re-randomized cluster-wide.
  rpc Refresh(RefreshRequest) returns (RefreshReply);
  // This node's local, read-only view of one FROST key — public values only (group key, its own
  // verifying share, the public key package and its digest, provenance). For `rutli-cosigner
  // verify-key`, which asks every node and compares. Allowlisted like GroupKey. The driver does
  // not call it.
  rpc KeyStatus(KeyStatusRequest) returns (KeyStatusReply);
  // Split ceremony verification: sign a fixed, server-computed test digest for an imported key
  // with EXACTLY the given quorum, so every t-subset of cosigners can be proven to sign. The
  // message is never caller-supplied (0x1220 ‖ SHA-256("rutli-verify-key/" ‖ ceremony_id ‖
  // key_id), from the key's recorded provenance), and keys without a dealer-split origin are
  // refused. Callable by the operator role (operator_allowlist) as well as the driver role.
  rpc CeremonySignTest(CeremonySignTestRequest) returns (CeremonySignTestReply);

  // --- cluster-hosted (non-FROST) keys: RSA-2048 and EC P-256 (ECIES) encryption, AES-256-GCM ---
  // These are replicated whole keys, not threshold shares (docs/hosted-keys-design.md). They let a
  // participant run with no HSM and no local key state.

  // What this cluster supports. The driver queries it at startup instead of hardcoding specs, so
  // adding a key type later needs no driver release.
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesReply);
  // Generate a hosted key. key_id is caller-supplied, making retries idempotent.
  rpc GenerateKey(GenerateKeyRequest) returns (GenerateKeyReply);
  // X.509 SubjectPublicKeyInfo DER for an asymmetric hosted key.
  rpc PublicKey(PublicKeyRequest) returns (PublicKeyReply);
  rpc KeyInfo(KeyInfoRequest) returns (KeyInfoReply);
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyReply);
  // RSAES-OAEP-SHA256. The full unpad happens server-side — returning raw c^d mod N would be a
  // padding oracle.
  rpc Decrypt(DecryptRequest) returns (DecryptReply);
  // ECIES (EcP256 / EciesHkdfHmacSha256Aes128Cbc): the static ECDH only, Z = x(d·V) for the
  // sender's ephemeral point V. The driver completes KDF2 + AES-128-CBC + HMAC-SHA256 with
  // BouncyCastle's own IESEngine, so the cluster never reimplements Canton's framing — and a v2
  // threshold P-256 key answers this same RPC from partial points. Charged against the key's
  // decryption rate limit like Decrypt; refused for every spec but "ec-p256-ecies".
  rpc EcdhDerive(EcdhDeriveRequest) returns (EcdhDeriveReply);
  rpc SymmetricEncrypt(SymmetricRequest) returns (SymmetricReply);
  rpc SymmetricDecrypt(SymmetricRequest) returns (SymmetricReply);
  // This node's own copy of one hosted key, public half only, read from its key file — NO
  // read-repair, so a node that lacks the key says so instead of fetching it. For `rutli-cosigner
  // verify-hosted`, which asks every node and compares. Callable by the operator role
  // (operator_allowlist) as well as the driver role, like KeyStatus. The driver does not call it.
  rpc HostedKeyStatus(HostedKeyStatusRequest) returns (HostedKeyStatusReply);
}

// Mesh-internal API: cosigner-to-cosigner. All FROST packages are carried as opaque bytes
// (serde_json of the frost-ed25519 types) so the protocol schema is not pinned into protobuf.
service Peer {
  rpc SignRound1(SignRound1Request) returns (SignRound1Reply);
  rpc SignRound2(SignRound2Request) returns (SignRound2Reply);
  rpc DkgPart1(DkgPart1Request) returns (DkgPart1Reply);
  rpc DkgPart2(DkgPart2Request) returns (DkgPart2Reply);
  rpc DkgPart3(DkgPart3Request) returns (DkgPart3Reply);
  rpc RefreshPart1(RefreshPart1Request) returns (DkgPart1Reply);
  rpc RefreshPart2(DkgPart2Request) returns (DkgPart2Reply);
  rpc RefreshPart3(DkgPart3Request) returns (DkgPart3Reply);
  // Best-effort: drop an in-flight sign session so its round-1 nonces are freed immediately
  // instead of lingering until the pending-TTL sweep. Sent by the leader when a sign gives up.
  rpc AbortSign(AbortSignRequest) returns (AbortSignReply);
  // Cluster-wide ceremony fence: take the per-key guard on every peer BEFORE DKG/refresh crypto,
  // so no node can start a new sign while the ceremony is in flight. Release rolls back a partial
  // fence if a later peer refuses (e.g. has in-flight signs).
  rpc CeremonyFence(CeremonyFenceRequest) returns (CeremonyFenceReply);
  rpc CeremonyRelease(CeremonyReleaseRequest) returns (CeremonyReleaseReply);

  // --- hosted-key replication ---
  // Key material moves between cosigners ONLY over these RPCs, and only ever wrapped to the
  // recipient node (never plaintext-inside-TLS). The Peer API is restricted to cosigner certs by
  // peer_allowlist — the driver must never be able to call it.

  // Push a wrapped hosted key to this node (leader -> peer during generation).
  rpc ReplicateKey(ReplicateKeyRequest) returns (ReplicateKeyReply);
  // Pull a hosted key this node is missing (anti-entropy / read-repair). The responder wraps to
  // the *caller's* node identity, derived from its client certificate.
  rpc FetchKey(FetchKeyRequest) returns (FetchKeyReply);
  // Hosted-key inventory for anti-entropy. FROST shares are never listed or transferred — copying
  // a share would give two nodes the same share and silently break the threshold scheme.
  rpc ListKeys(ListKeysRequest) returns (ListKeysReply);
  // Replicated delete.
  rpc PurgeKey(PurgeKeyRequest) returns (PurgeKeyReply);
  // This node's identifier and X25519 distribution public key (for wrapping hosted keys to it).
  rpc NodeInfo(NodeInfoRequest) returns (NodeInfoReply);
}

message HealthRequest {}
message HealthReply {
  bool ok = 1;
  string detail = 2;
}

message GroupKeyRequest { string key_id = 1; }
message GroupKeyReply { bytes group_verifying_key = 1; } // 32-byte RFC 8032 Ed25519 key

// Coordinate a distributed key generation across the whole configured cluster.
message DkgRequest { string key_id = 1; }
message DkgReply { bytes group_verifying_key = 1; }

// Proactively refresh shares for a key (same group key, re-randomized shares).
message RefreshRequest { string key_id = 1; }
message RefreshReply { bytes group_verifying_key = 1; } // unchanged; returned for confirmation

message CeremonySignTestRequest {
  string key_id = 1;
  // Configured identifiers of the quorum; exactly `threshold` distinct roster members.
  repeated uint32 signers = 2;
}
message CeremonySignTestReply {
  bytes message = 1;    // the 34-byte digest that was signed (server-computed)
  bytes signature = 2;  // 64-byte Ed25519 signature under the group key
}

message KeyStatusRequest { string key_id = 1; }
message KeyStatusReply {
  // This node's FROST identifier, serialized (32-byte little-endian scalar).
  bytes identifier = 1;
  bytes group_verifying_key = 2;   // 32-byte RFC 8032 Ed25519 key
  bytes own_verifying_share = 3;   // this node's verifying share (32-byte point)
  bytes pkp_digest = 4;            // SHA-256 of the canonical public key package
  uint32 threshold = 5;
  bytes public_key_package = 6;    // JSON of the frost-ed25519 PublicKeyPackage (public)
  // "dkg" (born distributed, or written before provenance was recorded) or "dealer-split".
  string origin = 7;
  string ceremony_id = 8;          // dealer-split only
  string canton_fingerprint = 9;   // dealer-split only
  uint64 installed_at = 10;        // dealer-split only, seconds since the Unix epoch
  uint64 refresh_count = 11;       // dealer-split only: refreshes since install
  // dealer-split from a B6 dealer only (empty otherwise): what the key was carried for,
  // "namespace" or "protocol", and its recorded Canton usage, comma-separated as Canton names it
  // ("" = none recorded, which Canton reads as all; "unknown" = plain PKCS#8).
  string carried_for = 12;
  string recorded_usage = 13;
}

message RefreshPart1Request {
  string refresh_id = 1;
  string key_id = 2;
}

message SignRequest {
  string key_id = 1;
  bytes message = 2; // Canton's 34-byte pre-hashed payload
}
message SignReply { bytes signature = 1; } // 64-byte Ed25519 signature

message SignRound1Request {
  string key_id = 1;
  string session_id = 2;
}
message SignRound1Reply { bytes commitments = 1; } // json SigningCommitments

message SignRound2Request {
  string key_id = 1;
  string session_id = 2;
  bytes message = 3;
  bytes commitments_map = 4; // json BTreeMap<Identifier, SigningCommitments>
}
message SignRound2Reply { bytes share = 1; } // json SignatureShare

message AbortSignRequest {
  string key_id = 1;
  string session_id = 2;
}
message AbortSignReply {}

message CeremonyFenceRequest {
  string ceremony_id = 1;
  string key_id = 2;
  // "dkg" or "refresh"
  string kind = 3;
}
message CeremonyFenceReply {}

message CeremonyReleaseRequest {
  string ceremony_id = 1;
  string key_id = 2;
}
message CeremonyReleaseReply {}

message DkgPart1Request {
  string dkg_id = 1;
  string key_id = 2;
  uint32 identifier = 3;
  uint32 max_signers = 4;
  uint32 min_signers = 5;
}
message DkgPart1Reply { bytes round1_package = 1; }

message DkgPart2Request {
  string dkg_id = 1;
  bytes round1_map = 2; // json BTreeMap<Identifier, round1::Package>
}
message DkgPart2Reply { bytes round2_map = 1; } // json BTreeMap<Identifier, round2::Package> (addressed to others)

message DkgPart3Request {
  string dkg_id = 1;
  bytes round1_map = 2;        // json BTreeMap<Identifier, round1::Package>
  bytes round2_map_for_me = 3; // json BTreeMap<Identifier, round2::Package> addressed to this node
}
message DkgPart3Reply { bytes group_verifying_key = 1; }

// ── cluster-hosted keys ────────────────────────────────────────────────────────────────────────

message CapabilitiesRequest {}
message CapabilitiesReply {
  // Spec identifiers this cluster can generate/serve: "rsa-2048-oaep-sha256", "aes-256-gcm",
  // "ec-p256-ecies".
  repeated string hosted_key_specs = 1;
  bool hosted_keys_enabled = 2;
}

message GenerateKeyRequest {
  string key_id = 1;  // caller-supplied; regenerating the same id is a no-op, not an error
  string spec = 2;    // "rsa-2048-oaep-sha256", "aes-256-gcm" or "ec-p256-ecies"
}
message GenerateKeyReply {
  string key_id = 1;
  string spec = 2;
  bytes public_key_der = 3;  // X.509 SPKI; empty for symmetric keys
  bool created = 4;          // false = already existed (idempotent retry)
  uint32 replicas = 5;       // how many cosigners hold it, including this one
}

message PublicKeyRequest { string key_id = 1; }
message PublicKeyReply {
  string spec = 1;
  bytes public_key_der = 2;
}

message KeyInfoRequest { string key_id = 1; }
message KeyInfoReply {
  bool exists = 1;
  string spec = 2;
  uint64 created_at = 3;
  uint32 replicas = 4;
}

message DeleteKeyRequest { string key_id = 1; }
message DeleteKeyReply { bool deleted = 1; }

message DecryptRequest {
  string key_id = 1;
  bytes ciphertext = 2;
}
message DecryptReply { bytes plaintext = 1; }

message EcdhDeriveRequest {
  string key_id = 1;
  // The sender's ephemeral public key: exactly 65 bytes, uncompressed SEC1 (0x04 ‖ X ‖ Y), on
  // P-256. Compressed, hybrid and SPKI encodings are refused (INVALID_ARGUMENT), as is a point that
  // is not on the curve.
  bytes peer_point = 2;
}
message EcdhDeriveReply {
  // Z: the 32-byte big-endian x-coordinate of d·V (BouncyCastle ECDHBasicAgreement, padded to the
  // field size).
  bytes shared_secret = 1;
}

message HostedKeyStatusRequest { string key_id = 1; }
message HostedKeyStatusReply {
  uint32 identifier = 1;     // the answering node's configured identifier
  bool present = 2;          // false: this node holds no key file under the id
  string spec = 3;
  bytes public_key_der = 4;  // X.509 SPKI; empty for symmetric keys
  uint64 created_at = 5;
}

message SymmetricRequest {
  string key_id = 1;
  bytes data = 2;
}
message SymmetricReply { bytes data = 1; }

// ── hosted-key replication (mesh only) ─────────────────────────────────────────────────────────

// A hosted key sealed to one specific recipient node with HPKE (DHKEM-X25519, HKDF-SHA256,
// AES-256-GCM). The AAD binds cluster, key id, spec and recipient, so an envelope cannot be
// replayed to a different node or key.
message WrappedKey {
  uint32 recipient = 1;
  bytes encapsulated_key = 2;  // HPKE enc
  bytes ciphertext = 3;
  uint32 wrap_version = 4;
}

message ReplicateKeyRequest {
  string ceremony_id = 1;
  string key_id = 2;
  string spec = 3;
  bytes public_key_der = 4;
  WrappedKey wrapped = 5;
}
message ReplicateKeyReply { bytes commitment = 1; }

message FetchKeyRequest { string key_id = 1; }
message FetchKeyReply {
  string spec = 1;
  bytes public_key_der = 2;
  WrappedKey wrapped = 3;
}

message ListKeysRequest {}
message KeyManifest {
  string key_id = 1;
  string spec = 2;
  uint64 created_at = 3;
  // Keyed digest of the key material: lets two nodes agree they hold the SAME key without
  // revealing anything about it off-cluster.
  bytes commitment = 4;
}
message ListKeysReply { repeated KeyManifest keys = 1; }

message PurgeKeyRequest {
  string ceremony_id = 1;
  string key_id = 2;
}
message PurgeKeyReply { bool deleted = 1; }

message NodeInfoRequest {}
message NodeInfoReply {
  uint32 identifier = 1;
  bytes dist_public_key = 2;  // X25519, for wrapping hosted keys to this node
  // The hosted-key specs this node can store and serve (as in CapabilitiesReply). Empty from a
  // cosigner older than ec-p256-ecies, or with hosted keys off: a leader refuses to create a key of
  // a spec some peer does not report, so a mixed-version cluster never holds one.
  repeated string hosted_key_specs = 3;
}
