// Throwaway Canton node for generating rutli-canton-key test vectors. NOT a real deployment.
//
// One participant, in-memory storage, default JCE crypto, no synchronizer. The admin/ledger APIs
// bind to loopback only; nothing is reachable from outside the machine and nothing is persisted.
canton {
  // keys.secret.download (ExportKeyPair) is a preview command, and the gRPC handler additionally
  // refuses unless preview features are enabled (GrpcVaultService.scala:589-597).
  features.enable-preview-commands = yes

  participants {
    participant1 {
      storage.type = memory
      admin-api {
        address = "127.0.0.1"
        port = 25012
      }
      ledger-api {
        address = "127.0.0.1"
        port = 25011
      }
      http-ledger-api {
        address = "127.0.0.1"
        port = 25013
      }
    }
  }
}
