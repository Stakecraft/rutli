#
# cargo-deny policy for the Rust workspace. CI runs `cargo deny check advisories licenses bans sources`;
# a RustSec vulnerability, unsound or unmaintained advisory in the lockfile fails the build.
# about.toml must accept the same licenses.

[graph]
# Every target a release is built for: the cosigner image (Linux, amd64 and arm64) and the dealer
# (macOS arm64, Linux).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Vulnerabilities, unsound and unmaintained advisories all fail the build (cargo-deny 0.20: the
# `unmaintained` scope covers the whole dependency graph, `unsound` likewise). Yanked crates only warn.
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
  # Unmaintained, no patched release exists. Used only to read PEM files: directly by the cosigner
  # (loading its own TLS material at start-up) and by tonic's TLS config. No known vulnerability; the
  # fix is a migration to rustls-pki-types' PemObject, tracked with the tonic upgrade.
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; PEM parsing only, migrate to rustls-pki-types with the tonic upgrade" },
  # heapless 0.7.17, unsound, fixed only in 0.9.4. It comes in through postcard 1.1.3 (default
  # feature "heapless-cas") <- frost-core 2.2.0; no compatible postcard release moves to heapless 0.9.
  # None of the affected functions is reachable from our build: frost-core calls only
  # postcard::to_allocvec and postcard::from_bytes (alloc Vec), postcard itself uses only
  # heapless::Vec and heapless::String outside its tests, and our crates do not depend on heapless.
  # The affected APIs are SortedLinkedList, Spsc, IndexMap, Deque, HistoryBuf and the pools. Drop
  # these entries when frost-core or postcard moves to heapless >= 0.9.4.
  { id = "RUSTSEC-2026-0574", reason = "heapless SortedLinkedList::FindMutView::pop; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0575", reason = "heapless Spsc::peek; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0576", reason = "heapless IndexMap::truncate; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0577", reason = "heapless Deque/HistoryBuf/IndexMap clear and retain; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0578", reason = "heapless SortedLinkedList::zeroize; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0579", reason = "heapless Deque::try_from, affects 0.9.2-0.9.3 only; we have 0.7.17" },
  { id = "RUSTSEC-2026-0580", reason = "heapless pool treiber stack; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0581", reason = "heapless Deque::make_contiguous; unused (postcard via frost-core uses only Vec/String)" },
  { id = "RUSTSEC-2026-0582", reason = "heapless IndexMap::insert; unused (postcard via frost-core uses only Vec/String)" },
]

[licenses]
# Permissive licenses only. A crate offered under a choice (for example
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later") passes when one of its options is on this list, and that
# option is the one we take. Copyleft (GPL, LGPL, AGPL, MPL, EUPL, ...) is not accepted.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
# The workspace crates depend on each other by path; none is published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
