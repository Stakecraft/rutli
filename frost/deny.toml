#
# cargo-deny policy for the Rust workspace. CI runs `cargo deny check advisories licenses bans sources`;
# a RustSec vulnerability, unsound or unmaintained advisory in the lockfile fails the build.
# about.toml must accept the same licenses.

[graph]
# Every target a release is built for: the cosigner image (Linux, amd64 and arm64) and the dealer
# (macOS arm64, Linux).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
# Vulnerabilities, unsound and unmaintained advisories all fail the build (cargo-deny 0.20: the
# `unmaintained` scope covers the whole dependency graph, `unsound` likewise). Yanked crates only warn.
unmaintained = "all"
unsound = "all"
yanked = "warn"
ignore = [
  # Unmaintained, no patched release exists. Used only to read PEM files: directly by the cosigner
  # (loading its own TLS material at start-up) and by tonic's TLS config. No known vulnerability; the
  # fix is a migration to rustls-pki-types' PemObject, tracked with the tonic upgrade.
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; PEM parsing only, migrate to rustls-pki-types with the tonic upgrade" },
  # heapless 0.7.17, unsound (fixed in 0.9.4). It comes in only as heapless <- postcard 1.1.3 <-
  # frost-core 2.2.0. frost-core takes postcard with its default features, which turn on
  # `heapless-cas`, so our workspace cannot switch it off; no postcard 1.x and no frost-core release
  # (3.0.0 included) depends on heapless 0.9. frost-core calls only postcard::to_allocvec and
  # postcard::from_bytes (frost-core src/serialization.rs), on its own serde types, none of which
  # holds a heapless type; those two functions use the AllocVec flavour and the slice
  # deserializer, which do not touch heapless. postcard uses heapless only for heapless::Vec /
  # String (to_vec, to_vec_cobs, the HVec flavour, MaxSize impls); outside its own tests it
  # uses none of the types below,
  # and our crates do not depend on postcard or heapless. Check: `nm` on release and debug builds
  # of rutli-cosigner and rutli-dealer lists no heapless symbol and `strings` finds no heapless
  # source path (postcard's are there). Remove these entries when frost-core or postcard moves to
  # heapless >= 0.9.4 or makes it optional.
  { id = "RUSTSEC-2026-0574", reason = "heapless 0.7 sorted_linked_list FindMut::pop; postcard never uses SortedLinkedList, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0575", reason = "heapless 0.7 spsc::Consumer/Queue::peek ordering; postcard never uses spsc, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0576", reason = "heapless IndexMap::truncate; absent in 0.7.17 and postcard never uses IndexMap, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0577", reason = "heapless panicking Drop in clear/retain/truncate/IntoIter::drop/HistoryBuffer::write; frost-core's postcard paths build no heapless value, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0578", reason = "heapless SortedLinkedList Zeroize impl; absent in 0.7.17 and postcard never uses SortedLinkedList, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0579", reason = "heapless Deque::try_from (0.9.2 to 0.9.3); absent in 0.7.17 and postcard never uses Deque, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0580", reason = "heapless 0.7 pool (Treiber stack, compiled with `cas`); postcard never uses pool, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0581", reason = "heapless Deque::make_contiguous; absent in 0.7.17 and postcard never uses Deque, no heapless code in our binaries" },
  { id = "RUSTSEC-2026-0582", reason = "heapless IndexMap::insert at u16::MAX entries; postcard never uses IndexMap, no heapless code in our binaries" },
]

[licenses]
# Permissive licenses only. A crate offered under a choice (for example
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later") passes when one of its options is on this list, and that
# option is the one we take. Copyleft (GPL, LGPL, AGPL, MPL, EUPL, ...) is not accepted.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
# The workspace crates depend on each other by path; none is published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
