#
# cargo-deny policy for the Rust workspace. CI runs `cargo deny check licenses bans sources`
# (advisories are not gated yet). about.toml must accept the same licenses.

[graph]
# Every target a release is built for: the cosigner image (Linux, amd64 and arm64) and the dealer
# (macOS arm64, Linux).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[licenses]
# Permissive licenses only. A crate offered under a choice (for example
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later") passes when one of its options is on this list, and that
# option is the one we take. Copyleft (GPL, LGPL, AGPL, MPL, EUPL, ...) is not accepted.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
# The workspace crates depend on each other by path; none is published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
