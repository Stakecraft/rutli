[workspace]
resolver = "2"
members = ["core", "cosigner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Stakecraft/rutli"

[workspace.dependencies]
frost-ed25519 = "2"
frost-core = "2"
rand = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "2"
tonic = { version = "0.12", features = ["tls"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
x509-parser = "0.16"
rcgen = "0.13"
