[workspace]
resolver = "2"
members = ["core", "cosigner", "canton-key"]

[workspace.package]
version = "0.4.0-rc.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Stakecraft/rutli"

[workspace.dependencies]
frost-ed25519 = "2"
frost-core = "2"
rand = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "2"
tonic = { version = "0.12", features = ["tls"] }
tonic-build = "0.12"
protoc-bin-vendored = "3"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
argon2 = "0.5"
x509-parser = "0.16"
rcgen = "0.13"
metrics = "0.24"
# RSA-OAEP for cluster-hosted keys. Deliberately NOT the pure-Rust `rsa` crate: RUSTSEC-2023-0071
# (Marvin timing side-channel, key recovery by a network attacker) is still unpatched, and this is
# a network-facing decryption service. aws-lc-rs is FIPS-validated and constant-time.
aws-lc-rs = "1.18"
# X25519 for wrapping hosted key material to a specific peer node (see cosigner/src/wrap.rs).
x25519-dalek = { version = "2", features = ["static_secrets"] }
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
# Strict DER PKCS#8 decoding for imported Canton keys (canton-key). Already in the lock through
# ed25519-dalek; RustCrypto, rejects trailing data.
pkcs8 = { version = "0.10", default-features = false }
# PEM bodies of imported PKCS#8 keys (canton-key). Already in the lock through rcgen.
base64 = "0.22"
# rutli-dealer's process hardening (setrlimit, prctl, mlockall). Already in the lock through tokio.
libc = "0.2"
# verify-key's TLS probe (cosigner/src/tls_probe.rs): a bare handshake that surfaces the TLS alert
# a node refuses a client certificate with, which tonic can lose. Already in the lock through tonic,
# with the same features (ring, tls12), so tonic's own TLS is unchanged.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
rustls-pemfile = "2"
